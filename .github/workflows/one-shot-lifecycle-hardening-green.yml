name: One-shot lifecycle hardening green verification

on:
  push:
    branches: [agent/persist-remote-batch-lifecycle]
    paths:
      - .github/workflows/one-shot-lifecycle-hardening-green.yml

permissions:
  contents: write

concurrency:
  group: one-shot-lifecycle-hardening-green
  cancel-in-progress: true

jobs:
  verify-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout lifecycle branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/persist-remote-batch-lifecycle
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify focused lifecycle contract
        run: uv run pytest -q tests/test_remote_batch_lifecycle.py
      - name: Verify complete quality and package gates
        run: |
          set -euo pipefail
          uv run pytest -q -m "not integration"
          uv run python -m compileall -q pg_llm_batch
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-report=term-missing --cov-fail-under=100
          uv lock --check
          uv build --no-sources
          git diff --check
      - name: Verify container definitions
        run: |
          set -euo pipefail
          docker compose config >/dev/null
          docker build --tag pg-llm-batch:lifecycle .
          docker build --tag pg-llm-batch-postgres:lifecycle docker/postgres
      - name: Record green evidence and remove one-shot workflow
        env:
          BRANCH_NAME: agent/persist-remote-batch-lifecycle
          VERIFIED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat > docs/superpowers/evidence/2026-08-04-remote-lifecycle-hardening-green.md <<EOF
          # Durable Remote Lifecycle Hardening Green Evidence

          Verified implementation head before this evidence commit: \`${VERIFIED_HEAD}\`.

          The one-shot workflow completed successfully on Python 3.14 and removed itself before publishing this evidence. It verified:

          - the focused durable lifecycle test module;
          - the complete non-integration test suite;
          - Ruff and Python bytecode compilation;
          - 100% production docstring, statement, and branch coverage;
          - lockfile freshness and wheel/source distribution construction;
          - Docker Compose configuration;
          - component and PostgreSQL runtime image builds.

          This implementation evidence does not replace exact-head pull-request CI, SAST Semgrep, Security Scan, or review gates.
          EOF
          rm .github/workflows/one-shot-lifecycle-hardening-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/superpowers/evidence/2026-08-04-remote-lifecycle-hardening-green.md \
            .github/workflows/one-shot-lifecycle-hardening-green.yml
          git commit -m "docs(lifecycle): record ordered persistence verification"
          git push origin "HEAD:${BRANCH_NAME}"
