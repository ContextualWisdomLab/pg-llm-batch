[build-system]
requires = ["uv_build==0.12.10"]
build-backend = "uv_build"

[project]
name = "pg-llm-batch"
version = "0.1.0"
description = "Standalone + submodule Postgres LLM batch engine: pg_tiktoken token counting + batch submit/poll/retrieve"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ContextualWisdomLab" }]
keywords = ["postgres", "llm", "batch", "pg_tiktoken", "tokenization"]
dependencies = [
    "psycopg[binary]>=3.1",
    "aiohttp>=3.14.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff==0.16.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
pg-llm-batch = "pg_llm_batch.cli:main"

[tool.uv]
package = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["pg_llm_batch"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
]
