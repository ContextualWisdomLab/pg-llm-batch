name: Repair Ruff lockfile

on:
  push:
    branches:
      - dependabot/pip/ruff-0.16.1

permissions:
  contents: write

concurrency:
  group: repair-ruff-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-lockfile:
    if: github.actor == 'seonghobae'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Regenerate only the Ruff lock entry
        shell: bash
        run: |
          set -euo pipefail
          uv lock --upgrade-package 'ruff==0.16.1'
          uv lock --check
          changed="$(git status --short)"
          if [[ "$changed" != " M uv.lock" ]]; then
            printf 'Unexpected changed files after lock repair:\n%s\n' "$changed" >&2
            exit 1
          fi
      - name: Commit repaired lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'chore(deps): refresh uv lock for ruff 0.16.1'
          git push origin "HEAD:${GITHUB_REF_NAME}"
