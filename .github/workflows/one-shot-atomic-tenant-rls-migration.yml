name: One-shot atomic tenant RLS migration

on:
  push:
    branches: [agent/tenant-scoped-lifecycle]
    paths:
      - .github/workflows/one-shot-atomic-tenant-rls-migration.yml

permissions:
  contents: read

concurrency:
  group: one-shot-atomic-tenant-rls-migration
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair-and-verify:
    if: >-
      github.repository == 'ContextualWisdomLab/pg-llm-batch' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/agent/tenant-scoped-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Refuse stale state or competing writers
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_PARENT: 57b69401e1e247b7640a22461ccf09e625db6699
          EXPECTED_BASE: f0c5f79c5327a090014dd5558750110fce9fd2ac
          BRANCH_NAME: agent/tenant-scoped-lifecycle
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/$BRANCH_NAME | cut -f1)" = "$GITHUB_SHA"
          mapfile -t writers < <(find .github/workflows -maxdepth 1 -type f \
            \( -name '*one-shot*.yml' -o -name '*repair*.yml' \) -print | sort)
          test "${#writers[@]}" -eq 1
          test "${writers[0]}" = ".github/workflows/one-shot-atomic-tenant-rls-migration.yml"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Replace the owner-bypass window with one atomic statement
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python - <<'PY'
          from pathlib import Path

          canonical_path = Path("pg_llm_batch/schema.sql")
          mirror_path = Path("docker/postgres/init/02_schema.sql")
          canonical = canonical_path.read_text(encoding="utf-8")
          mirror = mirror_path.read_text(encoding="utf-8")
          if mirror != canonical:
              raise SystemExit("PostgreSQL image schema drifted before migration repair")

          start_marker = (
              "-- Reapplying the schema may occur after FORCE RLS was installed."
          )
          end_marker = (
              "DROP INDEX IF EXISTS idx_llm_remote_batch_jobs_status_observed;"
          )
          start = canonical.index(start_marker)
          end = canonical.index(end_marker, start)
          replacement = '''-- Reapplying the schema may occur after FORCE RLS was installed. psql
-- can autocommit individual statements, so the owner transition, legacy-row
-- backfill, and constraint migration execute inside one anonymous block. If any
-- operation fails, PostgreSQL rolls the entire statement back and FORCE RLS is
-- never left disabled between committed statements.
DO $$
BEGIN
    ALTER TABLE llm_remote_batch_jobs NO FORCE ROW LEVEL SECURITY;
    ALTER TABLE llm_remote_batch_jobs
        ADD COLUMN IF NOT EXISTS tenant_scope TEXT;
    UPDATE llm_remote_batch_jobs
    SET tenant_scope = 'standalone'
    WHERE tenant_scope IS NULL;
    ALTER TABLE llm_remote_batch_jobs
        ALTER COLUMN tenant_scope SET DEFAULT 'standalone';
    ALTER TABLE llm_remote_batch_jobs
        ALTER COLUMN tenant_scope SET NOT NULL;

    IF EXISTS (
        SELECT 1
        FROM pg_constraint
        WHERE conname = 'uq_llm_remote_batch_jobs_endpoint_id'
          AND conrelid = 'llm_remote_batch_jobs'::regclass
    ) THEN
        ALTER TABLE llm_remote_batch_jobs
            DROP CONSTRAINT uq_llm_remote_batch_jobs_endpoint_id;
    END IF;

    IF NOT EXISTS (
        SELECT 1
        FROM pg_constraint
        WHERE conname = 'ck_llm_remote_batch_jobs_tenant_scope'
          AND conrelid = 'llm_remote_batch_jobs'::regclass
    ) THEN
        ALTER TABLE llm_remote_batch_jobs
            ADD CONSTRAINT ck_llm_remote_batch_jobs_tenant_scope
            CHECK (
                tenant_scope ~ '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
            ) NOT VALID;
    END IF;
    ALTER TABLE llm_remote_batch_jobs
        VALIDATE CONSTRAINT ck_llm_remote_batch_jobs_tenant_scope;

    IF NOT EXISTS (
        SELECT 1
        FROM pg_constraint
        WHERE conname = 'uq_llm_remote_batch_jobs_tenant_endpoint_id'
          AND conrelid = 'llm_remote_batch_jobs'::regclass
    ) THEN
        ALTER TABLE llm_remote_batch_jobs
            ADD CONSTRAINT uq_llm_remote_batch_jobs_tenant_endpoint_id
            UNIQUE (tenant_scope, endpoint_alias, remote_batch_id);
    END IF;

    ALTER TABLE llm_remote_batch_jobs FORCE ROW LEVEL SECURITY;
END $$;

'''
          repaired = canonical[:start] + replacement + canonical[end:]
          migration = repaired[start : repaired.index(end_marker, start)]
          if "DISABLE ROW LEVEL SECURITY" in migration:
              raise SystemExit("owner-bypass migration still disables row security")
          required = (
              "NO FORCE ROW LEVEL SECURITY",
              "ADD COLUMN IF NOT EXISTS tenant_scope TEXT",
              "SET tenant_scope = 'standalone'",
              "ALTER COLUMN tenant_scope SET NOT NULL",
              "FORCE ROW LEVEL SECURITY",
          )
          if any(token not in migration for token in required):
              raise SystemExit("atomic tenant migration is incomplete")
          canonical_path.write_text(repaired, encoding="utf-8")
          mirror_path.write_text(repaired, encoding="utf-8")
          PY
          git diff --check

      - name: Verify the focused RED regression is now GREEN
        run: >-
          uv run pytest -q
          tests/test_tenant_lifecycle_schema.py::test_rls_owner_transition_is_atomic_for_psql_reapplication
          tests/test_tenant_lifecycle_schema.py::test_legacy_lifecycle_rows_are_backfilled_without_deletion
          tests/test_tenant_lifecycle_schema.py::test_lifecycle_row_security_is_forced_and_default_deny
          tests/test_tenant_lifecycle_schema.py::test_postgres_image_uses_the_exact_canonical_schema

      - name: Verify complete deterministic quality contract
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          uv run python -m compileall -q pg_llm_batch tests
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-branch --cov-report=term-missing \
            --cov-fail-under=100
          uv lock --check
          rm -rf build dist
          uv build --no-sources
          docker compose config >/dev/null
          docker build --tag pg-llm-batch:tenant-rls-verify .
          docker build --tag pg-llm-batch-postgres:tenant-rls-verify docker/postgres

      - name: Record immutable evidence and remove temporary automation
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          SOURCE_HEAD: ${{ github.sha }}
        run: |
          rm .github/workflows/one-shot-atomic-tenant-rls-migration.yml
          rm -rf .coverage .coverage.* htmlcov build dist
          mkdir -p docs/superpowers/evidence
          cat > docs/superpowers/evidence/2026-08-05-atomic-tenant-rls-migration.md <<EOF
          # Atomic Tenant RLS Migration Evidence

          - RED source head: \`e4d44690cba4659f8e7af8b1eaebde4eba4e56eb\`
          - RED CI run: \`31002630597\` (Python 3.10, 3.12, and 3.14 each failed only the atomic migration regression; container builds passed).
          - Verification workflow source head: \`$SOURCE_HEAD\`
          - The regression failed because the prior migration committed a separate
            \`DISABLE ROW LEVEL SECURITY\` statement before restoring owner enforcement.
          - One PostgreSQL anonymous block now performs the owner transition,
            standalone backfill, constraint migration, and FORCE RLS restoration.
          - Focused schema contracts and the complete non-integration suite passed.
          - Production statement coverage, branch coverage, and docstring coverage
            were each 100%; Ruff, compilation, lock freshness, distributions,
            Compose validation, and both container builds passed.
          - The temporary write-capable workflow removed itself from the final tree.
          EOF
          test ! -e .github/workflows/one-shot-atomic-tenant-rls-migration.yml
          test "$(cat pg_llm_batch/schema.sql)" = "$(cat docker/postgres/init/02_schema.sql)"
          git diff --check

      - name: Publish only from the unchanged exact remote head
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          BRANCH_NAME: agent/tenant-scoped-lifecycle
          EXPECTED_HEAD: ${{ github.sha }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/$BRANCH_NAME | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No verified RLS migration repair generated" >&2; exit 1; }
          git commit -m "fix(schema): make tenant RLS migration atomic"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:${BRANCH_NAME}"
