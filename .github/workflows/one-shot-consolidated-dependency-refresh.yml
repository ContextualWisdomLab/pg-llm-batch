name: One-shot consolidated dependency refresh

on:
  push:
    branches: [agent/consolidated-dependency-refresh]
    paths:
      - .github/workflows/one-shot-consolidated-dependency-refresh.yml

permissions:
  contents: write

concurrency:
  group: one-shot-consolidated-dependency-refresh
  cancel-in-progress: true

jobs:
  refresh-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout refresh branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/consolidated-dependency-refresh
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Define and prove the dependency contract is red
        run: |
          cat > tests/test_dependency_refresh_contract.py <<'PY'
          # SPDX-License-Identifier: Apache-2.0
          """Contract tests for immutable, cost-bounded dependency refreshes."""

          from __future__ import annotations

          from pathlib import Path


          def test_ci_uses_reviewed_action_commits_and_explicit_cache_pruning() -> None:
              """CI pins reviewed actions and preserves the prior cache-cost policy."""
              workflow = Path(".github/workflows/ci.yml").read_text(encoding="utf-8")
              assert "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" in workflow
              assert "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" in workflow
              assert "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97" in workflow
              assert "astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9" in workflow
              assert workflow.count("prune-cache: true") == 2


          def test_container_build_inputs_use_reviewed_immutable_digests() -> None:
              """Both deployable build graphs use the consolidated immutable digests."""
              component = Path("Dockerfile").read_text(encoding="utf-8")
              postgres = Path("docker/postgres/Dockerfile").read_text(encoding="utf-8")
              assert component.count("sha256:cea0e6040540fb2b965b6e7fb5ffa00871e632eef63719f0ea54bca189ce14a6") == 2
              assert "sha256:99e09cb2284e2ddbb73a995deee3e91783fd04d177602ccf6eab326d778ee777" in postgres


          def test_ruff_patch_release_is_locked_in_project_and_lockfile() -> None:
              """The lint tool update is represented consistently in both lock sources."""
              project = Path("pyproject.toml").read_text(encoding="utf-8")
              lockfile = Path("uv.lock").read_text(encoding="utf-8")
              assert '"ruff==0.16.1"' in project
              assert 'name = "ruff"\nversion = "0.16.1"' in lockfile
          PY
          set +e
          uv run pytest -q tests/test_dependency_refresh_contract.py > dependency-refresh-red.log 2>&1
          status=$?
          set -e
          cat dependency-refresh-red.log
          if [ "$status" -eq 0 ]; then
            echo "::error::Dependency contract unexpectedly passed before the refresh."
            exit 1
          fi
          if ! grep -q "AssertionError" dependency-refresh-red.log; then
            echo "::error::The red contract failed for an unexpected reason."
            exit 1
          fi

      - name: Apply the consolidated dependency refresh
        run: |
          python - <<'PY'
          from pathlib import Path


          def replace_all(path: str, replacements: tuple[tuple[str, str], ...]) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              for old, new in replacements:
                  count = text.count(old)
                  if count == 0:
                      raise SystemExit(f"{path}: missing expected value {old!r}")
                  text = text.replace(old, new)
              target.write_text(text, encoding="utf-8")


          replace_all(
              ".github/workflows/ci.yml",
              (
                  (
                      "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4",
                      "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0",
                  ),
                  (
                      "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0",
                      "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1",
                  ),
                  (
                      "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0",
                      "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0",
                  ),
                  (
                      "uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2\n",
                      "uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0\n        with:\n          prune-cache: true\n",
                  ),
              ),
          )
          replace_all(
              "Dockerfile",
              ((
                  "sha256:d3400aa122fa42cf0af0dbe8ec3091b047eac5c8f7e3539f7135e86d855dc015",
                  "sha256:cea0e6040540fb2b965b6e7fb5ffa00871e632eef63719f0ea54bca189ce14a6",
              ),),
          )
          replace_all(
              "docker/postgres/Dockerfile",
              ((
                  "sha256:6d220bf85c74e842a79da63997af8d2e74455c0b8847d8bb3a5888572334991d",
                  "sha256:99e09cb2284e2ddbb73a995deee3e91783fd04d177602ccf6eab326d778ee777",
              ),),
          )
          replace_all(
              "pyproject.toml",
              (("\"ruff==0.16.0\"", "\"ruff==0.16.1\""),),
          )

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          entry = (
              "\n### Changed\n\n"
              "- Consolidated immutable CI action, Python image, Rust toolchain image, "
              "and Ruff patch updates; setup-uv cache pruning is explicit to preserve "
              "the previous bounded cache-cost policy.\n"
          )
          if "Consolidated immutable CI action" not in changelog:
              changelog = changelog.replace("\n## [0.1.0]", entry + "\n## [0.1.0]", 1)
              changelog_path.write_text(changelog, encoding="utf-8")
          PY
          uv lock

      - name: Verify the complete refreshed product tree
        run: |
          set -euo pipefail
          uv sync --locked
          uv run pytest -q tests/test_dependency_refresh_contract.py
          uv run pytest -q -m "not integration"
          uv run python -m compileall -q pg_llm_batch
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-report=term-missing --cov-fail-under=100
          uv lock --check
          uv build --no-sources
          docker compose config >/dev/null
          docker build --tag pg-llm-batch:dependency-refresh .
          docker build --tag pg-llm-batch-postgres:dependency-refresh docker/postgres

      - name: Publish the verified refresh and remove this workflow
        env:
          BRANCH_NAME: agent/consolidated-dependency-refresh
        run: |
          rm .github/workflows/one-shot-consolidated-dependency-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            Dockerfile \
            docker/postgres/Dockerfile \
            pyproject.toml \
            uv.lock \
            CHANGELOG.md \
            tests/test_dependency_refresh_contract.py \
            .github/workflows/one-shot-consolidated-dependency-refresh.yml
          git commit -m "chore(deps): consolidate immutable dependency refreshes"
          git push origin "HEAD:${BRANCH_NAME}"
