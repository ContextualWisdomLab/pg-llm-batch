name: One-shot fix bounded control repair anchors

on:
  push:
    branches: [agent/bounded-control-plane-json]
    paths:
      - .github/workflows/one-shot-fix-bounded-control-repair.yml

permissions:
  contents: write

jobs:
  repair-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/bounded-control-plane-json
          fetch-depth: 0

      - name: Repair method-boundary anchors and publish
        env:
          BRANCH_NAME: agent/bounded-control-plane-json
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/one-shot-bounded-control-json-repair.yml")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'client.index("    async def _read_json_object(\\n")':
                  'client.index("    async def _read_json_object")',
              'client.index("    def _download_limit_error(\\n", json_start)':
                  'client.index("    def _download_limit_error", json_start)',
              'client.index("    async def _read_bounded_utf8(\\n", limit_start)':
                  'client.index("    async def _read_bounded_utf8", limit_start)',
              'client.index("    async def _read_bounded_utf8(\\n")':
                  'client.index("    async def _read_bounded_utf8")',
              'client.index("    def _headers(\\n", reader_start)':
                  'client.index("    def _headers", reader_start)',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected one workflow anchor: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/one-shot-fix-bounded-control-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/one-shot-bounded-control-json-repair.yml \
            .github/workflows/one-shot-fix-bounded-control-repair.yml
          git commit -m "ci: fix bounded control repair method anchors"
          git push origin "HEAD:${BRANCH_NAME}"
