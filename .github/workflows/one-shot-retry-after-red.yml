name: One-shot Retry-After red verification

on:
  push:
    branches: [agent/harden-retry-after-parsing]
    paths:
      - .github/workflows/one-shot-retry-after-red.yml

permissions:
  contents: write

concurrency:
  group: one-shot-retry-after-red
  cancel-in-progress: true

jobs:
  verify-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/harden-retry-after-parsing
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true
      - name: Add focused hostile-header tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_idempotent_get_retries.py")
          source = path.read_text(encoding="utf-8")
          marker = "test_retry_after_parser_rejects_non_ascii_decimal_digits"
          if marker in source:
              raise SystemExit("focused Retry-After hardening tests already exist")
          source += '''


          @pytest.mark.parametrize("value", ["٠", "１２", "２"])
          def test_retry_after_parser_rejects_non_ascii_decimal_digits(value: str) -> None:
              """HTTP delay-seconds accept RFC ASCII DIGIT tokens only."""
              now = datetime(2026, 8, 4, tzinfo=timezone.utc)
              assert client_mod._parse_retry_after(value, now) is None


          async def test_extreme_ascii_retry_after_is_refused_without_exception(
              monkeypatch,
          ) -> None:
              """An extreme RFC-valid delay cannot escape or force an untrusted wait."""
              sleeps: list[float] = []

              async def record_sleep(delay: float) -> None:
                  sleeps.append(delay)

              monkeypatch.setattr(client_mod.asyncio, "sleep", record_sleep)
              response = Response(
                  429,
                  {"error": "rate-limited"},
                  headers={"Retry-After": "9" * 10_000},
              )
              session = SequenceSession([response])
              client = BatchAPIClient(
                  "postgresql://x",
                  credentials,
                  retry_max_delay_seconds=30,
              )
              client._session = session

              with pytest.raises(GatewayError, match="Batch status failed") as exc_info:
                  await client.get_batch_status("batch-1", "default")

              assert exc_info.value.status_code == 429
              assert response.exit_count == 1
              assert sleeps == []
              assert len(session.calls) == 1


          async def test_non_ascii_retry_after_uses_bounded_fallback(monkeypatch) -> None:
              """Non-RFC decimal lookalikes select bounded fallback, not exact delay."""
              sleeps: list[float] = []

              async def record_sleep(delay: float) -> None:
                  sleeps.append(delay)

              monkeypatch.setattr(client_mod.asyncio, "sleep", record_sleep)
              monkeypatch.setattr(client_mod.random, "uniform", lambda _low, high: high)
              session = SequenceSession(
                  [
                      Response(503, {"error": "busy"}, headers={"Retry-After": "２"}),
                      Response(200, {"status": "completed", "request_counts": {}}),
                  ]
              )
              client = BatchAPIClient("postgresql://x", credentials)
              client._session = session

              result = await client.get_batch_status("batch-1", "default")

              assert result["status"] == "completed"
              assert sleeps == [0.5]
              assert len(session.calls) == 2
          '''
          path.write_text(source, encoding="utf-8")
          PY
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Prove focused contract is red
        run: |
          set -euo pipefail
          set +e
          uv run pytest -q \
            tests/test_idempotent_get_retries.py::test_retry_after_parser_rejects_non_ascii_decimal_digits \
            tests/test_idempotent_get_retries.py::test_extreme_ascii_retry_after_is_refused_without_exception \
            tests/test_idempotent_get_retries.py::test_non_ascii_retry_after_uses_bounded_fallback \
            2>&1 | tee /tmp/retry-after-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected focused Retry-After regressions to fail before implementation" >&2
            exit 1
          fi
          grep -q "ValueError" /tmp/retry-after-red.log
          grep -q "is None" /tmp/retry-after-red.log
          grep -q "\[2.0\]" /tmp/retry-after-red.log
      - name: Record evidence and remove one-shot workflow
        env:
          BRANCH_NAME: agent/harden-retry-after-parsing
          RED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p docs/superpowers/evidence
          cat > docs/superpowers/evidence/2026-08-04-retry-after-parser-red.md <<EOF
          # Retry-After Parser Red Evidence

          Pre-implementation head: \`${RED_HEAD}\`

          The focused hostile-header tests were added without changing production code and returned a non-zero pytest status for the intended reasons:

          - non-ASCII decimal characters were accepted by \`str.isdecimal()\`;
          - a 10,000-digit ASCII delay leaked Python's decimal-to-integer \`ValueError\`;
          - a fullwidth digit selected an exact two-second wait instead of bounded fallback.

          The one-shot workflow required all three failure signatures before recording this evidence.
          EOF
          rm .github/workflows/one-shot-retry-after-red.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_idempotent_get_retries.py \
            docs/superpowers/evidence/2026-08-04-retry-after-parser-red.md \
            .github/workflows/one-shot-retry-after-red.yml
          git commit -m "test(gateway): define hostile Retry-After boundary"
          git push origin "HEAD:${BRANCH_NAME}"
