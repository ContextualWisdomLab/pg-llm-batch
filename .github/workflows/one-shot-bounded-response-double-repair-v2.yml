name: One-shot bounded response double repair v2

on:
  push:
    branches: [fix/bounded-response-test-doubles]
    paths:
      - .github/workflows/one-shot-bounded-response-double-repair-v2.yml

permissions:
  contents: write

concurrency:
  group: one-shot-bounded-response-double-repair-v2
  cancel-in-progress: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/bounded-response-test-doubles
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Align stale lifecycle doubles with the bounded byte-stream contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path


          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")


          helper_import = (
              "from tests.bounded_response_double import bind_bounded_json_response\n"
          )

          lifecycle = Path("tests/test_remote_batch_lifecycle.py")
          replace_once(
              lifecycle,
              "from pg_llm_batch.exceptions import GatewayError\n",
              "from pg_llm_batch.exceptions import GatewayError\n\n" + helper_import,
              "lifecycle helper import",
          )
          replace_once(
              lifecycle,
              "        self.headers: dict[str, str] = {}\n\n    async def json",
              "        self.headers: dict[str, str] = {}\n"
              "        bind_bounded_json_response(self, payload)\n\n"
              "    async def json",
              "lifecycle response binding",
          )

          identity = Path("tests/test_remote_batch_identity_contract.py")
          replace_once(
              identity,
              "from pg_llm_batch.exceptions import GatewayError\n",
              "from pg_llm_batch.exceptions import GatewayError\n\n" + helper_import,
              "identity helper import",
          )
          replace_once(
              identity,
              "    async def json(self) -> dict[str, Any]:\n",
              "    def __init__(self) -> None:\n"
              "        payload = {\n"
              "            \"id\": \"batch-other\",\n"
              "            \"status\": \"in_progress\",\n"
              "            \"request_counts\": {\n"
              "                \"total\": 2,\n"
              "                \"completed\": 1,\n"
              "                \"failed\": 0,\n"
              "            },\n"
              "        }\n"
              "        bind_bounded_json_response(self, payload)\n\n"
              "    async def json(self) -> dict[str, Any]:\n",
              "identity response binding",
          )

          metadata = Path("tests/test_remote_batch_metadata_contract.py")
          replace_once(
              metadata,
              "from pg_llm_batch.durable_client import DurableBatchAPIClient\n",
              "from pg_llm_batch.durable_client import DurableBatchAPIClient\n\n"
              + helper_import,
              "metadata helper import",
          )
          replace_once(
              metadata,
              "        self.headers: dict[str, str] = {}\n\n    async def json",
              "        self.headers: dict[str, str] = {}\n"
              "        bind_bounded_json_response(self, payload)\n\n"
              "    async def json",
              "metadata response binding",
          )

          state = Path("tests/test_remote_batch_state_contracts.py")
          replace_once(
              state,
              "from pg_llm_batch.exceptions import GatewayError, ValidationError\n",
              "from pg_llm_batch.exceptions import GatewayError, ValidationError\n\n"
              + helper_import,
              "state helper import",
          )
          replace_once(
              state,
              "    def __init__(self, payload: dict[str, Any]) -> None:\n"
              "        self.payload = payload\n",
              "    def __init__(self, payload: dict[str, Any]) -> None:\n"
              "        self.payload = payload\n"
              "        bind_bounded_json_response(self, payload)\n",
              "state response binding",
          )
          PY

      - name: Install exact locked dependencies
        run: uv sync --locked

      - name: Verify focused lifecycle regressions
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/test_remote_batch_identity_contract.py \
            tests/test_remote_batch_lifecycle.py \
            tests/test_remote_batch_metadata_contract.py \
            tests/test_remote_batch_state_contracts.py

      - name: Verify complete repository quality contract
        run: |
          set -euo pipefail
          uv run pytest -q -m "not integration"
          uv run python -m compileall -q pg_llm_batch tests
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-branch --cov-report=term-missing \
            --cov-fail-under=100
          uv lock --check
          rm -rf dist
          uv build --no-sources
          docker compose config --quiet
          git diff --check

      - name: Publish verified test repair and remove one-shot workflows
        env:
          BRANCH_NAME: fix/bounded-response-test-doubles
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-shot-bounded-response-double-repair.yml \
            .github/workflows/one-shot-bounded-response-double-repair-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No bounded response-double repair generated" >&2; exit 1; }
          git commit -m "fix(tests): restore bounded lifecycle response doubles"
          git push origin "HEAD:${BRANCH_NAME}"
