name: Lock Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lock-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          prune-cache: true
      - name: Regenerate lock and emit compressed diagnostic
        shell: bash
        run: |
          uv lock
          uv lock --check
          echo LOCK_GZIP_BASE64_BEGIN
          gzip -9 -c uv.lock | base64 -w0
          echo
          echo LOCK_GZIP_BASE64_END
