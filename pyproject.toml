[build-system]
requires = ["uv_build==0.12.1"]
build-backend = "uv_build"

[project]
name = "pg-llm-batch"
version = "0.1.0"
description = "Standalone + submodule Postgres LLM batch engine: pg_tiktoken token counting + batch submit/poll/retrieve"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ContextualWisdomLab" }]
keywords = ["postgres", "llm", "batch", "pg_tiktoken", "tokenization"]
dependencies = [
    "psycopg[binary]>=3.1",
    "aiohttp>=3.14.3",
]

[project.optional-dependencies]
secrets = ["cryptography>=50.0.0"]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "cryptography>=50.0.0",
]

# PEP 735 dependency groups. `uv run` installs the `dev` group by default, so the
# central coverage-evidence job (`uv run --with coverage --with pytest coverage
# run -m pytest tests`) gets pytest-asyncio (async client tests) and cryptography
# (Fernet secret-store test) without needing an explicit `--extra test`.
[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "cryptography>=50.0.0",
    "ruff==0.16.2",
]

[project.scripts]
pg-llm-batch = "pg_llm_batch.cli:main"

[project.urls]
Homepage = "https://github.com/ContextualWisdomLab/pg-llm-batch"

[tool.uv.build-backend]
module-root = ""
source-include = [
    "AGENTS.md",
    "ARCHITECTURE.md",
    "CHANGELOG.md",
    "CLAUDE.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "docs/**",
    "docker/**",
    "tests/**",
]
source-exclude = [
    ".coverage",
    ".pytest_cache/**",
    ".ruff_cache/**",
    ".venv/**",
    "build/**",
    "dist*/**",
    "release-evidence/**",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires a live pg_tiktoken + pg_cron Postgres container",
]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D101", "D102", "D103", "D105", "D106", "D107"]

[tool.coverage.run]
source = ["pg_llm_batch"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.interrogate]
exclude = ["tests"]
fail-under = 100
