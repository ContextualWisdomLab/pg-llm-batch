name: One-shot tenant lifecycle repair

on:
  push:
    branches: [agent/tenant-scoped-lifecycle]
    paths:
      - .github/workflows/one-shot-tenant-lifecycle-repair.yml

concurrency:
  group: one-shot-tenant-lifecycle-repair
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair-verify-publish:
    if: >-
      github.repository == 'ContextualWisdomLab/pg-llm-batch' &&
      github.ref == 'refs/heads/agent/tenant-scoped-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact trigger head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Refuse stale base, stale head, or competing writers
        shell: bash
        env:
          EXPECTED_PARENT_SHA: 5e81cfca2f27356defebd0a9747d57fbf3b84715
          EXPECTED_BASE_SHA: f0c5f79c5327a090014dd5558750110fce9fd2ac
          BRANCH_NAME: agent/tenant-scoped-lifecycle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE_SHA"
          test "$(git ls-remote origin refs/heads/$BRANCH_NAME | cut -f1)" = "$GITHUB_SHA"
          mapfile -t writers < <(find .github/workflows -maxdepth 1 -type f \
            \( -name '*one-shot*.yml' -o -name '*repair*.yml' \) -print | sort)
          test "${#writers[@]}" -eq 1
          test "${writers[0]}" = ".github/workflows/one-shot-tenant-lifecycle-repair.yml"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Reconcile compatibility, tests, and authoritative documentation
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -I - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "pg_llm_batch/db.py",
              '''    return _persist_remote_batch_state(
                  dsn,
                  DEFAULT_TENANT_SCOPE,
                  endpoint_alias,
                  provider_batch,
                  observation_order,
                  observed_at=observed_at,
              )
          '''.replace("\n          ", "\n"),
              '''    snapshot = _persist_remote_batch_state(
                  dsn,
                  DEFAULT_TENANT_SCOPE,
                  endpoint_alias,
                  provider_batch,
                  observation_order,
                  observed_at=observed_at,
              )
              compatible_snapshot = dict(snapshot)
              compatible_snapshot.pop("tenant_scope")
              return compatible_snapshot
          '''.replace("\n          ", "\n"),
          )

          lifecycle_path = Path("tests/test_remote_batch_lifecycle.py")
          lifecycle = lifecycle_path.read_text(encoding="utf-8")
          lifecycle = lifecycle.replace("import asyncio\n", "import asyncio\nimport json\n", 1)
          old_response = '''class _Response:
              """Async response double for successful or failed provider operations."""

              def __init__(self, status: int, payload: dict[str, Any]) -> None:
                  self.status = status
                  self.payload = payload
                  self.headers: dict[str, str] = {}

              async def json(self) -> dict[str, Any]:
                  return self.payload

              async def __aenter__(self):
                  return self

              async def __aexit__(self, *exc: Any):
                  return None
          '''.replace("\n          ", "\n")
          new_response = '''class _ResponseContent:
              """Expose deterministic provider bytes through a bounded stream."""

              def __init__(self, payload: bytes) -> None:
                  self.payload = payload

              async def iter_chunked(self, size: int):
                  """Yield byte chunks no larger than the requested bound."""
                  for index in range(0, len(self.payload), size):
                      yield self.payload[index : index + size]


          class _Response:
              """Async response double for successful or failed provider operations."""

              def __init__(self, status: int, payload: dict[str, Any]) -> None:
                  self.status = status
                  self.payload = payload
                  self.headers: dict[str, str] = {}
                  encoded = json.dumps(payload).encode("utf-8")
                  self.content_length = len(encoded)
                  self.content = _ResponseContent(encoded)

              async def json(self) -> dict[str, Any]:
                  return self.payload

              async def __aenter__(self):
                  return self

              async def __aexit__(self, *exc: Any):
                  return None
          '''.replace("\n          ", "\n")
          if lifecycle.count(old_response) != 1:
              raise SystemExit("response double anchor mismatch")
          lifecycle = lifecycle.replace(old_response, new_response, 1)
          replacements = {
              '    assert "CONSTRAINT uq_llm_remote_batch_jobs_endpoint_id" in schema\n':
                  '    assert "CONSTRAINT uq_llm_remote_batch_jobs_tenant_endpoint_id" in schema\n',
              '    assert "UNIQUE (endpoint_alias, remote_batch_id)" in schema\n':
                  '    assert "UNIQUE (tenant_scope, endpoint_alias, remote_batch_id)" in schema\n',
              '    assert "idx_llm_remote_batch_jobs_status_observed" in schema\n':
                  '    assert "idx_llm_remote_batch_jobs_tenant_status_observed" in schema\n',
              '    sql, params = driver.executions[0]\n'
              '    assert "ON CONFLICT (endpoint_alias, remote_batch_id) DO UPDATE" in sql\n':
                  '    assert driver.executions[0] == (\n'
                  '        "SELECT set_config(\'pg_llm_batch.tenant_scope\', %s, true)",\n'
                  '        ("standalone",),\n'
                  '    )\n'
                  '    sql, params = driver.executions[1]\n'
                  '    assert (\n'
                  '        "ON CONFLICT (tenant_scope, endpoint_alias, remote_batch_id) DO UPDATE"\n'
                  '        in sql\n'
                  '    )\n',
          }
          for old, new in replacements.items():
              count = lifecycle.count(old)
              if count != 1:
                  raise SystemExit(f"lifecycle anchor mismatch ({count}): {old!r}")
              lifecycle = lifecycle.replace(old, new, 1)
          lifecycle = lifecycle.replace("params[11]", "params[12]")
          lifecycle = lifecycle.replace("driver.executions[-1][1][11]", "driver.executions[-1][1][12]")
          lifecycle_path.write_text(lifecycle, encoding="utf-8")

          persistence_path = Path("tests/test_tenant_lifecycle_persistence.py")
          persistence = persistence_path.read_text(encoding="utf-8")
          persistence = persistence.replace(
              '    assert snapshot["tenant_scope"] == "standalone"\n',
              '    assert "tenant_scope" not in snapshot\n',
              1,
          )
          malformed_test = '''

          def test_tenant_scoped_read_rejects_malformed_database_rows(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              """A partial row cannot become an ambiguous lifecycle projection."""
              driver = _Psycopg(fetchone_rows=[("tenant-a", "primary")])
              monkeypatch.setattr(db, "psycopg", driver)

              with pytest.raises(RuntimeError, match="invalid row"):
                  db.get_tenant_remote_batch_state(
                      "postgresql://tenant-test",
                      "tenant-a",
                      "primary",
                      "batch-shared",
                  )
          '''.replace("\n          ", "\n")
          if "test_tenant_scoped_read_rejects_malformed_database_rows" not in persistence:
              persistence = persistence.rstrip() + malformed_test + "\n"
          persistence_path.write_text(persistence, encoding="utf-8")

          tenant_client_path = Path("tests/test_tenant_durable_client.py")
          tenant_client = tenant_client_path.read_text(encoding="utf-8").replace(
              "pytest.MonPatch", "pytest.MonkeyPatch"
          )
          reject_test = '''

          def test_tenant_client_rejects_unscoped_recorder_keyword() -> None:
              """Tenant callers cannot silently use the legacy recorder seam."""
              with pytest.raises(ValidationError) as exc_info:
                  TenantDurableBatchAPIClient(
                      "postgresql://tenant-test",
                      _credentials,
                      tenant_scope="tenant-a",
                      lifecycle_recorder=lambda *_args: None,
                  )

              assert exc_info.value.details == {
                  "field": "lifecycle_recorder",
                  "value": "<provided>",
                  "reason": "tenant clients require tenant_lifecycle_recorder",
              }
          '''.replace("\n          ", "\n")
          if "test_tenant_client_rejects_unscoped_recorder_keyword" not in tenant_client:
              tenant_client = tenant_client.rstrip() + reject_test + "\n"
          tenant_client_path.write_text(tenant_client, encoding="utf-8")

          schema_integrity_path = Path("tests/test_schema_integrity.py")
          schema_integrity = schema_integrity_path.read_text(encoding="utf-8")
          mirror_start = schema_integrity.index(
              "def test_postgres_image_schema_is_an_exact_canonical_mirror():"
          )
          schema_integrity = schema_integrity[:mirror_start] + '''def test_postgres_image_schema_is_an_exact_canonical_mirror():
              """The deployable image schema is byte-exact with the package source."""
              root = Path(__file__).resolve().parents[1]
              canonical = (root / "pg_llm_batch" / "schema.sql").read_text(
                  encoding="utf-8"
              )
              mirror = (
                  root / "docker" / "postgres" / "init" / "02_schema.sql"
              ).read_text(encoding="utf-8")
              assert mirror == canonical
          '''.replace("\n          ", "\n")
          schema_integrity_path.write_text(schema_integrity, encoding="utf-8")

          integration_path = Path("tests/test_integration_pg.py")
          integration = integration_path.read_text(encoding="utf-8")
          live_test = r'''

          @skip_no_db
          def test_live_rls_separates_identical_provider_ids_by_tenant() -> None:
              """A non-bypass role cannot observe another tenant's lifecycle row."""
              import uuid

              import psycopg
              from psycopg import sql
              from psycopg.conninfo import make_conninfo

              db.apply_schema(DSN)
              suffix = uuid.uuid4().hex[:12]
              role_name = f"tenant_scope_test_{suffix}"
              password = uuid.uuid4().hex
              batch_id = f"batch-{suffix}"
              role_dsn = make_conninfo(DSN, user=role_name, password=password)

              with psycopg.connect(DSN) as admin:
                  with admin.cursor() as cursor:
                      cursor.execute(
                          sql.SQL(
                              "CREATE ROLE {} LOGIN PASSWORD %s "
                              "NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT "
                              "NOREPLICATION NOBYPASSRLS"
                          ).format(sql.Identifier(role_name)),
                          (password,),
                      )
                      cursor.execute(
                          sql.SQL(
                              "GRANT SELECT, INSERT, UPDATE ON "
                              "llm_remote_batch_jobs TO {}"
                          ).format(sql.Identifier(role_name))
                      )
                  admin.commit()

              try:
                  db.persist_tenant_remote_batch_state(
                      role_dsn,
                      "tenant-a",
                      "primary",
                      {"id": batch_id, "status": "in_progress"},
                      1,
                  )
                  db.persist_tenant_remote_batch_state(
                      role_dsn,
                      "tenant-b",
                      "primary",
                      {"id": batch_id, "status": "completed"},
                      2,
                  )
                  tenant_a = db.get_tenant_remote_batch_state(
                      role_dsn, "tenant-a", "primary", batch_id
                  )
                  tenant_b = db.get_tenant_remote_batch_state(
                      role_dsn, "tenant-b", "primary", batch_id
                  )
                  assert tenant_a is not None and tenant_a["batch_status"] == "in_progress"
                  assert tenant_b is not None and tenant_b["batch_status"] == "completed"

                  with psycopg.connect(role_dsn) as tenant_connection:
                      with tenant_connection.cursor() as cursor:
                          cursor.execute(
                              "SELECT set_config('pg_llm_batch.tenant_scope', %s, true)",
                              ("tenant-a",),
                          )
                          cursor.execute(
                              "SELECT COUNT(*) FROM llm_remote_batch_jobs "
                              "WHERE tenant_scope = %s AND remote_batch_id = %s",
                              ("tenant-b", batch_id),
                          )
                          assert cursor.fetchone()[0] == 0
              finally:
                  with psycopg.connect(DSN) as admin:
                      with admin.cursor() as cursor:
                          cursor.execute(
                              "DELETE FROM llm_remote_batch_jobs WHERE remote_batch_id = %s",
                              (batch_id,),
                          )
                          cursor.execute(
                              sql.SQL("DROP OWNED BY {}").format(sql.Identifier(role_name))
                          )
                          cursor.execute(
                              sql.SQL("DROP ROLE {}").format(sql.Identifier(role_name))
                          )
                      admin.commit()
          '''.replace("\n          ", "\n")
          if "test_live_rls_separates_identical_provider_ids_by_tenant" not in integration:
              integration_path.write_text(
                  integration.rstrip() + live_test + "\n",
                  encoding="utf-8",
              )

          design_path = Path("docs/superpowers/specs/2026-08-05-tenant-scoped-lifecycle-design.md")
          design = design_path.read_text(encoding="utf-8")
          design = design.replace(
              "Both return the normalized snapshot including `tenant_scope`. The upsert conflict\n"
              "key and every update reference use the tenant-qualified identity.\n",
              "The tenant-aware helper returns the normalized snapshot including "
              "`tenant_scope`. The legacy helper deliberately preserves its original "
              "return shape while writing under `standalone`. The upsert conflict key "
              "and every update reference use the tenant-qualified identity.\n",
          )
          design_path.write_text(design, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          entry = (
              "- Trusted tenant-scoped durable lifecycle identities, explicit standalone "
              "compatibility, tenant-aware client/read/write helpers, transaction-local "
              "PostgreSQL context, idempotent legacy backfill, and forced default-deny "
              "row-level security for shared-table MSA deployments.\n"
          )
          if entry not in changelog:
              anchor = "### Added\n\n"
              if changelog.count(anchor) != 1:
                  raise SystemExit("CHANGELOG Added anchor mismatch")
              changelog = changelog.replace(anchor, anchor + entry, 1)
          changelog_path.write_text(changelog, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          section = r'''
          ### Tenant-scoped durable lifecycle state

          Shared-table MSA deployments pass tenant context only after the host has
          authenticated and authorized the caller:

          ```python
          from pg_llm_batch import TenantDurableBatchAPIClient

          client = TenantDurableBatchAPIClient(
              dsn,
              credentials,
              tenant_scope=authenticated_tenant_scope,
          )
          ```

          The durable identity is `(tenant_scope, endpoint_alias, remote_batch_id)`.
          Reads and writes bind the validated scope transaction-locally; enabled and
          forced PostgreSQL row-level security denies access when context is missing.
          Application roles must be `NOSUPERUSER NOBYPASSRLS`. Existing
          `DurableBatchAPIClient` consumers retain the original recorder contract and
          return shape under the explicit `standalone` scope.

          '''.replace("\n          ", "\n")
          if "### Tenant-scoped durable lifecycle state" not in readme:
              anchor = "\n---\n\n## Tests\n"
              if readme.count(anchor) != 1:
                  raise SystemExit("README tests anchor mismatch")
              readme = readme.replace(anchor, "\n" + section + anchor, 1)
          readme_path.write_text(readme, encoding="utf-8")

          lifecycle_doc_path = Path("docs/remote-batch-lifecycle.md")
          lifecycle_doc = lifecycle_doc_path.read_text(encoding="utf-8")
          lifecycle_section = r'''

          ## Tenant isolation

          `DurableBatchAPIClient` uses the explicit `standalone` scope. Shared-table
          hosts use `TenantDurableBatchAPIClient` with an identity selected after host
          authentication and authorization. Provider metadata, remote identifiers,
          payloads, and transport headers never choose tenant scope.

          Each lifecycle statement binds transaction-local tenant context before table
          access. The table has enabled and forced default-deny RLS and a
          tenant-qualified conflict key. Production roles must be
          `NOSUPERUSER NOBYPASSRLS`. Legacy rows migrate to `standalone` without
          deletion. Rollback to the old two-column key requires first proving no
          endpoint/provider identifier pair is shared across tenant scopes.
          '''.replace("\n          ", "\n")
          if "## Tenant isolation" not in lifecycle_doc:
              lifecycle_doc_path.write_text(
                  lifecycle_doc.rstrip() + lifecycle_section + "\n",
                  encoding="utf-8",
              )

          Path("ARCHITECTURE.md").write_text(
              r'''# Architecture

          ## Deployment boundary

          `pg-llm-batch` remains independently deployable and embeddable. PostgreSQL
          owns token counting, JSONL payloads, configuration, encrypted secrets, and
          durable provider lifecycle state. Provider HTTP behavior remains isolated
          behind `BatchAPIClient`.

          ## Durable lifecycle tenancy

          `DurableBatchAPIClient` is the backward-compatible standalone facade.
          `TenantDurableBatchAPIClient` requires a trusted host-selected scope. The
          durable business identity is `(tenant_scope, endpoint_alias,
          remote_batch_id)`. Transaction-local tenant context and enabled, forced RLS
          make missing context default-deny. Superusers and `BYPASSRLS` roles remain
          administrative escape hatches and must not be application identities.

          ## Migration and rollback

          Legacy rows are backfilled to `standalone` without deletion or merging. The
          old unique constraint and status index are replaced transactionally. Schema
          reapplication restores forced RLS before commit. Rollback requires proving
          no cross-tenant duplicate endpoint/provider identifier pairs exist.

          ## Modular interoperability

          CWL hosts such as `contextual-orchestrator` and `naruon` supply tenant scope
          only after their own authentication and authorization boundary. Tenant scope
          is local control-plane identity, never provider-returned data.
          '''.replace("\n          ", "\n").lstrip(),
              encoding="utf-8",
          )
          Path("CLAUDE.md").write_text(
              r'''# CLAUDE.md

          ## Tenant lifecycle invariants

          - Preserve standalone operation and the original recorder/return contract.
          - Never derive tenant scope from provider or transport data.
          - Validate scope before reservation, credentials, provider I/O, or DB I/O.
          - Bind scope with transaction-local `set_config`.
          - Keep RLS enabled and forced; app roles are `NOSUPERUSER NOBYPASSRLS`.
          - Include tenant scope in every lifecycle lookup and conflict identity.
          - Keep packaged and Docker initialization schemas byte-exact.
          - Preserve 100% production statement, branch, and public-docstring coverage.
          '''.replace("\n          ", "\n").lstrip(),
              encoding="utf-8",
          )
          agents_path = Path("AGENTS.md")
          agents = agents_path.read_text(encoding="utf-8")
          agents_section = r'''

          ## Tenant lifecycle security contract

          Lifecycle changes preserve trusted `tenant_scope`, the tenant-qualified key,
          transaction-local context, enabled and forced RLS, and the explicit
          superuser/`BYPASSRLS` limitation. Provider data never supplies authorization
          context. Preserve standalone compatibility, migration idempotency, exact
          deployable schema mirroring, and 100% coverage.
          '''.replace("\n          ", "\n")
          if "## Tenant lifecycle security contract" not in agents:
              agents_path.write_text(agents.rstrip() + agents_section + "\n", encoding="utf-8")

          adr_path = Path("docs/adr/0002-tenant-scoped-lifecycle.md")
          adr_path.parent.mkdir(parents=True, exist_ok=True)
          adr_path.write_text(
              r'''# ADR 0002: Tenant-Scoped Durable Lifecycle State

          - Status: Accepted
          - Date: 2026-08-05

          ## Context

          Provider batch identifiers are not globally unique across customer tenants.
          A two-column endpoint/provider key cannot provide a defensible shared-table
          authorization boundary.

          ## Decision

          Require trusted local tenant identity for shared deployments, qualify the
          lifecycle key by tenant, bind scope transaction-locally, and enforce enabled
          and forced PostgreSQL RLS. Preserve the standalone recorder and return
          contracts under the explicit `standalone` identity.

          ## Consequences

          Hosts derive scope after authentication, use non-bypass application roles,
          and preserve transaction boundaries. Legacy rows migrate without deletion.
          Rollback first requires eliminating cross-tenant duplicate provider IDs.
          '''.replace("\n          ", "\n").lstrip(),
              encoding="utf-8",
          )
          doctoring_path = Path("docs/doctoring/tenant-scoped-lifecycle.md")
          doctoring_path.parent.mkdir(parents=True, exist_ok=True)
          doctoring_path.write_text(
              r'''# Tenant-Scoped Durable Lifecycle Isolation

          ## Decision and operator contract

          Shared-table deployments use a trusted local `tenant_scope` as part of the
          durable lifecycle identity. Existing standalone callers retain their public
          recorder and return shape under `standalone`.

          Scope syntax is `[A-Za-z0-9][A-Za-z0-9._:-]{0,127}` without trimming.
          Hosts derive scope after authentication and authorization. Reads and writes
          bind transaction-local context before access. Matching RLS `USING` and
          `WITH CHECK` expressions are enabled and forced. Missing context is
          default-deny. Superusers and `BYPASSRLS` roles cannot be application roles.

          Legacy rows are backfilled to `standalone`; no row is deleted or merged.
          Rollback to the prior key is unsafe until operators prove no duplicate
          `(endpoint_alias, remote_batch_id)` pair exists across tenant scopes.

          ## Verification

          Deterministic tests cover strict validation, SQL binding, compatibility,
          tenant recorder propagation, migration, policy text, malformed rows, and
          exact schema mirroring. A live PostgreSQL test creates a
          `NOSUPERUSER NOBYPASSRLS` role, stores the same provider ID for two tenants,
          and verifies cross-tenant reads return zero rows.

          ## References

          Joint Task Force. (2020). *Security and privacy controls for information
          systems and organizations* (NIST Special Publication 800-53, Revision 5).
          National Institute of Standards and Technology.
          https://doi.org/10.6028/NIST.SP.800-53r5

          OWASP Foundation. (n.d.). *Multi-tenant security cheat sheet*. OWASP Cheat
          Sheet Series. Retrieved August 5, 2026, from
          https://cheatsheetseries.owasp.org/cheatsheets/Multi_Tenant_Security_Cheat_Sheet.html

          PostgreSQL Global Development Group. (2026a). *Row security policies*. In
          *PostgreSQL 18 documentation*.
          https://www.postgresql.org/docs/18/ddl-rowsecurity.html

          PostgreSQL Global Development Group. (2026b). *System administration
          functions*. In *PostgreSQL 18 documentation*.
          https://www.postgresql.org/docs/18/functions-admin.html
          '''.replace("\n          ", "\n").lstrip(),
              encoding="utf-8",
          )
          PY
          git diff --check

      - name: Verify focused tenant contracts
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/test_tenant_scope_validation.py \
            tests/test_tenant_lifecycle_schema.py \
            tests/test_tenant_lifecycle_persistence.py \
            tests/test_tenant_durable_client.py \
            tests/test_remote_batch_lifecycle.py \
            tests/test_schema_integrity.py

      - name: Verify complete deterministic gates
        run: |
          set -euo pipefail
          uv run python -m compileall -q pg_llm_batch tests
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-branch --cov-report=term-missing \
            --cov-fail-under=100
          uv lock --check
          rm -rf build dist
          uv build --no-sources
          docker compose config >/dev/null
          docker build --tag pg-llm-batch:tenant-scope .
          docker build --tag pg-llm-batch-postgres:tenant-scope docker/postgres

      - name: Verify live PostgreSQL migration and isolation twice
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker compose down --volumes --remove-orphans || true; }
          trap cleanup EXIT
          docker compose up --detach --build postgres
          for attempt in $(seq 1 60); do
            if docker compose exec -T postgres pg_isready -U pgllm -d pgllm >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose logs postgres
              exit 1
            fi
            sleep 5
          done
          export PG_LLM_BATCH_TEST_DSN='postgresql://pgllm:pgllm@127.0.0.1:5432/pgllm'
          uv run pytest -q -m integration tests/test_integration_pg.py
          uv run pytest -q -m integration tests/test_integration_pg.py

      - name: Record evidence and remove the temporary writer
        shell: bash
        env:
          SOURCE_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-tenant-lifecycle-repair.yml
          rm -rf .coverage .coverage.* htmlcov build dist
          mkdir -p docs/superpowers/evidence
          cat > docs/superpowers/evidence/2026-08-05-tenant-scoped-lifecycle-green.md <<EOF
          # Tenant-Scoped Lifecycle GREEN Evidence

          - Verification source head: \`$SOURCE_HEAD\`
          - Permanent tenant contracts were committed before production tenant APIs.
          - Focused and complete deterministic tests passed.
          - Production statement and branch coverage: 100%.
          - Public production docstrings: 100%.
          - Ruff, compile, lockfile, source/wheel, Compose, and container builds passed.
          - Live PostgreSQL migration and non-bypass tenant isolation passed twice.
          - The bounded write-capable workflow removed itself from the final diff.
          EOF
          test ! -e .github/workflows/one-shot-tenant-lifecycle-repair.yml
          test -z "$(git ls-files --others --exclude-standard | grep -E '(^|/)(\.coverage|htmlcov|build|dist)(/|$)' || true)"
          git diff --check

      - name: Commit only after exact remote-head reconciliation
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
          BRANCH_NAME: agent/tenant-scoped-lifecycle
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$BRANCH_NAME | cut -f1)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/one-shot-tenant-lifecycle-repair.yml$' || true)"
          git commit -m "feat(tenant): complete lifecycle isolation"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:$BRANCH_NAME"
