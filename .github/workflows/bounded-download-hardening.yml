name: One-shot bounded download hardening

on:
  push:
    branches:
      - agent/bounded-result-downloads
    paths:
      - .github/workflows/bounded-download-hardening.yml

permissions:
  contents: write

concurrency:
  group: bounded-download-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden-download-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out product branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/bounded-result-downloads
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Apply fail-closed bounded stream hardening
        run: |
          python - <<'PY'
          from pathlib import Path


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)


          source_path = Path("pg_llm_batch/batch_api_client.py")
          source = source_path.read_text(encoding="utf-8")
          start_marker = '        stream = getattr(response, "content", None)\n'
          end_marker = "        payload = bytearray()\n"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("could not locate bounded-reader compatibility block")
          replacement = '''        stream = getattr(response, "content", None)
                  iterator = getattr(stream, "iter_chunked", None)
                  if not callable(iterator):
                      raise GatewayError(
                          f"{operation} response does not expose a bounded byte stream",
                          status_code=getattr(response, "status", None),
                          response_data={"error_type": "MissingBoundedStream"},
                      )

                  payload = bytearray()
          '''.replace("          ", "")
          source = source[:start] + replacement + source[end + len(end_marker) :]
          source = replace_once(
              source,
              "        async for chunk in stream.iter_chunked(DOWNLOAD_CHUNK_BYTES):\n",
              "        async for chunk in iterator(DOWNLOAD_CHUNK_BYTES):\n",
              "bounded iterator call",
          )
          source_path.write_text(source, encoding="utf-8")

          bounded_tests = r'''# SPDX-License-Identifier: Apache-2.0
          """Tests for bounded, streamed provider result downloads."""

          from __future__ import annotations

          from typing import Any

          import pytest

          from pg_llm_batch.batch_api_client import BatchAPIClient, GatewayCredentials
          from pg_llm_batch.exceptions import GatewayError, ValidationError


          class ChunkStream:
              """Yield configured byte chunks while recording stream consumption."""

              def __init__(self, chunks: list[bytes]) -> None:
                  self.chunks = chunks
                  self.requested_sizes: list[int] = []
                  self.iterated = False

              async def iter_chunked(self, size: int):
                  """Yield chunks and record the requested maximum chunk size."""
                  self.requested_sizes.append(size)
                  self.iterated = True
                  for chunk in self.chunks:
                      yield chunk


          class StreamResponse:
              """Minimal aiohttp-style response exposing a streamed body."""

              def __init__(
                  self,
                  chunks: list[bytes],
                  *,
                  content_length: Any,
                  status: int = 200,
              ) -> None:
                  self.status = status
                  self.content_length = content_length
                  self.content = ChunkStream(chunks)

              async def __aenter__(self):
                  """Enter the asynchronous response context."""
                  return self

              async def __aexit__(self, *exc: Any):
                  """Leave the asynchronous response context."""
                  return None


          class TextResponse:
              """Response adapter that deliberately lacks a bounded byte stream."""

              def __init__(self, text: str, *, status: int = 200) -> None:
                  self.status = status
                  self.content_length = None
                  self._text = text
                  self.text_called = False

              async def text(self) -> str:
                  """Record any unsafe whole-body fallback attempt."""
                  self.text_called = True
                  return self._text

              async def __aenter__(self):
                  """Enter the asynchronous response context."""
                  return self

              async def __aexit__(self, *exc: Any):
                  """Leave the asynchronous response context."""
                  return None


          class Session:
              """Return one configured response for every GET request."""

              def __init__(self, response: Any) -> None:
                  self.response = response
                  self.calls: list[tuple[str, dict[str, Any]]] = []

              def get(self, url: str, **kwargs: Any) -> Any:
                  """Record a GET call and return the configured response context."""
                  self.calls.append((url, kwargs))
                  return self.response


          def credentials(_alias: str) -> GatewayCredentials:
              """Return deterministic credentials for download tests."""
              return GatewayCredentials(
                  url="https://gateway.example/v1",
                  api_key="secret",
              )


          @pytest.mark.parametrize("value", [True, 0, -1, 1.5, "1024"])
          def test_client_rejects_invalid_max_download_bytes(value: Any) -> None:
              """Download limits must be positive non-boolean integers."""
              with pytest.raises(ValidationError, match="max_download_bytes"):
                  BatchAPIClient(
                      "postgresql://x",
                      credentials,
                      max_download_bytes=value,
                  )


          def test_client_uses_documented_default_download_limit() -> None:
              """The public default remains the documented 128 MiB safety boundary."""
              client = BatchAPIClient("postgresql://x", credentials)
              assert client.max_download_bytes == 128 * 1024 * 1024


          async def test_declared_oversize_is_rejected_before_streaming() -> None:
              """An excessive Content-Length fails before response chunks are consumed."""
              response = StreamResponse([b'{"ok":1}\n'], content_length=10)
              client = BatchAPIClient(
                  "postgresql://x",
                  credentials,
                  max_download_bytes=9,
              )
              client._session = Session(response)

              with pytest.raises(GatewayError, match="exceeded download limit") as exc_info:
                  await client._download_jsonl_file(
                      "output-1",
                      "default",
                      batch_id="batch-1",
                      file_kind="result",
                  )

              assert response.content.iterated is False
              assert exc_info.value.response_data == {
                  "limit_bytes": 9,
                  "declared_bytes": 10,
                  "bytes_read": 0,
              }


          @pytest.mark.parametrize("declared_length", [True, -1, "9"])
          async def test_invalid_declared_lengths_do_not_override_actual_bytes(
              declared_length: Any,
          ) -> None:
              """Malformed length metadata is ignored while actual bytes stay bounded."""
              response = StreamResponse(
                  [b'{"ok":1}\n'],
                  content_length=declared_length,
              )
              client = BatchAPIClient(
                  "postgresql://x",
                  credentials,
                  max_download_bytes=9,
              )
              client._session = Session(response)

              result = await client._download_jsonl_file(
                  "output-1",
                  "default",
                  batch_id="batch-1",
                  file_kind="result",
              )

              assert result == [{"ok": 1}]


          async def test_streamed_body_exactly_at_limit_is_accepted() -> None:
              """A valid UTF-8 JSONL body equal to the byte limit remains usable."""
              response = StreamResponse([b'{"ok":', b'1}\n'], content_length=9)
              client = BatchAPIClient(
                  "postgresql://x",
                  credentials,
                  max_download_bytes=9,
              )
              client._session = Session(response)

              result = await client._download_jsonl_file(
                  "output-1",
                  "default",
                  batch_id="batch-1",
                  file_kind="result",
              )

              assert result == [{"ok": 1}]
              assert response.content.requested_sizes == [64 * 1024]


          async def test_actual_decoded_bytes_enforce_limit_beyond_declared_length() -> None:
              """Streamed decoded bytes remain authoritative when headers understate size."""
              response = StreamResponse([b'{"ok":', b'1}\n'], content_length=1)
              client = BatchAPIClient(
                  "postgresql://x",
                  credentials,
                  max_download_bytes=8,
              )
              client._session = Session(response)

              with pytest.raises(GatewayError, match="exceeded download limit") as exc_info:
                  await client._download_jsonl_file(
                      "output-1",
                      "default",
                      batch_id="batch-1",
                      file_kind="result",
                  )

              assert exc_info.value.response_data == {
                  "limit_bytes": 8,
                  "declared_bytes": 1,
                  "bytes_read": 6,
              }


          async def test_streamed_body_rejects_invalid_utf8_without_content_leakage() -> None:
              """Invalid UTF-8 becomes a typed boundary error without returning bytes."""
              response = StreamResponse([b'{"ok":"', b'\xff"}\n'], content_length=None)
              client = BatchAPIClient(
                  "postgresql://x",
                  credentials,
                  max_download_bytes=32,
              )
              client._session = Session(response)

              with pytest.raises(GatewayError, match="invalid UTF-8") as exc_info:
                  await client._download_jsonl_file(
                      "output-1",
                      "default",
                      batch_id="batch-1",
                      file_kind="result",
                  )

              assert exc_info.value.response_data == {
                  "error_type": "UnicodeDecodeError",
                  "byte_offset": 7,
              }
              assert "xff" not in repr(exc_info.value.response_data).lower()


          async def test_response_without_stream_fails_closed_before_text_buffering() -> None:
              """Adapters without a byte stream fail before whole-body buffering."""
              response = TextResponse('{"ok":1}\n')
              client = BatchAPIClient(
                  "postgresql://x",
                  credentials,
                  max_download_bytes=9,
              )
              client._session = Session(response)

              with pytest.raises(GatewayError, match="bounded byte stream") as exc_info:
                  await client._download_jsonl_file(
                      "output-1",
                      "default",
                      batch_id="batch-1",
                      file_kind="result",
                  )

              assert response.text_called is False
              assert exc_info.value.response_data == {
                  "error_type": "MissingBoundedStream",
              }
          '''
          Path("tests/test_bounded_result_downloads.py").write_text(
              bounded_tests.replace("          ", ""),
              encoding="utf-8",
          )

          batch_test_path = Path("tests/test_batch_api_client.py")
          batch_tests = batch_test_path.read_text(encoding="utf-8")
          if "class FakeContent:" not in batch_tests:
              batch_tests = replace_once(
                  batch_tests,
                  "class FakeResponse:\n",
                  '''class FakeContent:
                      """Expose deterministic response bytes through a bounded stream."""

                      def __init__(self, payload: bytes) -> None:
                          self.payload = payload

                      async def iter_chunked(self, size: int):
                          """Yield the payload in chunks no larger than ``size``."""
                          for index in range(0, len(self.payload), size):
                              yield self.payload[index : index + size]


                  class FakeResponse:
                  '''.replace("                  ", ""),
                  "FakeContent insertion",
              )
              batch_tests = replace_once(
                  batch_tests,
                  "        self._text = text\n",
                  '''        self._text = text
                          encoded = text.encode("utf-8")
                          self.content_length = len(encoded)
                          self.content = FakeContent(encoded)
                  '''.replace("                  ", ""),
                  "FakeResponse bounded content",
              )
          batch_test_path.write_text(batch_tests, encoding="utf-8")

          error_test_path = Path("tests/test_error_file_retrieval.py")
          error_tests = error_test_path.read_text(encoding="utf-8")
          if "class ResponseContent:" not in error_tests:
              error_tests = replace_once(
                  error_tests,
                  "class Response:\n",
                  '''class ResponseContent:
                      """Expose response text as a deterministic bounded byte stream."""

                      def __init__(self, payload: bytes) -> None:
                          self.payload = payload

                      async def iter_chunked(self, size: int):
                          """Yield the payload in chunks no larger than ``size``."""
                          for index in range(0, len(self.payload), size):
                              yield self.payload[index : index + size]


                  class Response:
                  '''.replace("                  ", ""),
                  "ResponseContent insertion",
              )
              error_tests = replace_once(
                  error_tests,
                  "        self.text_value = text\n",
                  '''        self.text_value = text
                          encoded = text.encode("utf-8")
                          self.content_length = len(encoded)
                          self.content = ResponseContent(encoded)
                  '''.replace("                  ", ""),
                  "Response bounded content",
              )
          error_test_path.write_text(error_tests, encoding="utf-8")

          spec_path = Path(
              "docs/superpowers/specs/2026-08-04-bounded-result-downloads-design.md"
          )
          spec = spec_path.read_text(encoding="utf-8")
          spec = replace_once(
              spec,
              "7. retain a bounded `response.text()` compatibility path for lightweight response doubles and compatible adapters that do not expose `content`.",
              "7. fail closed without calling `response.text()` when a response does not expose a callable `content.iter_chunked` byte stream.",
              "design selected approach",
          )
          spec = replace_once(
              spec,
              "- the bounded compatibility path without `response.content`;",
              "- fail-closed behavior without `response.content.iter_chunked`;",
              "design testing bullet",
          )
          spec_path.write_text(spec, encoding="utf-8")

          plan_path = Path(
              "docs/superpowers/plans/2026-08-04-bounded-result-downloads.md"
          )
          plan = plan_path.read_text(encoding="utf-8")
          plan = replace_once(
              plan,
              "- Provider response content must never appear in oversize or invalid-UTF-8 error metadata.\n",
              "- Provider response content must never appear in oversize or invalid-UTF-8 error metadata.\n- Responses without a callable `content.iter_chunked` stream fail closed; `response.text()` is never used for provider file bodies.\n",
              "plan stream constraint",
          )
          plan = replace_once(
              plan,
              "# a response double without `content` remains bounded through text()",
              "# a response without `content.iter_chunked` fails before text() is called",
              "plan test case",
          )
          old_algorithm = '''stream = getattr(response, "content", None)
          if stream is None:
              text = await response.text()
              encoded = text.encode("utf-8")
              if len(encoded) > self.max_download_bytes:
                  raise_oversize(bytes_read=0, declared_bytes=declared)
              return text

          payload = bytearray()
          async for chunk in stream.iter_chunked(DOWNLOAD_CHUNK_BYTES):
          '''
          new_algorithm = '''stream = getattr(response, "content", None)
          iterator = getattr(stream, "iter_chunked", None)
          if not callable(iterator):
              raise GatewayError(
                  f"{operation} response does not expose a bounded byte stream",
                  status_code=getattr(response, "status", None),
                  response_data={"error_type": "MissingBoundedStream"},
              )

          payload = bytearray()
          async for chunk in iterator(DOWNLOAD_CHUNK_BYTES):
          '''
          plan = replace_once(
              plan,
              old_algorithm,
              new_algorithm,
              "plan bounded reader algorithm",
          )
          plan_path.write_text(plan, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          changelog = replace_once(
              changelog,
              "  decoded-byte default, strict UTF-8 validation, and body-free oversize errors.\n",
              "  decoded-byte default, strict UTF-8 validation, body-free oversize errors,\n  and fail-closed handling when a bounded byte stream is unavailable.\n",
              "changelog hardening",
          )
          changelog_path.write_text(changelog, encoding="utf-8")
          PY

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Verify fail-closed bounded downloads
        run: |
          set -euo pipefail
          uv run pytest -q tests/test_bounded_result_downloads.py
          uv run pytest -q -m "not integration"
          uv run python -m compileall -q pg_llm_batch
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-report=term-missing --cov-fail-under=100
          uv build --no-sources

      - name: Publish hardening and remove this workflow
        env:
          BRANCH_NAME: agent/bounded-result-downloads
        run: |
          set -euo pipefail
          rm .github/workflows/bounded-download-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pg_llm_batch/batch_api_client.py \
            tests/test_bounded_result_downloads.py \
            tests/test_batch_api_client.py \
            tests/test_error_file_retrieval.py \
            docs/superpowers/specs/2026-08-04-bounded-result-downloads-design.md \
            docs/superpowers/plans/2026-08-04-bounded-result-downloads.md \
            CHANGELOG.md \
            .github/workflows/bounded-download-hardening.yml
          git diff --cached --quiet && { echo "No hardening changes generated" >&2; exit 1; }
          git commit -m "fix(gateway): fail closed without a bounded response stream"
          git push origin "HEAD:${BRANCH_NAME}"
