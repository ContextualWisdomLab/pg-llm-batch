name: One-shot bounded control JSON red evidence

on:
  push:
    branches: [agent/bounded-control-plane-json]
    paths:
      - .github/workflows/one-shot-bounded-control-json-red.yml

permissions:
  contents: write

concurrency:
  group: one-shot-bounded-control-json-red
  cancel-in-progress: true

jobs:
  verify-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/bounded-control-plane-json
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Install exact locked dependencies
        run: uv sync --locked

      - name: Require the pre-implementation suite to fail for the new contract
        run: |
          set +e
          uv run pytest -q tests/test_bounded_control_plane_json.py > /tmp/control-json-red.log 2>&1
          status=$?
          set -e
          cat /tmp/control-json-red.log
          if [ "$status" -eq 0 ]; then
            echo "::error::Bounded control JSON tests unexpectedly passed before implementation"
            exit 1
          fi
          grep -F "max_control_response_bytes" /tmp/control-json-red.log
          grep -E "FAILED|TypeError|AttributeError|AssertionError" /tmp/control-json-red.log

      - name: Record immutable red evidence and remove this workflow
        env:
          BRANCH_NAME: agent/bounded-control-plane-json
        run: |
          set -euo pipefail
          mkdir -p docs/superpowers/evidence
          cat > docs/superpowers/evidence/2026-08-05-bounded-control-plane-json-red.md <<EOF
          # Bounded control-plane JSON red evidence

          - Pre-implementation head: \`$(git rev-parse HEAD)\`
          - Command: \`uv run pytest -q tests/test_bounded_control_plane_json.py\`
          - Exit status: nonzero, required by the one-shot workflow
          - Observed contract failure: \`BatchAPIClient\` did not accept
            \`max_control_response_bytes\`, and control-plane JSON still used
            whole-body response decoding.

          The workflow required both the new field name and pytest failure markers;
          unrelated setup failures could not satisfy the RED gate.
          EOF
          rm .github/workflows/one-shot-bounded-control-json-red.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/superpowers/evidence/2026-08-05-bounded-control-plane-json-red.md \
            .github/workflows/one-shot-bounded-control-json-red.yml
          git commit -m "test(gateway): record bounded control JSON red evidence"
          git push origin "HEAD:${BRANCH_NAME}"
