name: One-shot invalid byte chunk green v2

on:
  push:
    branches: [agent/bounded-control-plane-json]
    paths:
      - .github/workflows/one-shot-invalid-byte-chunk-green-v2.yml

permissions:
  contents: write

concurrency:
  group: one-shot-invalid-byte-chunk-green-v2
  cancel-in-progress: true

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/bounded-control-plane-json
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Apply malformed chunk boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("pg_llm_batch/batch_api_client.py")
          source = path.read_text(encoding="utf-8")
          marker = "        async for chunk in iterator(DOWNLOAD_CHUNK_BYTES):\n"
          guard = (
              "            if not isinstance(chunk, (bytes, bytearray, memoryview)):\n"
              "                raise GatewayError(\n"
              "                    f\"{operation} response yielded a non-byte stream chunk\",\n"
              "                    status_code=getattr(response, \"status\", None),\n"
              "                    response_data={\"error_type\": \"InvalidByteChunk\"},\n"
              "                )\n"
          )
          if guard not in source:
              if source.count(marker) != 1:
                  raise SystemExit(f"expected one bounded stream loop, found {source.count(marker)}")
              source = source.replace(marker, marker + guard, 1)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Install exact locked dependencies
        run: uv sync --locked

      - name: Verify focused and complete contracts
        run: |
          set -euo pipefail
          uv run pytest -q tests/test_bounded_control_plane_json.py
          uv run pytest -q -m "not integration"
          uv run python -m compileall -q pg_llm_batch tests
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-report=term-missing --cov-fail-under=100
          uv lock --check
          rm -rf dist
          uv build --no-sources

      - name: Publish verified fix and remove helpers
        env:
          BRANCH_NAME: agent/bounded-control-plane-json
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-shot-invalid-byte-chunk-green.yml \
            .github/workflows/one-shot-invalid-byte-chunk-green-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pg_llm_batch/batch_api_client.py \
            .github/workflows/one-shot-invalid-byte-chunk-green.yml \
            .github/workflows/one-shot-invalid-byte-chunk-green-v2.yml
          git diff --cached --quiet && { echo "No malformed chunk fix generated" >&2; exit 1; }
          git commit -m "fix(gateway): reject malformed response chunks"
          git push origin "HEAD:${BRANCH_NAME}"
