name: Tenant Lifecycle One Shot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: tenant-lifecycle-one-shot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  implement:
    if: >-
      github.repository == 'ContextualWisdomLab/pg-llm-batch' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/tenant-scoped-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse stale or competing branch writers
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$HEAD_BRANCH" = "agent/tenant-scoped-lifecycle"
          mapfile -t writers < <(find .github/workflows -maxdepth 1 -type f \
            \( -name '*one-shot*.yml' -o -name '*repair*.yml' \) -print | sort)
          test "${#writers[@]}" -eq 1
          test "${writers[0]}" = ".github/workflows/tenant-lifecycle-one-shot.yml"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Add tenant-isolation tests first
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          unit_test = r'''# SPDX-License-Identifier: Apache-2.0
          """Tests for tenant-scoped durable lifecycle isolation."""

          from __future__ import annotations

          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          import pytest

          from pg_llm_batch import (
              DEFAULT_TENANT_SCOPE,
              TenantDurableBatchAPIClient,
              get_remote_batch_state,
              get_tenant_remote_batch_state,
              persist_tenant_remote_batch_state,
              validate_tenant_scope,
          )
          from pg_llm_batch import db
          from pg_llm_batch.batch_api_client import GatewayCredentials
          from pg_llm_batch.exceptions import ValidationError


          class _Cursor:
              """Record SQL and return configured lifecycle rows."""

              def __init__(self, driver: Any) -> None:
                  self.driver = driver

              def __enter__(self):
                  return self

              def __exit__(self, *exc: Any):
                  return None

              def execute(self, sql: str, params: Any = None) -> None:
                  self.driver.executions.append((sql, params))

              def fetchone(self):
                  if not self.driver.rows:
                      return None
                  return self.driver.rows.pop(0)


          class _Connection:
              """Expose one cursor and explicit commit evidence."""

              def __init__(self, driver: Any) -> None:
                  self.driver = driver

              def __enter__(self):
                  return self

              def __exit__(self, *exc: Any):
                  return None

              def cursor(self):
                  return _Cursor(self.driver)

              def commit(self) -> None:
                  self.driver.commits += 1


          class _Psycopg:
              """Minimal psycopg replacement for lifecycle helpers."""

              def __init__(self, rows: list[Any] | None = None) -> None:
                  self.rows = list(rows or [])
                  self.executions: list[tuple[str, Any]] = []
                  self.connections: list[str] = []
                  self.commits = 0

              def connect(self, dsn: str):
                  self.connections.append(dsn)
                  return _Connection(self)


          def _credentials(_alias: str) -> GatewayCredentials:
              """Return deterministic credentials without external effects."""
              return GatewayCredentials(
                  url="https://gateway.example/v1",
                  api_key="secret",
              )


          @pytest.mark.parametrize(
              "tenant_scope",
              ["tenant-a", "Team.alpha:west_2", "A" * 128, DEFAULT_TENANT_SCOPE],
          )
          def test_validate_tenant_scope_accepts_exact_bounded_ascii(
              tenant_scope: str,
          ) -> None:
              """Trusted scopes retain their exact validated identity."""
              assert validate_tenant_scope(tenant_scope) == tenant_scope


          @pytest.mark.parametrize(
              "tenant_scope",
              [
                  None,
                  True,
                  "",
                  " tenant-a",
                  "tenant-a ",
                  "tenant/a",
                  "tenant%2Fa",
                  "한글",
                  "a" * 129,
              ],
          )
          def test_validate_tenant_scope_rejects_ambiguous_or_unbounded_values(
              tenant_scope: Any,
          ) -> None:
              """Untrusted scope syntax fails without coercion."""
              with pytest.raises(ValidationError) as captured:
                  validate_tenant_scope(tenant_scope)
              assert captured.value.details["field"] == "tenant_scope"


          def test_tenant_persistence_binds_scope_before_rls_checked_upsert(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              """One statement installs local scope and uses a tenant-qualified key."""
              driver = _Psycopg()
              monkeypatch.setattr(db, "psycopg", driver)
              observed = datetime(2026, 8, 5, 11, 0, tzinfo=timezone.utc)

              snapshot = persist_tenant_remote_batch_state(
                  "postgresql://tenant",
                  "tenant-a",
                  "primary",
                  {
                      "id": "batch-1",
                      "status": "completed",
                      "request_counts": {"total": 2, "completed": 2, "failed": 0},
                  },
                  9,
                  observed_at=observed,
              )

              assert snapshot["tenant_scope"] == "tenant-a"
              sql, params = driver.executions[0]
              assert "set_config('pg_llm_batch.tenant_scope', %s, true)" in sql
              assert (
                  "ON CONFLICT (tenant_scope, endpoint_alias, remote_batch_id)"
                  in sql
              )
              assert params[-1] == "tenant-a"
              assert driver.commits == 1


          def test_standalone_persistence_retains_legacy_return_shape(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              """The legacy helper writes standalone scope without adding a return key."""
              driver = _Psycopg()
              monkeypatch.setattr(db, "psycopg", driver)

              snapshot = db.persist_remote_batch_state(
                  "postgresql://standalone",
                  "primary",
                  {"id": "batch-standalone"},
                  10,
              )

              assert "tenant_scope" not in snapshot
              assert driver.executions[0][1][-1] == DEFAULT_TENANT_SCOPE


          def test_tenant_reads_are_scope_bound_and_return_curated_rows(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              """Tenant reads set transaction context and never query by ID alone."""
              observed = datetime(2026, 8, 5, 11, 1, tzinfo=timezone.utc)
              row = (
                  "tenant-a",
                  "primary",
                  "batch-1",
                  9,
                  "file-1",
                  "/v1/responses",
                  "completed",
                  "output-1",
                  None,
                  2,
                  2,
                  0,
                  {"safe": True},
                  observed,
                  observed,
                  observed,
                  observed,
              )
              standalone_row = (DEFAULT_TENANT_SCOPE, *row[1:])
              driver = _Psycopg(rows=[row, None, standalone_row])
              monkeypatch.setattr(db, "psycopg", driver)

              snapshot = get_tenant_remote_batch_state(
                  "postgresql://tenant", "tenant-a", "primary", "batch-1"
              )
              missing = get_tenant_remote_batch_state(
                  "postgresql://tenant", "tenant-b", "primary", "batch-1"
              )
              standalone = get_remote_batch_state(
                  "postgresql://tenant", "primary", "batch-1"
              )

              assert snapshot is not None
              assert snapshot["tenant_scope"] == "tenant-a"
              assert snapshot["provider_metadata"] == {"safe": True}
              assert missing is None
              assert standalone is not None
              assert standalone["tenant_scope"] == DEFAULT_TENANT_SCOPE
              first_sql, first_params = driver.executions[0]
              assert "MATERIALIZED" in first_sql
              assert "set_config('pg_llm_batch.tenant_scope', %s, true)" in first_sql
              assert first_params == ("tenant-a", "primary", "batch-1")


          async def test_tenant_client_dispatches_only_to_tenant_recorder() -> None:
              """The tenant client propagates the trusted scope through its recorder seam."""
              recorded: list[tuple[str, str, str, dict[str, Any], int]] = []

              def recorder(
                  dsn: str,
                  tenant_scope: str,
                  alias: str,
                  payload: Any,
                  observation_order: int,
              ) -> None:
                  recorded.append(
                      (dsn, tenant_scope, alias, dict(payload), observation_order)
                  )

              client = TenantDurableBatchAPIClient(
                  "postgresql://tenant",
                  _credentials,
                  tenant_scope="tenant-a",
                  tenant_lifecycle_recorder=recorder,
              )
              await client._write_lifecycle_snapshot(
                  "primary", {"id": "batch-1", "status": "validating"}, 11
              )

              assert client.tenant_scope == "tenant-a"
              assert recorded == [
                  (
                      "postgresql://tenant",
                      "tenant-a",
                      "primary",
                      {"id": "batch-1", "status": "validating"},
                      11,
                  )
              ]


          def test_tenant_client_rejects_invalid_scope_before_client_setup() -> None:
              """Construction fails before a reserver, credential lookup, or provider call."""
              with pytest.raises(ValidationError):
                  TenantDurableBatchAPIClient(
                      "postgresql://tenant",
                      _credentials,
                      tenant_scope=" tenant-a",
                  )


          def test_tenant_client_rejects_legacy_recorder_seam() -> None:
              """Tenant callers cannot accidentally inject an unscoped recorder."""
              with pytest.raises(ValidationError, match="tenant_lifecycle_recorder"):
                  TenantDurableBatchAPIClient(
                      "postgresql://tenant",
                      _credentials,
                      tenant_scope="tenant-a",
                      lifecycle_recorder=lambda *_args: None,
                  )


          def test_schema_migrates_and_forces_tenant_row_isolation() -> None:
              """The canonical DDL backfills safely and installs default-deny RLS."""
              schema = Path(db.SCHEMA_PATH).read_text(encoding="utf-8")
              source = Path(db.__file__).read_text(encoding="utf-8")
              assert "tenant_scope TEXT NOT NULL DEFAULT 'standalone'" in schema
              assert "ck_llm_remote_batch_jobs_tenant_scope" in schema
              assert (
                  "UNIQUE (tenant_scope, endpoint_alias, remote_batch_id)" in schema
              )
              assert "DROP CONSTRAINT IF EXISTS uq_llm_remote_batch_jobs_endpoint_id" in schema
              assert "ENABLE ROW LEVEL SECURITY" in schema
              assert "FORCE ROW LEVEL SECURITY" in schema
              assert "pl_llm_remote_batch_jobs_tenant_scope" in schema
              assert "current_setting('pg_llm_batch.tenant_scope', true)" in schema
              assert "idx_llm_remote_batch_jobs_tenant_status_observed" in schema
              assert "idx_llm_remote_batch_jobs_status_observed" in schema
              assert "set_config('pg_llm_batch.tenant_scope', %s, true)" in source
          '''
          Path("tests/test_tenant_scoped_lifecycle.py").write_text(
              unit_test.replace("\n          ", "\n").lstrip(),
              encoding="utf-8",
          )

          integration_test = r'''# SPDX-License-Identifier: Apache-2.0
          """Live PostgreSQL isolation tests for tenant lifecycle state."""

          from __future__ import annotations

          import os
          import uuid

          import pytest

          from pg_llm_batch import db

          pytestmark = pytest.mark.integration
          DSN = os.environ.get("PG_LLM_BATCH_TEST_DSN")
          skip_no_db = pytest.mark.skipif(
              not DSN,
              reason="PG_LLM_BATCH_TEST_DSN not set; skipping live-DB integration",
          )


          @skip_no_db
          def test_live_rls_separates_identical_provider_ids_by_tenant() -> None:
              """A non-bypass role cannot observe another tenant's identical batch ID."""
              import psycopg
              from psycopg import sql
              from psycopg.conninfo import make_conninfo

              db.apply_schema(DSN)
              suffix = uuid.uuid4().hex[:12]
              role_name = f"tenant_scope_test_{suffix}"
              password = uuid.uuid4().hex
              batch_id = f"batch-{suffix}"
              role_dsn = make_conninfo(DSN, user=role_name, password=password)

              with psycopg.connect(DSN) as admin:
                  with admin.cursor() as cursor:
                      cursor.execute(
                          sql.SQL(
                              "CREATE ROLE {} LOGIN PASSWORD %s "
                              "NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT "
                              "NOREPLICATION NOBYPASSRLS"
                          ).format(sql.Identifier(role_name)),
                          (password,),
                      )
                      cursor.execute(
                          sql.SQL(
                              "GRANT SELECT, INSERT, UPDATE ON "
                              "llm_remote_batch_jobs TO {}"
                          ).format(sql.Identifier(role_name))
                      )
                  admin.commit()

              try:
                  db.persist_tenant_remote_batch_state(
                      role_dsn,
                      "tenant-a",
                      "primary",
                      {"id": batch_id, "status": "in_progress"},
                      1,
                  )
                  db.persist_tenant_remote_batch_state(
                      role_dsn,
                      "tenant-b",
                      "primary",
                      {"id": batch_id, "status": "in_progress"},
                      2,
                  )
                  assert db.get_tenant_remote_batch_state(
                      role_dsn, "tenant-a", "primary", batch_id
                  )["tenant_scope"] == "tenant-a"
                  assert db.get_tenant_remote_batch_state(
                      role_dsn, "tenant-b", "primary", batch_id
                  )["tenant_scope"] == "tenant-b"

                  with psycopg.connect(role_dsn) as tenant_connection:
                      with tenant_connection.cursor() as cursor:
                          cursor.execute(
                              "SELECT set_config(" 
                              "'pg_llm_batch.tenant_scope', %s, true)",
                              ("tenant-a",),
                          )
                          cursor.execute(
                              "SELECT COUNT(*) FROM llm_remote_batch_jobs "
                              "WHERE tenant_scope = %s AND remote_batch_id = %s",
                              ("tenant-b", batch_id),
                          )
                          assert cursor.fetchone()[0] == 0
              finally:
                  with psycopg.connect(DSN) as admin:
                      with admin.cursor() as cursor:
                          for tenant_scope in ("tenant-a", "tenant-b"):
                              cursor.execute(
                                  "SELECT set_config(" 
                                  "'pg_llm_batch.tenant_scope', %s, true)",
                                  (tenant_scope,),
                              )
                              cursor.execute(
                                  "DELETE FROM llm_remote_batch_jobs "
                                  "WHERE tenant_scope = %s AND remote_batch_id = %s",
                                  (tenant_scope, batch_id),
                              )
                          cursor.execute(
                              sql.SQL("DROP OWNED BY {}").format(
                                  sql.Identifier(role_name)
                              )
                          )
                          cursor.execute(
                              sql.SQL("DROP ROLE {}").format(sql.Identifier(role_name))
                          )
                      admin.commit()
          '''
          Path("tests/test_tenant_lifecycle_integration.py").write_text(
              integration_test.replace("\n          ", "\n").lstrip(),
              encoding="utf-8",
          )

          lifecycle_tests = Path("tests/test_remote_batch_lifecycle.py")
          lifecycle_text = lifecycle_tests.read_text(encoding="utf-8")
          replacements = {
              '"CONSTRAINT uq_llm_remote_batch_jobs_endpoint_id"':
                  '"CONSTRAINT uq_llm_remote_batch_jobs_tenant_endpoint_id"',
              '"UNIQUE (endpoint_alias, remote_batch_id)"':
                  '"UNIQUE (tenant_scope, endpoint_alias, remote_batch_id)"',
              '"ON CONFLICT (endpoint_alias, remote_batch_id) DO UPDATE"':
                  '"ON CONFLICT (tenant_scope, endpoint_alias, remote_batch_id) DO UPDATE"',
          }
          for old, new in replacements.items():
              if old not in lifecycle_text:
                  raise SystemExit(f"missing lifecycle test anchor: {old}")
              lifecycle_text = lifecycle_text.replace(old, new)
          lifecycle_tests.write_text(lifecycle_text, encoding="utf-8")
          PY

      - name: Prove the tenant contract is RED
        id: red
        shell: bash
        run: |
          set +e
          uv run pytest -q tests/test_tenant_scoped_lifecycle.py > /tmp/tenant-red.log 2>&1
          status=$?
          set -e
          cat /tmp/tenant-red.log
          test "$status" -ne 0
          grep -Eq "cannot import name|ImportError|ModuleNotFoundError" /tmp/tenant-red.log
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Implement tenant-scoped lifecycle isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          db_path = Path("pg_llm_batch/db.py")
          db_text = db_path.read_text(encoding="utf-8")
          constants_anchor = "MAX_REMOTE_RESOURCE_ID_CHARACTERS = 256\n"
          constants_addition = (
              "DEFAULT_TENANT_SCOPE = \"standalone\"\n"
              "MAX_TENANT_SCOPE_CHARACTERS = 128\n"
              "TENANT_SCOPE_PATTERN = re.compile(\n"
              "    rf\"[A-Za-z0-9][A-Za-z0-9._:-]{{0,{MAX_TENANT_SCOPE_CHARACTERS - 1}}}\\\\Z\"\n"
              ")\n"
              "REMOTE_BATCH_STATE_FIELDS = (\n"
              "    \"tenant_scope\",\n"
              "    \"endpoint_alias\",\n"
              "    \"remote_batch_id\",\n"
              "    \"observation_order\",\n"
              "    \"input_file_id\",\n"
              "    \"batch_endpoint\",\n"
              "    \"batch_status\",\n"
              "    \"output_file_id\",\n"
              "    \"error_file_id\",\n"
              "    \"total_requests\",\n"
              "    \"completed_requests\",\n"
              "    \"failed_requests\",\n"
              "    \"provider_metadata\",\n"
              "    \"first_seen_at\",\n"
              "    \"last_observed_at\",\n"
              "    \"terminal_at\",\n"
              "    \"updated_at\",\n"
              ")\n"
          )
          if constants_addition not in db_text:
              if constants_anchor not in db_text:
                  raise SystemExit("missing db constants anchor")
              db_text = db_text.replace(
                  constants_anchor,
                  constants_anchor + constants_addition,
                  1,
              )

          validator_anchor = "\n\ndef validate_remote_resource_id(value: Any, field: str) -> str:\n"
          validator_code = r'''

          def validate_tenant_scope(value: Any) -> str:
              """Validate one trusted local tenant scope without coercion.

              Tenant scope is an authorization attribute supplied by a trusted host
              boundary. The exact 1-128 character ASCII value is retained; whitespace,
              Unicode, controls, path separators, percent escapes, booleans, and
              over-limit values fail before database or provider effects.
              """
              if (
                  not isinstance(value, str)
                  or TENANT_SCOPE_PATTERN.fullmatch(value) is None
              ):
                  raise ValidationError(
                      field="tenant_scope",
                      value=value,
                      reason=(
                          "must be 1-128 ASCII characters beginning with an "
                          "alphanumeric character and containing only letters, "
                          "digits, dot, underscore, colon, or hyphen"
                      ),
                  )
              return value
          '''.replace("\n          ", "\n")
          if "def validate_tenant_scope" not in db_text:
              if validator_anchor not in db_text:
                  raise SystemExit("missing validator insertion anchor")
              db_text = db_text.replace(
                  validator_anchor,
                  validator_code + validator_anchor,
                  1,
              )

          persist_start = db_text.index("def persist_remote_batch_state(\n")
          persist_end = db_text.index("\n\ndef get_model_metadata", persist_start)
          persist_code = r'''def _build_remote_batch_snapshot(
              tenant_scope: str,
              endpoint_alias: str,
              provider_batch: Mapping[str, Any],
              observation_order: int,
              observed_at: Optional[datetime],
          ) -> tuple[Dict[str, Any], str]:
              """Validate and normalize one tenant-qualified provider observation."""
              normalized_tenant = validate_tenant_scope(tenant_scope)
              if (
                  isinstance(observation_order, bool)
                  or not isinstance(observation_order, int)
                  or observation_order <= 0
              ):
                  raise ValueError("observation_order must be a positive integer")
              try:
                  normalized_alias = validate_endpoint_alias(endpoint_alias)
              except ValidationError as exc:
                  raise ValueError(
                      "endpoint_alias must be a non-empty NUL-free string of at most "
                      f"{MAX_ENDPOINT_ALIAS_CHARACTERS} characters"
                  ) from exc
              if not isinstance(provider_batch, Mapping):
                  raise ValueError("provider_batch must be a mapping object")

              try:
                  remote_batch_id = validate_remote_resource_id(
                      provider_batch.get("id"),
                      "remote_batch_id",
                  )
              except ValidationError as exc:
                  raise ValueError(
                      "remote_batch_id (provider batch id) must be a supported "
                      "non-empty string of at most "
                      f"{MAX_REMOTE_RESOURCE_ID_CHARACTERS} characters"
                  ) from exc

              observed = observed_at or datetime.now(timezone.utc)
              if (
                  not isinstance(observed, datetime)
                  or observed.tzinfo is None
                  or observed.utcoffset() is None
              ):
                  raise ValueError("observed_at must be a timezone-aware datetime")

              input_file_id = _persisted_remote_resource_id(
                  provider_batch.get("input_file_id"),
                  "input_file_id",
              )
              output_file_id = _persisted_remote_resource_id(
                  provider_batch.get("output_file_id"),
                  "output_file_id",
              )
              error_file_id = _persisted_remote_resource_id(
                  provider_batch.get("error_file_id"),
                  "error_file_id",
              )
              batch_status = (
                  normalize_optional_provider_text(provider_batch.get("status"))
                  or "unknown"
              )
              counts_value = provider_batch.get("request_counts")
              request_counts = counts_value if isinstance(counts_value, Mapping) else {}
              provider_metadata, metadata_json = _provider_metadata(
                  provider_batch.get("metadata")
              )
              terminal_at = (
                  observed if batch_status in REMOTE_TERMINAL_STATUSES else None
              )

              snapshot: Dict[str, Any] = {
                  "tenant_scope": normalized_tenant,
                  "endpoint_alias": normalized_alias,
                  "remote_batch_id": remote_batch_id,
                  "observation_order": observation_order,
                  "input_file_id": input_file_id,
                  "batch_endpoint": normalize_optional_provider_text(
                      provider_batch.get("endpoint")
                  ),
                  "batch_status": batch_status,
                  "output_file_id": output_file_id,
                  "error_file_id": error_file_id,
                  "total_requests": _provider_count(request_counts.get("total")),
                  "completed_requests": _provider_count(
                      request_counts.get("completed")
                  ),
                  "failed_requests": _provider_count(request_counts.get("failed")),
                  "provider_metadata": provider_metadata,
                  "observed_at": observed,
                  "terminal_at": terminal_at,
              }
              return snapshot, metadata_json


          def _persist_remote_batch_state(
              dsn: str,
              tenant_scope: str,
              endpoint_alias: str,
              provider_batch: Mapping[str, Any],
              observation_order: int,
              *,
              observed_at: Optional[datetime] = None,
          ) -> Dict[str, Any]:
              """Persist one validated tenant-qualified lifecycle projection."""
              snapshot, metadata_json = _build_remote_batch_snapshot(
                  tenant_scope,
                  endpoint_alias,
                  provider_batch,
                  observation_order,
                  observed_at,
              )
              observed = snapshot["observed_at"]
              terminal_at = snapshot["terminal_at"]
              sql = """
                  INSERT INTO llm_remote_batch_jobs (
                      endpoint_alias,
                      remote_batch_id,
                      observation_order,
                      input_file_id,
                      batch_endpoint,
                      batch_status,
                      output_file_id,
                      error_file_id,
                      total_requests,
                      completed_requests,
                      failed_requests,
                      provider_metadata,
                      first_seen_at,
                      last_observed_at,
                      terminal_at,
                      updated_at,
                      tenant_scope
                  )
                  SELECT
                      %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s,
                      %s::jsonb, %s, %s, %s, %s, tenant_context.tenant_scope
                  FROM (
                      SELECT set_config(
                          'pg_llm_batch.tenant_scope', %s, true
                      ) AS tenant_scope
                  ) AS tenant_context
                  ON CONFLICT (tenant_scope, endpoint_alias, remote_batch_id)
                  DO UPDATE
                  SET observation_order = EXCLUDED.observation_order,
                      input_file_id = COALESCE(
                          EXCLUDED.input_file_id,
                          llm_remote_batch_jobs.input_file_id
                      ),
                      batch_endpoint = COALESCE(
                          EXCLUDED.batch_endpoint,
                          llm_remote_batch_jobs.batch_endpoint
                      ),
                      batch_status = EXCLUDED.batch_status,
                      output_file_id = COALESCE(
                          EXCLUDED.output_file_id,
                          llm_remote_batch_jobs.output_file_id
                      ),
                      error_file_id = COALESCE(
                          EXCLUDED.error_file_id,
                          llm_remote_batch_jobs.error_file_id
                      ),
                      total_requests = GREATEST(
                          llm_remote_batch_jobs.total_requests,
                          EXCLUDED.total_requests
                      ),
                      completed_requests = GREATEST(
                          llm_remote_batch_jobs.completed_requests,
                          EXCLUDED.completed_requests
                      ),
                      failed_requests = GREATEST(
                          llm_remote_batch_jobs.failed_requests,
                          EXCLUDED.failed_requests
                      ),
                      provider_metadata = CASE
                          WHEN EXCLUDED.provider_metadata = '{}'::jsonb
                              THEN llm_remote_batch_jobs.provider_metadata
                          ELSE EXCLUDED.provider_metadata
                      END,
                      last_observed_at = EXCLUDED.last_observed_at,
                      terminal_at = COALESCE(
                          llm_remote_batch_jobs.terminal_at,
                          EXCLUDED.terminal_at
                      ),
                      updated_at = EXCLUDED.updated_at
                  WHERE EXCLUDED.observation_order >
                            llm_remote_batch_jobs.observation_order
                    AND (
                        llm_remote_batch_jobs.batch_status NOT IN (
                            'completed', 'failed', 'expired', 'cancelled'
                        )
                        OR EXCLUDED.batch_status =
                            llm_remote_batch_jobs.batch_status
                    )
              """
              params = (
                  snapshot["endpoint_alias"],
                  snapshot["remote_batch_id"],
                  snapshot["observation_order"],
                  snapshot["input_file_id"],
                  snapshot["batch_endpoint"],
                  snapshot["batch_status"],
                  snapshot["output_file_id"],
                  snapshot["error_file_id"],
                  snapshot["total_requests"],
                  snapshot["completed_requests"],
                  snapshot["failed_requests"],
                  metadata_json,
                  observed,
                  observed,
                  terminal_at,
                  observed,
                  snapshot["tenant_scope"],
              )
              _require_psycopg()
              with psycopg.connect(dsn) as conn:
                  with conn.cursor() as cur:
                      cur.execute(sql, params)
                  conn.commit()
              return snapshot


          def persist_remote_batch_state(
              dsn: str,
              endpoint_alias: str,
              provider_batch: Mapping[str, Any],
              observation_order: int,
              *,
              observed_at: Optional[datetime] = None,
          ) -> Dict[str, Any]:
              """Persist one standalone lifecycle projection compatibly.

              Existing callers retain the original recorder signature and return
              shape. The row is stored under the explicit ``standalone`` tenant
              scope so shared-table deployments cannot collide with named tenants.
              """
              snapshot = _persist_remote_batch_state(
                  dsn,
                  DEFAULT_TENANT_SCOPE,
                  endpoint_alias,
                  provider_batch,
                  observation_order,
                  observed_at=observed_at,
              )
              compatible_snapshot = dict(snapshot)
              compatible_snapshot.pop("tenant_scope")
              return compatible_snapshot


