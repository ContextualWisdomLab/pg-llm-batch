name: One-shot invalid byte chunk green

on:
  push:
    branches:
      - agent/bounded-control-plane-json
    paths:
      - .github/workflows/one-shot-invalid-byte-chunk-green.yml

permissions:
  contents: read

concurrency:
  group: one-shot-invalid-byte-chunk-green
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  implement-and-verify:
    if: >-
      github.repository == 'ContextualWisdomLab/pg-llm-batch' &&
      github.ref == 'refs/heads/agent/bounded-control-plane-json'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Reject malformed response chunks without leakage
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -I - <<'PY'
          from pathlib import Path

          path = Path("pg_llm_batch/batch_api_client.py")
          source = path.read_text(encoding="utf-8")
          old = '''        async for chunk in iterator(DOWNLOAD_CHUNK_BYTES):
              if len(payload) + len(chunk) > max_bytes:
                  raise self._download_limit_error(
                      response,
                      operation,
                      max_bytes=max_bytes,
                      declared_bytes=declared_bytes,
                      bytes_read=len(payload),
                  )
              payload.extend(chunk)
          '''
          new = '''        async for chunk in iterator(DOWNLOAD_CHUNK_BYTES):
              if not isinstance(chunk, (bytes, bytearray, memoryview)):
                  raise GatewayError(
                      f"{operation} response yielded a non-byte stream chunk",
                      status_code=getattr(response, "status", None),
                      response_data={"error_type": "InvalidByteChunk"},
                  )
              if len(payload) + len(chunk) > max_bytes:
                  raise self._download_limit_error(
                      response,
                      operation,
                      max_bytes=max_bytes,
                      declared_bytes=declared_bytes,
                      bytes_read=len(payload),
                  )
              payload.extend(chunk)
          '''
          if source.count(old) != 1:
              raise SystemExit(f"expected one bounded stream loop, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Install exact locked dependencies
        run: uv sync --locked

      - name: Verify focused and complete contracts
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          uv run pytest -q tests/test_bounded_control_plane_json.py
          uv run pytest -q -m "not integration"
          uv run python -m compileall -q pg_llm_batch tests
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-report=term-missing --cov-fail-under=100
          uv lock --check
          rm -rf dist
          uv build --no-sources
          git diff --check

      - name: Publish verified fix and remove one-shot workflow
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          BRANCH_NAME: agent/bounded-control-plane-json
          PUSH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/one-shot-invalid-byte-chunk-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No verified fix generated" >&2; exit 1; }
          git commit -m "fix(gateway): reject malformed response chunks"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git fetch origin "$BRANCH_NAME"
          git rebase "origin/$BRANCH_NAME"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:${BRANCH_NAME}"
