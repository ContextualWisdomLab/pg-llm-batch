name: Finalize Commercial PostgreSQL Lock

on:
  push:
    branches:
      - feat/commercial-postgres-driver-port-b84f0c9
    paths:
      - .github/workflows/lock-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: finalize-commercial-postgres-lock
  cancel-in-progress: false

jobs:
  finalize-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up repository-pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          prune-cache: true

      - name: Regenerate and verify production runtime lock
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          uv lock --check
          if git diff --quiet -- uv.lock; then
            echo "Expected the stale committed lock to change" >&2
            exit 1
          fi

          python - <<'PY'
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path("uv.lock").read_text())
          project = next(package for package in lock["package"] if package["name"] == "pg-llm-batch")
          runtime = {dependency["name"] for dependency in project["dependencies"]}
          assert "pg8000" in runtime
          assert "psycopg" not in runtime
          pg8000 = next(package for package in lock["package"] if package["name"] == "pg8000")
          assert pg8000["version"] == "1.31.5"
          PY

          uv sync --locked --no-dev
          .venv/bin/python - <<'PY'
          from importlib.metadata import PackageNotFoundError, version

          assert version("pg8000") == "1.31.5"
          try:
              version("psycopg")
          except PackageNotFoundError:
              pass
          else:
              raise AssertionError("Psycopg must not be installed in the default runtime graph")

          from pg_llm_batch.pg8000_driver_adapter import Pg8000DriverAdapter
          from pg_llm_batch.postgres_driver_runtime import retained_postgres_driver

          assert isinstance(retained_postgres_driver(), Pg8000DriverAdapter)
          PY

          uv build --no-sources

      - name: Commit verified lock and remove temporary finalizer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: feat/commercial-postgres-driver-port-b84f0c9
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          authenticated_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote_head="$(git ls-remote "$authenticated_remote" "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"

          rm -- .github/workflows/lock-diagnostic.yml
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock .github/workflows/lock-diagnostic.yml

          actual_paths="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' \
            .github/workflows/lock-diagnostic.yml \
            uv.lock | LC_ALL=C sort)"
          test "$actual_paths" = "$expected_paths"

          git commit -m "build(postgres): lock admitted pg8000 runtime graph"
          git remote set-url origin "$authenticated_remote"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"
