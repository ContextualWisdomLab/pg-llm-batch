# Standalone stack: pg_tiktoken-enabled Postgres + the pg-llm-batch component.
services:
  postgres:
    build:
      # Self-contained context: the Dockerfile only COPYs files under docker/postgres.
      context: docker/postgres
      dockerfile: Dockerfile
      target: with-tiktoken
      args:
        PG_MAJOR: "16"
    environment:
      POSTGRES_USER: pgllm
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: pgllm
    secrets:
      - postgres_password
    ports:
      # Standalone host access is local-only by default. Remote deployments must
      # opt into an explicit ingress/network policy instead of inheriting 0.0.0.0.
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Readiness = DB up AND pg_tiktoken present (mirrors /healthz gate).
      test:
        - CMD-SHELL
        - >-
          pg_isready -U pgllm -d pgllm &&
          psql -U pgllm -d pgllm -tAc
          "SELECT bool_and(is_ready) FROM pg_llm_batch_health_check()
           WHERE component IN ('database','pg_tiktoken','com_config')" | grep -q t
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    volumes:
      - pgdata:/var/lib/postgresql/data

  component:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Credential-free bootstrap target. The runtime reads the password from
      # the same explicit Compose secret and combines it only in process memory.
      PG_LLM_BATCH_DSN: "postgresql://pgllm@postgres:5432/pgllm"
    secrets:
      - postgres_password
    command:
      - python
      - -m
      - pg_llm_batch.compose_bootstrap
      - --password-file
      - /run/secrets/postgres_password
    ports:
      # The bundled standalone profile is deliberately host-local. Operators
      # expose production health/API surfaces only through reviewed ingress.
      - "127.0.0.1:8080:8080"

secrets:
  # The value must be supplied by the deployment environment. Compose mounts it
  # only into services that explicitly request this secret; it is not committed
  # to the repository or embedded in the configured DSN/command line.
  postgres_password:
    environment: PG_LLM_BATCH_POSTGRES_PASSWORD

volumes:
  pgdata:
