name: One-shot maintenance consolidation

on:
  push:
    branches: [agent/consolidate-maintenance-updates]
    paths:
      - .github/workflows/one-shot-maintenance-consolidation.yml

permissions:
  contents: write

concurrency:
  group: one-shot-maintenance-consolidation
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/consolidate-maintenance-updates
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true
      - name: Regenerate the Ruff lock entry
        run: uv lock --upgrade-package ruff
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify Python quality gates
        run: |
          set -euo pipefail
          uv run python -m compileall -q pg_llm_batch
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-report=term-missing --cov-fail-under=100
          uv lock --check
          uv build --no-sources
          git diff --check
      - name: Verify workflow upgrade contract
        run: |
          set -euo pipefail
          test "$(grep -c 'step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920' .github/workflows/ci.yml)" -eq 3
          test "$(grep -c 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' .github/workflows/ci.yml)" -eq 3
          test "$(grep -c 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97' .github/workflows/ci.yml)" -eq 2
          test "$(grep -c 'astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9' .github/workflows/ci.yml)" -eq 2
          test "$(grep -c 'prune-cache: true' .github/workflows/ci.yml)" -eq 2
          ! grep -R --line-number --fixed-strings 'ruff==0.16.0' pyproject.toml uv.lock
      - name: Verify container definitions
        run: |
          set -euo pipefail
          docker compose config >/dev/null
          docker build --tag pg-llm-batch:maintenance .
          docker build --tag pg-llm-batch-postgres:maintenance docker/postgres
      - name: Publish verified lockfile and remove one-shot workflow
        env:
          BRANCH_NAME: agent/consolidate-maintenance-updates
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-maintenance-consolidation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock .github/workflows/one-shot-maintenance-consolidation.yml
          git commit -m "chore(deps): regenerate lockfile for Ruff 0.16.1"
          git push origin "HEAD:${BRANCH_NAME}"
