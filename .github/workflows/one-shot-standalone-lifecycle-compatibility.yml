name: One-shot standalone lifecycle compatibility

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/one-shot-standalone-lifecycle-compatibility.yml

permissions:
  contents: read

concurrency:
  group: one-shot-standalone-lifecycle-compatibility-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair-verify-publish:
    if: >-
      github.repository == 'ContextualWisdomLab/pg-llm-batch' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/tenant-scoped-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Refuse stale state or competing branch writers
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PARENT: d484b24a8c5db9f15cee85ccc9c7654c8f43bdfa
          EXPECTED_BASE: f0c5f79c5327a090014dd5558750110fce9fd2ac
          BRANCH_NAME: agent/tenant-scoped-lifecycle
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/$BRANCH_NAME | cut -f1)" = "$EXPECTED_HEAD"
          mapfile -t writers < <(find .github/workflows -maxdepth 1 -type f \
            \( -name '*one-shot*.yml' -o -name '*repair*.yml' \) -print | sort)
          test "${#writers[@]}" -eq 1
          test "${writers[0]}" = ".github/workflows/one-shot-standalone-lifecycle-compatibility.yml"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          prune-cache: true

      - name: Install exact locked dependencies
        run: uv sync --locked

      - name: Prove compatibility and contract regressions are RED
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set +e
          red_output="$(
            uv run pytest -q \
              tests/test_standalone_lifecycle_compatibility.py::test_standalone_persistence_keeps_the_pre_tenant_return_shape \
              tests/test_remote_batch_state_contracts.py::test_operator_docs_define_current_state_and_tenant_trust_boundaries \
              tests/test_tenant_lifecycle_schema.py::test_legacy_lifecycle_rows_are_backfilled_without_deletion \
              tests/test_tenant_lifecycle_schema.py::test_rls_owner_transition_is_atomic_for_psql_reapplication \
              tests/test_tenant_operator_documentation.py::test_remote_lifecycle_guide_exposes_tenant_qualified_operations \
              tests/test_tenant_operator_documentation.py::test_architecture_and_doctoring_bound_the_custom_guc_claim \
              2>&1
          )"
          red_status=$?
          set -e
          printf '%s\n' "$red_output"
          test "$red_status" -ne 0
          printf '%s\n' "$red_output" | grep -F 'assert "tenant_scope" not in snapshot'
          printf '%s\n' "$red_output" | grep -F '5 failed'

      - name: Restore compatibility and correct contract assertions
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -I - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              """Apply one reviewed exact replacement without partial states."""
              source = path.read_text(encoding="utf-8")
              if source.count(old) != 1:
                  raise SystemExit(
                      f"{path}: expected one replacement anchor, found {source.count(old)}"
                  )
              path.write_text(source.replace(old, new, 1), encoding="utf-8")

          old_wrapper = (
              '    """Persist one lifecycle projection in the explicit standalone scope."""\n'
              '    return _persist_remote_batch_state(\n'
              '        dsn,\n'
              '        DEFAULT_TENANT_SCOPE,\n'
              '        endpoint_alias,\n'
              '        provider_batch,\n'
              '        observation_order,\n'
              '        observed_at=observed_at,\n'
              '    )\n'
          )
          new_wrapper = (
              '    """Persist one standalone projection without changing its return shape."""\n'
              '    snapshot = _persist_remote_batch_state(\n'
              '        dsn,\n'
              '        DEFAULT_TENANT_SCOPE,\n'
              '        endpoint_alias,\n'
              '        provider_batch,\n'
              '        observation_order,\n'
              '        observed_at=observed_at,\n'
              '    )\n'
              '    snapshot.pop("tenant_scope", None)\n'
              '    return snapshot\n'
          )
          replace_once(Path("pg_llm_batch/db.py"), old_wrapper, new_wrapper)
          replace_once(
              Path("tests/test_remote_batch_lifecycle.py"),
              '        "tenant_scope": "standalone",\n',
              "",
          )
          replace_once(
              Path("tests/test_remote_batch_lifecycle.py"),
              '    assert snapshot["tenant_scope"] == "standalone"\n',
              '    assert "tenant_scope" not in snapshot\n',
          )
          replace_once(
              Path("tests/test_tenant_lifecycle_persistence.py"),
              '    assert snapshot["tenant_scope"] == "standalone"\n',
              '    assert "tenant_scope" not in snapshot\n',
          )

          schema_tests = Path("tests/test_tenant_lifecycle_schema.py")
          replace_once(
              schema_tests,
              '''    assert (
                  "ALTER TABLE llm_remote_batch_jobs\\n"
                  "    ADD COLUMN IF NOT EXISTS tenant_scope TEXT;"
              ) in schema
              assert (
                  "UPDATE llm_remote_batch_jobs\\n"
                  "SET tenant_scope = 'standalone'\\n"
                  "WHERE tenant_scope IS NULL;"
              ) in schema
              '''.replace("\n              ", "\n"),
              '''    migration_start = schema.index(
                  "-- Reapplying the schema may occur after FORCE RLS was installed."
              )
              migration_end = schema.index(
                  "DROP INDEX IF EXISTS idx_llm_remote_batch_jobs_status_observed;"
              )
              migration = schema[migration_start:migration_end]
              assert "ADD COLUMN IF NOT EXISTS tenant_scope TEXT" in migration
              assert "SET tenant_scope = 'standalone'" in migration
              '''.replace("\n              ", "\n"),
          )
          replace_once(
              schema_tests,
              '''    assert atomic_transition.index("SET tenant_scope = 'standalone'") < atomic_transition.index(
                  "FORCE ROW LEVEL SECURITY"
              )
              '''.replace("\n              ", "\n"),
              '''    force_statement = (
                  "ALTER TABLE llm_remote_batch_jobs FORCE ROW LEVEL SECURITY;"
              )
              assert atomic_transition.index("SET tenant_scope = 'standalone'") < atomic_transition.rindex(
                  force_statement
              )
              '''.replace("\n              ", "\n"),
          )

          lifecycle_guide = Path("docs/remote-batch-lifecycle.md")
          replace_once(
              lifecycle_guide,
              "The durable table is a mutable current-state\nprojection, not append-only audit history.",
              "The durable table is a mutable\ncurrent-state projection, not append-only audit history.",
          )
          replace_once(
              lifecycle_guide,
              "can execute arbitrary SQL can call `set_config` with an arbitrary tenant\nscope.",
              "can execute arbitrary SQL can call `set_config` with an arbitrary tenant scope.\n",
          )
          replace_once(
              Path("docs/doctoring/tenant-scoped-lifecycle.md"),
              "This design is a **trusted\napplication boundary** and is not a substitute",
              "This design is a **trusted application boundary** and is not a substitute",
          )
          PY
          git diff --check

      - name: Verify focused compatibility and documentation contracts
        run: |
          uv run pytest -q \
            tests/test_standalone_lifecycle_compatibility.py \
            tests/test_remote_batch_lifecycle.py \
            tests/test_tenant_lifecycle_persistence.py \
            tests/test_tenant_durable_client.py \
            tests/test_remote_batch_state_contracts.py \
            tests/test_tenant_lifecycle_schema.py \
            tests/test_tenant_operator_documentation.py

      - name: Verify complete deterministic and packaging gates
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          uv run python -m compileall -q pg_llm_batch tests
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-branch --cov-report=term-missing \
            --cov-fail-under=100
          uv lock --check
          rm -rf build dist
          uv build --no-sources
          docker compose config >/dev/null
          docker build --tag pg-llm-batch:standalone-compatibility .
          docker build --tag pg-llm-batch-postgres:standalone-compatibility docker/postgres

      - name: Record evidence and remove temporary automation
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          rm .github/workflows/one-shot-standalone-lifecycle-compatibility.yml
          rm -rf .coverage .coverage.* htmlcov build dist
          mkdir -p docs/superpowers/evidence
          cat > docs/superpowers/evidence/2026-08-05-standalone-lifecycle-compatibility.md <<EOF
          # Standalone Lifecycle Compatibility Evidence

          - RED workflow source head: \`$SOURCE_HEAD\`.
          - The strict regression demonstrated that the legacy
            \`persist_remote_batch_state()\` result had gained a
            \`tenant_scope\` key and therefore changed its exact public shape.
          - The standalone wrapper continues to bind transaction-local scope
            \`standalone\` for forced RLS, but removes the internal scope field
            before returning to existing callers.
          - The explicit tenant-aware persistence helper retains and returns its
            trusted \`tenant_scope\`.
          - Migration assertions inspect the atomic owner-transition block, and
            the FORCE-order assertion distinguishes the final FORCE statement
            from the earlier NO FORCE statement.
          - Operator and doctoring prose now exposes the exact current-state and
            trusted-boundary limitations required by the static contracts.
          - Focused contracts, the complete non-integration suite, 100%
            production statement/branch/docstring coverage, Ruff, compilation,
            lock freshness, distributions, Compose validation, and both
            container builds passed.
          - Temporary write-capable automation removed itself from the final tree.
          EOF
          test ! -e .github/workflows/one-shot-standalone-lifecycle-compatibility.yml
          git diff --check

      - name: Publish only from the unchanged exact remote head
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          BRANCH_NAME: agent/tenant-scoped-lifecycle
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/$BRANCH_NAME | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No compatibility repair generated" >&2; exit 1; }
          git commit -m "fix(tenant): preserve standalone lifecycle contracts"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:${BRANCH_NAME}"
