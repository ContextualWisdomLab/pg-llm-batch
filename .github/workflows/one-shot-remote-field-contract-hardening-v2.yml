name: One-shot durable remote field contract hardening v2

on:
  push:
    branches: [agent/persist-remote-batch-lifecycle]
    paths:
      - .github/workflows/one-shot-remote-field-contract-hardening-v2.yml

permissions:
  contents: write

concurrency:
  group: one-shot-durable-remote-field-contract-hardening-v2
  cancel-in-progress: true

jobs:
  harden-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout lifecycle branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/persist-remote-batch-lifecycle
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Prove optional provider field contracts are red
        run: |
          set -euo pipefail
          pre_fix_head=$(git rev-parse HEAD)
          python .github/scripts/one_shot_remote_field_contract.py prepare-tests
          set +e
          uv run pytest -q tests/test_remote_batch_state_contracts.py \
            -k remote_field_contract > /tmp/remote-field-red.log 2>&1
          status=$?
          set -e
          cat /tmp/remote-field-red.log
          if [ "$status" -eq 0 ]; then
            echo "::error::Remote field regressions unexpectedly passed before implementation"
            exit 1
          fi
          grep -E "FAILED|AssertionError|DID NOT RAISE" /tmp/remote-field-red.log
          python .github/scripts/one_shot_remote_field_contract.py \
            evidence --head "$pre_fix_head"

      - name: Apply shared remote field validation and schema defense
        run: python .github/scripts/one_shot_remote_field_contract.py apply

      - name: Verify hardened lifecycle product tree
        run: |
          set -euo pipefail
          uv run pytest -q tests/test_remote_batch_state_contracts.py \
            -k remote_field_contract
          uv run pytest -q \
            tests/test_remote_batch_lifecycle.py \
            tests/test_remote_batch_state_contracts.py \
            tests/test_schema_integrity.py
          uv run pytest -q -m "not integration"
          uv run python -m compileall -q pg_llm_batch
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate \
            --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-report=term-missing --cov-fail-under=100
          uv lock --check
          rm -rf dist
          uv build --no-sources
          docker compose config >/dev/null
          docker build --tag pg-llm-batch:remote-field-contract .
          docker build \
            --tag pg-llm-batch-postgres:remote-field-contract docker/postgres

      - name: Publish verified hardening and remove temporary files
        env:
          BRANCH_NAME: agent/persist-remote-batch-lifecycle
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-remote-field-contract-hardening.yml
          rm .github/workflows/one-shot-remote-field-contract-hardening-v2.yml
          rm .github/scripts/one_shot_remote_field_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pg_llm_batch/db.py \
            pg_llm_batch/durable_client.py \
            pg_llm_batch/schema.sql \
            docker/postgres/init/02_schema.sql \
            tests/test_remote_batch_state_contracts.py \
            docs/remote-batch-lifecycle.md \
            docs/superpowers/evidence/2026-08-04-remote-field-contract-red.md \
            CHANGELOG.md \
            .github/workflows/one-shot-remote-field-contract-hardening.yml \
            .github/workflows/one-shot-remote-field-contract-hardening-v2.yml \
            .github/scripts/one_shot_remote_field_contract.py
          git diff --cached --quiet && {
            echo "No durable remote field contract changes generated" >&2
            exit 1
          }
          git commit -m "fix(lifecycle): validate every persisted remote field"
          git push origin "HEAD:${BRANCH_NAME}"
