name: Repair Runtime Store Provisioning Boundary

on:
  push:
    branches:
      - fix/runtime-store-provisioning-d0a4b30
    paths:
      - .github/workflows/repair-runtime-store-provisioning.yml

permissions:
  contents: read

concurrency:
  group: repair-runtime-store-provisioning
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40
        with:
          egress-policy: audit

      - name: Check out exact repair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Set up repository toolchain
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.3"
          prune-cache: true

      - name: Verify exact RED source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          uv sync --locked
          if uv run pytest -q tests/test_runtime_store_provisioning_boundary.py; then
            echo "runtime provisioning contract unexpectedly passed before implementation" >&2
            exit 1
          fi

      - name: Apply bounded GREEN repair
        run: uv run python scripts/repair_runtime_store_provisioning.py

      - name: Verify focused and repository contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q tests/test_runtime_store_provisioning_boundary.py
          uv run pytest -q -m "not integration"
          uv run ruff check pg_llm_batch tests
          uv run python -m compileall -q pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-report=term-missing --cov-fail-under=100
          uv lock --check
          uv build --no-sources
          test "$(sha256sum pg_llm_batch/schema.sql | cut -d' ' -f1)" = \
               "$(sha256sum docker/postgres/init/02_schema.sql | cut -d' ' -f1)"
          git diff --check

      - name: Commit verified repair and remove temporary helpers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: fix/runtime-store-provisioning-d0a4b30
        run: |
          set -euo pipefail
          authenticated_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote_head="$(git ls-remote "$authenticated_remote" "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          rm -- \
            .github/workflows/repair-runtime-store-provisioning.yml \
            scripts/repair_runtime_store_provisioning.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pg_llm_batch/config.py \
            pg_llm_batch/schema.sql \
            docker/postgres/init/02_schema.sql \
            .github/workflows/repair-runtime-store-provisioning.yml \
            scripts/repair_runtime_store_provisioning.py
          git commit -m "fix(config): separate runtime stores from provisioning"
          git remote set-url origin "$authenticated_remote"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"
