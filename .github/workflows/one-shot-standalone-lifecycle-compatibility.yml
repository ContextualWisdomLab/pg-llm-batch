name: One-shot standalone lifecycle compatibility

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/one-shot-standalone-lifecycle-compatibility.yml

permissions:
  contents: read

concurrency:
  group: one-shot-standalone-lifecycle-compatibility-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair-verify-publish:
    if: >-
      github.repository == 'ContextualWisdomLab/pg-llm-batch' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/tenant-scoped-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Refuse stale state or competing writers
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PARENT: 746c12dea913c7b2036300aa06a6374bce2ea6c8
          EXPECTED_BASE: f0c5f79c5327a090014dd5558750110fce9fd2ac
          BRANCH_NAME: agent/tenant-scoped-lifecycle
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/$BRANCH_NAME | cut -f1)" = "$EXPECTED_HEAD"
          mapfile -t writers < <(find .github/workflows -maxdepth 1 -type f \
            \( -name '*one-shot*.yml' -o -name '*repair*.yml' \) -print | sort)
          test "${#writers[@]}" -eq 1
          test "${writers[0]}" = ".github/workflows/one-shot-standalone-lifecycle-compatibility.yml"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          prune-cache: true

      - name: Install exact locked dependencies
        run: uv sync --locked

      - name: Prove remaining compatibility regressions are RED
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set +e
          output="$(uv run pytest -q \
            tests/test_standalone_lifecycle_compatibility.py::test_standalone_persistence_keeps_the_pre_tenant_return_shape \
            tests/test_remote_batch_state_contracts.py::test_operator_docs_define_current_state_and_tenant_trust_boundaries \
            2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F '2 failed'
          printf '%s\n' "$output" | grep -F 'assert "tenant_scope" not in snapshot'

      - name: Apply reviewed standalone and documentation fixes
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -I - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              """Apply one exact reviewed replacement and reject source drift."""
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}")
              path.write_text(source.replace(old, new, 1), encoding="utf-8")

          db_path = Path("pg_llm_batch/db.py")
          db_source = db_path.read_text(encoding="utf-8")
          function_start = db_source.index("def persist_remote_batch_state(\n")
          function_end = db_source.index(
              "\n\ndef persist_tenant_remote_batch_state(\n",
              function_start,
          )
          current_function = db_source[function_start:function_end]
          if current_function.count("return _persist_remote_batch_state(") != 1:
              raise SystemExit("db.py: unexpected standalone persistence function")
          new_function = """def persist_remote_batch_state(
              dsn: str,
              endpoint_alias: str,
              provider_batch: Mapping[str, Any],
              observation_order: int,
              *,
              observed_at: Optional[datetime] = None,
          ) -> Dict[str, Any]:
              \"\"\"Persist one standalone projection without changing its return shape.\"\"\"
              snapshot = _persist_remote_batch_state(
                  dsn,
                  DEFAULT_TENANT_SCOPE,
                  endpoint_alias,
                  provider_batch,
                  observation_order,
                  observed_at=observed_at,
              )
              snapshot.pop(\"tenant_scope\", None)
              return snapshot
          """.replace("\n          ", "\n")
          db_path.write_text(
              db_source[:function_start] + new_function + db_source[function_end:],
              encoding="utf-8",
          )

          replace_once(
              Path("tests/test_remote_batch_lifecycle.py"),
              '        "tenant_scope": "standalone",\n',
              "",
          )
          replace_once(
              Path("tests/test_remote_batch_lifecycle.py"),
              '    assert snapshot["tenant_scope"] == "standalone"\n',
              '    assert "tenant_scope" not in snapshot\n',
          )
          replace_once(
              Path("tests/test_tenant_lifecycle_persistence.py"),
              '    assert snapshot["tenant_scope"] == "standalone"\n',
              '    assert "tenant_scope" not in snapshot\n',
          )

          contract_path = Path("tests/test_remote_batch_state_contracts.py")
          contract_source = contract_path.read_text(encoding="utf-8")
          contract_start = contract_source.index(
              "def test_operator_docs_define_current_state_and_tenant_trust_boundaries() -> None:\n"
          )
          contract_end = contract_source.index(
              "\n\n@pytest.mark.parametrize(\n",
              contract_start,
          )
          new_contract = """def test_operator_docs_define_current_state_and_tenant_trust_boundaries() -> None:
              \"\"\"Lifecycle documentation must bound audit and tenant assurances.\"\"\"
              documentation = \" \".join(
                  (
                      Path(__file__).parents[1] / \"docs\" / \"remote-batch-lifecycle.md\"
                  ).read_text(encoding=\"utf-8\").split()
              )

              assert \"current-state projection\" in documentation
              assert \"append-only audit history\" in documentation
              assert \"arbitrary tenant scope\" in documentation
              assert \"not a substitute\" in documentation
              assert \"longer than 128 characters\" in documentation
              assert \"limited to 256 ASCII characters\" in documentation
              assert \"Caller-provided identifiers are validated before\" in documentation
          """.replace("\n          ", "\n")
          contract_path.write_text(
              contract_source[:contract_start]
              + new_contract
              + contract_source[contract_end:],
              encoding="utf-8",
          )
          PY
          git diff --check

      - name: Verify focused compatibility and tenant contracts
        run: |
          uv run pytest -q \
            tests/test_standalone_lifecycle_compatibility.py \
            tests/test_remote_batch_lifecycle.py \
            tests/test_tenant_lifecycle_persistence.py \
            tests/test_tenant_durable_client.py \
            tests/test_remote_batch_state_contracts.py \
            tests/test_tenant_lifecycle_schema.py \
            tests/test_tenant_operator_documentation.py

      - name: Verify complete deterministic and packaging gates
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          uv run python -m compileall -q pg_llm_batch tests
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-branch --cov-report=term-missing \
            --cov-fail-under=100
          uv lock --check
          rm -rf build dist
          uv build --no-sources
          docker compose config >/dev/null
          docker build --tag pg-llm-batch:standalone-compatibility .
          docker build --tag pg-llm-batch-postgres:standalone-compatibility docker/postgres

      - name: Record exact-head evidence and remove automation
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          rm .github/workflows/one-shot-standalone-lifecycle-compatibility.yml
          rm -rf .coverage .coverage.* htmlcov build dist
          mkdir -p docs/superpowers/evidence
          cat > docs/superpowers/evidence/2026-08-05-standalone-lifecycle-compatibility.md <<EOF
          # Standalone Lifecycle Compatibility Evidence

          - RED workflow source head: \`$SOURCE_HEAD\`.
          - The legacy persistence helper no longer exposes the internal
            \`tenant_scope\` field, while its transaction still binds the exact
            \`standalone\` scope for forced row-level security.
          - The explicit tenant-aware helper retains tenant-qualified results.
          - Documentation tests collapse insignificant Markdown whitespace and
            enforce the current-state, arbitrary-SQL, role, and trusted-boundary
            limitations.
          - Focused contracts, the complete non-integration suite, 100%
            production statement/branch/docstring coverage, Ruff, compilation,
            lock freshness, distributions, Compose validation, and both
            container builds passed.
          - This temporary write-capable workflow removed itself from the final tree.
          EOF
          test ! -e .github/workflows/one-shot-standalone-lifecycle-compatibility.yml
          git diff --check

      - name: Publish only from the unchanged exact remote head
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          BRANCH_NAME: agent/tenant-scoped-lifecycle
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/$BRANCH_NAME | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No repair generated" >&2; exit 1; }
          git commit -m "fix(tenant): preserve standalone lifecycle contracts"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:${BRANCH_NAME}"
