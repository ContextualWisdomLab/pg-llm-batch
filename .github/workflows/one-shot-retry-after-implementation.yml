name: One-shot Retry-After implementation

on:
  push:
    branches: [agent/harden-retry-after-parsing]
    paths:
      - .github/workflows/one-shot-retry-after-implementation.yml

permissions:
  contents: write

concurrency:
  group: one-shot-retry-after-implementation
  cancel-in-progress: true

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/harden-retry-after-parsing
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true
      - name: Apply minimal parser and documentation changes
        run: |
          python - <<'PY'
          from pathlib import Path


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)


          client_path = Path("pg_llm_batch/batch_api_client.py")
          client = client_path.read_text(encoding="utf-8")
          client = replace_once(
              client,
              '''    if candidate.isdecimal():
                  return float(int(candidate))
          ''',
              '''    if candidate.isascii() and candidate.isdigit():
                  return float(candidate)
          ''',
              "Retry-After delta parser",
          )
          client_path.write_text(client, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = replace_once(
              readme,
              '''transport failures. A bounded RFC `Retry-After` delta or HTTP-date is honored;
          otherwise the client uses equal-jitter exponential delay from 0.5 seconds up to
          30 seconds. Guidance above the configured maximum is refused rather than
          shortening an untrusted wait. Upload, batch creation, and cancellation `POST`
          ''',
              '''transport failures. A bounded RFC `Retry-After` delta or HTTP-date is honored.
          Delta-seconds accept RFC ASCII digits only. Syntactically valid values above the
          configured maximum are refused; malformed values use equal-jitter exponential
          fallback from 0.5 seconds up to 30 seconds. Upload, batch creation, and cancellation `POST`
          ''',
              "README Retry-After contract",
          )
          readme_path.write_text(readme, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          changelog = replace_once(
              changelog,
              '''### Changed

          - Consolidated immutable CI action, Python image, Rust toolchain image, and Ruff patch updates; setup-uv cache pruning is explicit to preserve the previous bounded cache-cost policy.
          ''',
              '''### Fixed

          - Hardened provider `Retry-After` delta parsing to accept RFC ASCII digits only
            and refuse extremely long numeric guidance without leaking Python integer
            conversion errors.

          ### Changed

          - Consolidated immutable CI action, Python image, Rust toolchain image, and Ruff patch updates; setup-uv cache pruning is explicit to preserve the previous bounded cache-cost policy.
          ''',
              "CHANGELOG Fixed section",
          )
          changelog_path.write_text(changelog, encoding="utf-8")
          PY
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify focused parser contract
        run: uv run pytest -q tests/test_idempotent_get_retries.py
      - name: Verify complete quality and package gates
        run: |
          set -euo pipefail
          uv run pytest -q -m "not integration"
          uv run python -m compileall -q pg_llm_batch
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-report=term-missing --cov-fail-under=100
          uv lock --check
          uv build --no-sources
          git diff --check
      - name: Verify container definitions
        run: |
          set -euo pipefail
          docker compose config >/dev/null
          docker build --tag pg-llm-batch:retry-after .
          docker build --tag pg-llm-batch-postgres:retry-after docker/postgres
      - name: Publish verified implementation and remove one-shot workflow
        env:
          BRANCH_NAME: agent/harden-retry-after-parsing
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-retry-after-implementation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pg_llm_batch/batch_api_client.py \
            tests/test_idempotent_get_retries.py \
            README.md \
            CHANGELOG.md \
            .github/workflows/one-shot-retry-after-implementation.yml
          git commit -m "fix(gateway): harden Retry-After delta parsing"
          git push origin "HEAD:${BRANCH_NAME}"
