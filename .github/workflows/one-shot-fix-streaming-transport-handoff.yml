name: One-shot fix streaming transport handoff

on:
  push:
    branches:
      - agent/bounded-jsonl-result-streaming
    paths:
      - .github/workflows/one-shot-fix-streaming-transport-handoff.yml

permissions:
  contents: read

concurrency:
  group: one-shot-streaming-transport-handoff
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/pg-llm-batch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact trigger head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Refuse stale or competing branch state
        env:
          EXPECTED_PARENT: 7839485d5006537eadd8464278599ef97037f7b5
          EXPECTED_BRANCH: agent/bounded-jsonl-result-streaming
          WORKFLOW_PATH: .github/workflows/one-shot-fix-streaming-transport-handoff.yml
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "${WORKFLOW_PATH}"
          test -z "$(git status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          prune-cache: true

      - name: Install exact locked dependencies
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: uv sync --locked

      - name: Prove the exact RED contract
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          set +e
          uv run pytest -q tests/test_streaming_transport_handoff.py > /tmp/red-evidence.txt 2>&1
          red_status=$?
          set -e
          cat /tmp/red-evidence.txt
          test "${red_status}" -eq 1
          grep -Eq '1 failed|failed,.*passed' /tmp/red-evidence.txt
          grep -Fq 'test_post_handoff_payload_failure_is_not_retried' /tmp/red-evidence.txt

      - name: Apply bounded direct repair and permanent evidence
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          WORKFLOW_PATH: .github/workflows/one-shot-fix-streaming-transport-handoff.yml
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("pg_llm_batch/batch_api_client.py")
          source = source_path.read_text(encoding="utf-8")
          start_marker = "    @asynccontextmanager\n    async def _request("
          end_marker = "\n    async def _read_json_object("
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = '''    @asynccontextmanager
              async def _request(
                  self,
                  method: str,
                  url: str,
                  *,
                  operation: str,
                  **kwargs: Any,
              ) -> AsyncIterator[Any]:
                  """Yield one response and retry only failures before body handoff."""
                  session = self._get_session()
                  normalized_method = method.lower()
                  request = getattr(session, normalized_method)
                  retry_safe = normalized_method == "get"
                  attempt = 1
                  while True:
                      delay: Optional[float] = None
                      retry_reason = ""
                      response_handed_off = False
                      body_transport_error: Optional[BaseException] = None
                      try:
                          async with request(
                              url,
                              timeout=self._request_timeout,
                              allow_redirects=False,
                              **kwargs,
                          ) as response:
                              retry_response = (
                                  retry_safe
                                  and attempt < self.max_retry_attempts
                                  and response.status in RETRYABLE_GET_STATUSES
                              )
                              if retry_response:
                                  delay = self._retry_delay_for_response(response, attempt)
                                  if delay is not None:
                                      retry_reason = f"HTTP {response.status}"
                              if delay is None:
                                  response_handed_off = True
                                  try:
                                      yield response
                                  except (
                                      aiohttp.ClientError,
                                      asyncio.TimeoutError,
                                  ) as exc:
                                      body_transport_error = exc
                                  if body_transport_error is None:
                                      return
                      except GatewayError:
                          raise
                      except (aiohttp.ClientError, asyncio.TimeoutError) as exc:
                          if response_handed_off:
                              body_transport_error = exc
                          elif not retry_safe or attempt >= self.max_retry_attempts:
                              raise GatewayError(
                                  f"{operation} transport failed",
                                  response_data={
                                      "error_type": type(exc).__name__,
                                      "timeout_seconds": self.request_timeout_seconds,
                                  },
                              ) from exc
                          else:
                              delay = self._fallback_retry_delay(attempt)
                              retry_reason = type(exc).__name__

                      if body_transport_error is not None:
                          raise GatewayError(
                              f"{operation} transport failed",
                              response_data={
                                  "error_type": type(body_transport_error).__name__,
                                  "timeout_seconds": self.request_timeout_seconds,
                              },
                          ) from body_transport_error

                      logger.warning(
                          "%s retrying idempotent GET after %s "
                          "(attempt %s/%s, delay %.3fs)",
                          operation,
                          retry_reason,
                          attempt,
                          self.max_retry_attempts,
                          delay,
                      )
                      await asyncio.sleep(delay)
                      attempt += 1
          '''
          replacement = "\n".join(
              line[12:] if line.startswith("            ") else line
              for line in replacement.splitlines()
          ) + "\n"
          source_path.write_text(source[:start] + replacement + source[end:], encoding="utf-8")

          test_path = Path("tests/test_streaming_transport_handoff.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              "from pg_llm_batch.batch_api_client import BatchAPIClient, GatewayCredentials\n",
              "from pg_llm_batch import BatchResultRecord, StreamingBatchAPIClient\n"
              "from pg_llm_batch.batch_api_client import BatchAPIClient, GatewayCredentials\n",
          )
          addition = '''

          class _FailingChunkStream:
              """Yield one record and then fail the active response body."""

              def __init__(self) -> None:
                  self.requested_sizes: list[int] = []

              async def iter_chunked(self, size: int):
                  """Yield one valid line before a deterministic payload failure."""
                  self.requested_sizes.append(size)
                  yield b'{"id":1}\\n'
                  raise aiohttp.ClientPayloadError("mid-stream payload failure")


          class _FailingStreamingResponse(_ResponseContext):
              """Response whose bounded content fails after one valid record."""

              content_length = None

              def __init__(self) -> None:
                  super().__init__()
                  self.content = _FailingChunkStream()


          async def test_streaming_payload_failure_never_restarts_or_duplicates(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              """A mid-file payload failure closes once without restarting byte zero."""
              response = _FailingStreamingResponse()
              session = _QueuedSession([response, _FailingStreamingResponse()])
              client = StreamingBatchAPIClient(
                  "postgresql://unit",
                  _credentials,
                  max_retry_attempts=3,
                  retry_base_delay_seconds=0,
                  retry_max_delay_seconds=0,
              )
              client._session = session
              sleeps: list[float] = []

              async def _record_sleep(delay: float) -> None:
                  sleeps.append(delay)

              async def _terminal_status(
                  _batch_id: str,
                  _endpoint_alias: str,
              ) -> dict[str, Any]:
                  return {
                      "id": "batch-1",
                      "status": "completed",
                      "is_complete": True,
                      "output_file_id": "out-1",
                      "error_file_id": None,
                  }

              monkeypatch.setattr(batch_api_client_module.asyncio, "sleep", _record_sleep)
              monkeypatch.setattr(client, "get_batch_status", _terminal_status)

              async with client.open_batch_records("batch-1", "default") as records:
                  assert await anext(records) == BatchResultRecord(
                      "batch-1", "result", {"id": 1}
                  )
                  with pytest.raises(GatewayError, match="transport failed") as exc_info:
                      await anext(records)

              assert exc_info.value.response_data == {
                  "error_type": "ClientPayloadError",
                  "timeout_seconds": client.request_timeout_seconds,
              }
              assert len(session.calls) == 1
              assert sleeps == []
              assert response.enter_count == 1
              assert response.exit_count == 1
          '''
          addition = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in addition.splitlines()
          ) + "\n"
          marker = "test_streaming_payload_failure_never_restarts_or_duplicates"
          if marker not in tests:
              tests += addition
          test_path.write_text(tests, encoding="utf-8")

          replacements = {
              Path("AGENTS.md"): (
                  "- Preserve inherited credentials, HTTPS validation, disabled redirects, bounded\n  idempotent GET retries, request timeouts, identifier validation, and total\n  decoded-byte limits.\n",
                  "- Preserve inherited credentials, HTTPS validation, disabled redirects, bounded\n  idempotent GET retries, request timeouts, identifier validation, and total\n  decoded-byte limits. End retry eligibility before response-body handoff; a\n  post-handoff transport failure must close once and never restart a file.\n",
              ),
              Path("CLAUDE.md"): (
                  "- Inherit and preserve credential lookup, HTTPS URL validation, disabled\n  redirects, bounded idempotent GET retry, timeouts, provider identifier\n  validation, and decoded-byte limits.\n",
                  "- Inherit and preserve credential lookup, HTTPS URL validation, disabled\n  redirects, bounded idempotent GET retry, timeouts, provider identifier\n  validation, and decoded-byte limits. Retry only before response handoff; never\n  reopen a provider file after body iteration has begun.\n",
              ),
              Path("ARCHITECTURE.md"): (
                  "A bare `async for` break\ndoes not call `aclose()` and is not a deterministic HTTP-response release\nmechanism.\n",
                  "A bare `async for` break\ndoes not call `aclose()` and is not a deterministic HTTP-response release\nmechanism. Request acquisition and retryable HTTP-status handling finish before\nresponse handoff. Once body iteration begins, transport failures close that\nresponse and fail once; they never reopen the file or replay yielded records.\n",
              ),
              Path("docs/adr/0005-bounded-jsonl-result-streaming.md"): (
                  "12. explicitly close each nested provider-file iterator and provide\n    `open_batch_records()` as the supported context-managed owner for consumers\n    that may stop before exhaustion.\n",
                  "12. explicitly close each nested provider-file iterator and provide\n    `open_batch_records()` as the supported context-managed owner for consumers\n    that may stop before exhaustion; and\n13. retry only request acquisition and retryable response statuses before body\n    handoff, then fail once without reopening a file after streaming begins.\n",
              ),
              Path("docs/doctoring/bounded-jsonl-result-streaming.md"): (
                  "- Redirects remain disabled and provider-file GET is the only retried transport\n  operation in this path.\n",
                  "- Redirects remain disabled and provider-file GET is the only retried transport\n  operation in this path. Retry eligibility ends before response-body handoff.\n  A post-handoff payload or close failure is translated only after the active\n  response closes and never reopens the file or replays yielded records.\n",
              ),
              Path("CHANGELOG.md"): (
                  "### Fixed\n\n",
                  "### Fixed\n\n- Stopped idempotent GET retries at response-body handoff so mid-stream payload\n  failures close once and cannot reopen provider files, duplicate already-yielded\n  records, or surface asynchronous-context-manager protocol errors.\n",
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected documentation marker missing: {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow = Path(".github/workflows/one-shot-fix-streaming-transport-handoff.yml")
          workflow.unlink()
          PY

      - name: Verify focused and repository-wide GREEN state
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          uv run pytest -q tests/test_streaming_transport_handoff.py
          uv run pytest -q -m "not integration"
          uv run python -m compileall -q pg_llm_batch tests
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-branch --cov-report=term-missing \
            --cov-fail-under=100
          uv lock --check
          uv build --no-sources

      - name: Validate final bounded diff
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          WORKFLOW_PATH: .github/workflows/one-shot-fix-streaming-transport-handoff.yml
        run: |
          set -euo pipefail
          test ! -e "${WORKFLOW_PATH}"
          mapfile -t changed < <(git diff --name-only HEAD | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            AGENTS.md
            ARCHITECTURE.md
            CHANGELOG.md
            CLAUDE.md
            docs/adr/0005-bounded-jsonl-result-streaming.md
            docs/doctoring/bounded-jsonl-result-streaming.md
            pg_llm_batch/batch_api_client.py
            tests/test_streaming_transport_handoff.py
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")
          test -z "$(git status --porcelain --untracked-files=no | grep -E '(^|/)(\.coverage|coverage\.db|dist|build|__pycache__)' || true)"

      - name: Commit verified workflow-free repair
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          git config user.name "CWL bounded repair"
          git config user.email "actions@users.noreply.github.com"
          git add --all
          git commit -m "fix(streaming): stop retries after response handoff"
          test ! -e .github/workflows/one-shot-fix-streaming-transport-handoff.yml

      - name: Publish only if the exact trigger head is still live
        env:
          PUSH_TOKEN: ${{ github.token }}
          EXPECTED_BRANCH: agent/bounded-jsonl-result-streaming
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${EXPECTED_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"
          askpass="${RUNNER_TEMP}/git-askpass.sh"
          cat > "${askpass}" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "${PUSH_TOKEN}" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "${askpass}"
          GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
            git push origin "HEAD:refs/heads/${EXPECTED_BRANCH}"
