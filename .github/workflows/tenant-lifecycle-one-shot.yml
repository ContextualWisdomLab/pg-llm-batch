name: One-shot tenant lifecycle implementation

on:
  push:
    branches: [agent/tenant-scoped-lifecycle]
    paths:
      - .github/workflows/tenant-lifecycle-one-shot.yml
      - scripts/ci/tenant_lifecycle_impl_00.b64
      - scripts/ci/tenant_lifecycle_impl_01.b64

concurrency:
  group: one-shot-tenant-lifecycle-implementation
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  implement-test-publish:
    if: >-
      github.repository == 'ContextualWisdomLab/pg-llm-batch' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/agent/tenant-scoped-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Install exact locked dependencies
        run: uv sync --locked

      - name: Refuse competing branch writers
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          writers="$(
            grep -lER 'contents:[[:space:]]*write' .github/workflows \
              | grep -E '(one-shot|repair|implement|publish)' \
              | sort || true
          )"
          test "$writers" = ".github/workflows/tenant-lifecycle-one-shot.yml"

      - name: Prove exact tenant contracts are RED
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          set +e
          red_output="$(
            uv run pytest -q \
              tests/test_tenant_scope_validation.py \
              tests/test_tenant_lifecycle_schema.py \
              tests/test_tenant_lifecycle_persistence.py \
              tests/test_tenant_durable_client.py \
              2>&1
          )"
          red_status=$?
          set -e
          printf '%s\n' "$red_output"
          test "$red_status" -ne 0
          printf '%s\n' "$red_output" \
            | grep -Eq 'cannot import name|ImportError|ModuleNotFoundError'

      - name: Reconstruct and compile the reviewed implementation
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cat \
            scripts/ci/tenant_lifecycle_impl_00.b64 \
            scripts/ci/tenant_lifecycle_impl_01.b64 \
            | base64 --decode \
            | gzip --decompress \
            > "${RUNNER_TEMP}/implement_tenant_lifecycle.py"
          python3 -m py_compile "${RUNNER_TEMP}/implement_tenant_lifecycle.py"

      - name: Implement tenant-scoped lifecycle isolation
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -I "${RUNNER_TEMP}/implement_tenant_lifecycle.py"
          git diff --check

      - name: Verify focused tenant contracts
        run: |
          uv run pytest -q \
            tests/test_tenant_scope_validation.py \
            tests/test_tenant_lifecycle_schema.py \
            tests/test_tenant_lifecycle_persistence.py \
            tests/test_tenant_durable_client.py \
            tests/test_remote_batch_lifecycle.py \
            tests/test_schema_integrity.py

      - name: Verify complete quality and packaging gates
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          uv run pytest -q -m "not integration"
          uv run python -m compileall -q pg_llm_batch tests
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-report=term-missing --cov-fail-under=100
          uv lock --check
          rm -rf dist
          uv build --no-sources
          docker compose config >/dev/null
          docker build --tag pg-llm-batch:tenant-scope .
          docker build --tag pg-llm-batch-postgres:tenant-scope docker/postgres
          git diff --check

      - name: Publish verified implementation and remove temporary artifacts
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          PUSH_TOKEN: ${{ github.token }}
          BRANCH_NAME: agent/tenant-scoped-lifecycle
        run: |
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          rm \
            .github/workflows/tenant-lifecycle-one-shot.yml \
            scripts/ci/tenant_lifecycle_impl_00.b64 \
            scripts/ci/tenant_lifecycle_impl_01.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "feat(tenant): isolate durable lifecycle state"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:${BRANCH_NAME}"
