name: Hourly Commercial Maintenance

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: hourly-commercial-maintenance-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review-fix:
    name: Repair actionable pull-request feedback
    uses: ContextualWisdomLab/.github/.github/workflows/pr-review-fix-scheduler.yml@355d9e545fd971638066e90654fdfaa105431968 # prerequisite .github#782
    with:
      target_repository: ContextualWisdomLab/pg-llm-batch
      base_branch: main
      max_prs: "100"
      max_dispatches: "1"
      retry_hours: "1"
      canonical_ref: 355d9e545fd971638066e90654fdfaa105431968
    secrets:
      PR_REVIEW_MERGE_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
      OPENCODE_APPROVE_TOKEN: ${{ secrets.OPENCODE_APPROVE_TOKEN }}

  review-merge:
    name: Revalidate and merge eligible pull requests
    needs: [review-fix]
    if: ${{ always() }}
    permissions:
      actions: write
      checks: read
      contents: write
      id-token: write
      pull-requests: write
    uses: ContextualWisdomLab/.github/.github/workflows/pr-review-merge-scheduler.yml@5983b41ace75040c1d81818171ca7d0f3653254e # main
    with:
      base_branch: main
      max_prs: "100"
      trigger_reviews: true
      review_dispatch_limit: "1"
      branch_update_limit: "1"
      enable_auto_merge: true
      merge_mode: direct_or_auto
      update_branches: true
      stale_opencode_minutes: "90"
      project_flow: github-flow
    secrets: inherit
