name: One-shot atomic RLS migration repair

on:
  push:
    branches: [agent/tenant-scoped-lifecycle]
    paths:
      - .github/workflows/one-shot-atomic-rls-migration.yml

concurrency:
  group: one-shot-atomic-rls-migration
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/pg-llm-batch' &&
      github.ref == 'refs/heads/agent/tenant-scoped-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Refuse stale state or competing writers
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_PARENT: e4d44690cba4659f8e7af8b1eaebde4eba4e56eb
          EXPECTED_BASE: f0c5f79c5327a090014dd5558750110fce9fd2ac
          BRANCH_NAME: agent/tenant-scoped-lifecycle
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/$BRANCH_NAME | cut -f1)" = "$GITHUB_SHA"
          mapfile -t writers < <(find .github/workflows -maxdepth 1 -type f \
            \( -name '*one-shot*.yml' -o -name '*repair*.yml' \) -print | sort)
          test "${#writers[@]}" -eq 1
          test "${writers[0]}" = ".github/workflows/one-shot-atomic-rls-migration.yml"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Repair atomic tenant migration
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -I - <<'PY'
          from pathlib import Path

          start_marker = (
              "-- Reapplying the schema may occur after FORCE RLS was installed."
          )
          end_marker = (
              "DROP INDEX IF EXISTS idx_llm_remote_batch_jobs_status_observed;"
          )
          replacement = """-- Reapplying the schema may occur after FORCE RLS was installed. The
          -- owner transition, backfill, constraints, policy replacement, and FORCE RLS
          -- restoration execute as one SQL statement, so psql autocommit cannot expose
          -- an owner-bypass or cross-tenant visibility window between statements.
          DO $$
          BEGIN
              ALTER TABLE llm_remote_batch_jobs NO FORCE ROW LEVEL SECURITY;
              ALTER TABLE llm_remote_batch_jobs
                  ADD COLUMN IF NOT EXISTS tenant_scope TEXT;
              UPDATE llm_remote_batch_jobs
              SET tenant_scope = 'standalone'
              WHERE tenant_scope IS NULL;
              ALTER TABLE llm_remote_batch_jobs
                  ALTER COLUMN tenant_scope SET DEFAULT 'standalone';
              ALTER TABLE llm_remote_batch_jobs
                  ALTER COLUMN tenant_scope SET NOT NULL;

              IF EXISTS (
                  SELECT 1
                  FROM pg_constraint
                  WHERE conname = 'uq_llm_remote_batch_jobs_endpoint_id'
                    AND conrelid = 'llm_remote_batch_jobs'::regclass
              ) THEN
                  ALTER TABLE llm_remote_batch_jobs
                      DROP CONSTRAINT uq_llm_remote_batch_jobs_endpoint_id;
              END IF;

              IF NOT EXISTS (
                  SELECT 1
                  FROM pg_constraint
                  WHERE conname = 'ck_llm_remote_batch_jobs_tenant_scope'
                    AND conrelid = 'llm_remote_batch_jobs'::regclass
              ) THEN
                  ALTER TABLE llm_remote_batch_jobs
                      ADD CONSTRAINT ck_llm_remote_batch_jobs_tenant_scope
                      CHECK (
                          tenant_scope ~ '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
                      ) NOT VALID;
              END IF;
              ALTER TABLE llm_remote_batch_jobs
                  VALIDATE CONSTRAINT ck_llm_remote_batch_jobs_tenant_scope;

              IF NOT EXISTS (
                  SELECT 1
                  FROM pg_constraint
                  WHERE conname = 'uq_llm_remote_batch_jobs_tenant_endpoint_id'
                    AND conrelid = 'llm_remote_batch_jobs'::regclass
              ) THEN
                  ALTER TABLE llm_remote_batch_jobs
                      ADD CONSTRAINT uq_llm_remote_batch_jobs_tenant_endpoint_id
                      UNIQUE (tenant_scope, endpoint_alias, remote_batch_id);
              END IF;

              DROP POLICY IF EXISTS plc_llm_remote_batch_jobs_tenant_scope
                  ON llm_remote_batch_jobs;
              CREATE POLICY plc_llm_remote_batch_jobs_tenant_scope
                  ON llm_remote_batch_jobs
                  TO PUBLIC
                  USING (
                      tenant_scope = current_setting(
                          'pg_llm_batch.tenant_scope',
                          true
                      )
                  )
                  WITH CHECK (
                      tenant_scope = current_setting(
                          'pg_llm_batch.tenant_scope',
                          true
                      )
                  );
              ALTER TABLE llm_remote_batch_jobs ENABLE ROW LEVEL SECURITY;
              ALTER TABLE llm_remote_batch_jobs FORCE ROW LEVEL SECURITY;
          END $$;

          """.replace("\n          ", "\n")

          canonical_path = Path("pg_llm_batch/schema.sql")
          canonical = canonical_path.read_text(encoding="utf-8")
          start = canonical.index(start_marker)
          end = canonical.index(end_marker, start)
          canonical = canonical[:start] + replacement + canonical[end:]
          canonical_path.write_text(canonical, encoding="utf-8")
          Path("docker/postgres/init/02_schema.sql").write_text(
              canonical,
              encoding="utf-8",
          )
          PY
          git diff --check

      - name: Verify focused and complete deterministic gates
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          uv run pytest -q \
            tests/test_tenant_lifecycle_schema.py \
            tests/test_schema_integrity.py \
            tests/test_tenant_lifecycle_persistence.py
          uv run python -m compileall -q pg_llm_batch tests
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-branch --cov-report=term-missing \
            --cov-fail-under=100
          uv lock --check
          rm -rf build dist
          uv build --no-sources

      - name: Remove temporary workflow and generated artifacts
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          rm .github/workflows/one-shot-atomic-rls-migration.yml
          rm -rf .coverage .coverage.* htmlcov build dist
          test ! -e .github/workflows/one-shot-atomic-rls-migration.yml
          test -z "$(git ls-files --others --exclude-standard | grep -E '(^|/)(\.coverage|htmlcov|build|dist)(/|$)' || true)"
          git diff --check

      - name: Push only if exact remote head is unchanged
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          PUSH_TOKEN: ${{ github.token }}
          BRANCH_NAME: agent/tenant-scoped-lifecycle
        run: |
          test "$(git ls-remote origin refs/heads/$BRANCH_NAME | cut -f1)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/one-shot-atomic-rls-migration.yml$' || true)"
          git commit -m "fix(schema): make tenant RLS migration atomic"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:$BRANCH_NAME"
