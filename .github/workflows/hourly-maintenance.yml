name: Hourly Commercial Maintenance

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: hourly-commercial-maintenance-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review-fix:
    name: Repair actionable pull-request feedback
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
      statuses: read
    uses: ContextualWisdomLab/.github/.github/workflows/pr-review-fix-scheduler.yml@main
    with:
      target_repository: ContextualWisdomLab/pg-llm-batch
      base_branch: main
      max_prs: "100"
      max_dispatches: "1"
      retry_hours: "1"
      canonical_ref: main
    secrets: inherit

  review-merge:
    name: Revalidate and merge eligible pull requests
    needs: [review-fix]
    if: ${{ always() }}
    permissions:
      actions: write
      checks: read
      contents: write
      id-token: write
      pull-requests: write
    uses: ContextualWisdomLab/.github/.github/workflows/pr-review-merge-scheduler.yml@main
    with:
      base_branch: main
      max_prs: "100"
      trigger_reviews: true
      review_dispatch_limit: "1"
      branch_update_limit: "1"
      enable_auto_merge: true
      merge_mode: direct_or_auto
      update_branches: true
      stale_opencode_minutes: "90"
      project_flow: github-flow
    secrets: inherit
