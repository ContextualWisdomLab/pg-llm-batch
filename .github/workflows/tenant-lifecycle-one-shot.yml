              "transaction-local PostgreSQL context, idempotent legacy backfill, "
              "and forced default-deny row-level security for shared-table MSA "
              "deployments.\n"
          )
          added_anchor = "### Added\n\n"
          if changelog_entry not in changelog:
              changelog = changelog.replace(
                  added_anchor,
                  added_anchor + changelog_entry,
                  1,
              )
          changelog_path.write_text(changelog, encoding="utf-8")

          design_path = Path(
              "docs/superpowers/specs/2026-08-05-tenant-scoped-lifecycle-design.md"
          )
          design = design_path.read_text(encoding="utf-8")
          design = design.replace(
              "Both return the normalized snapshot including `tenant_scope`. The upsert conflict\n"
              "key and every update reference use the tenant-qualified identity.\n",
              "The tenant-aware helper returns the normalized snapshot including "
              "`tenant_scope`. The legacy helper deliberately preserves its original "
              "return shape while writing under `standalone`, avoiding a behavioral "
              "compatibility break. The upsert conflict key and every update reference "
              "use the tenant-qualified identity.\n",
          )
          design_path.write_text(design, encoding="utf-8")

          plan = r'''# Tenant-Scoped Lifecycle Isolation Implementation Plan

          1. Add deterministic tests for strict tenant validation, compatibility,
             tenant-qualified persistence and reads, client recorder propagation,
             schema migration, RLS, and live PostgreSQL separation.
          2. Prove the new public contract fails before production APIs exist.
          3. Add a trusted tenant validator and tenant-aware persistence/read helpers.
          4. Preserve the legacy recorder signature and return shape under `standalone`.
          5. Add the tenant durable client and explicit recorder seam.
          6. Migrate lifecycle identity and indexes; enable and force default-deny RLS.
          7. Synchronize the deployable schema mirror and operator/architecture records.
          8. Run unit, coverage, docstring, lint, lock, package, and container gates.
          '''.replace("\n          ", "\n").lstrip()
          Path(
              "docs/superpowers/plans/2026-08-05-tenant-scoped-lifecycle.md"
          ).write_text(plan, encoding="utf-8")

          doctoring = r'''# Tenant-Scoped Durable Lifecycle Isolation

          ## Decision

          Shared-table deployments use a trusted local `tenant_scope` as part of the
          lifecycle identity and enforce it with PostgreSQL row-level security.
          `TenantDurableBatchAPIClient` requires the scope at construction. Existing
          `DurableBatchAPIClient` consumers remain source- and behavior-compatible in
          the explicit `standalone` scope.

          ## Security contract

          - Accepted scope syntax is `[A-Za-z0-9][A-Za-z0-9._:-]{0,127}` with no
            trimming or coercion.
          - The host derives scope after authentication and authorization; provider
            metadata and request transport are not tenant authorities.
          - Reads and writes bind `set_config('pg_llm_batch.tenant_scope', value, true)`
            inside the same transaction before lifecycle table access.
          - RLS is enabled and forced, with matching `USING` and `WITH CHECK` clauses.
          - Missing context is default-deny. Superusers and `BYPASSRLS` roles bypass
            PostgreSQL RLS and therefore cannot be application identities.
          - The unique identity and status index begin with tenant scope.

          ## Migration and rollback

          Existing rows are backfilled to `standalone`; no rows are deleted or merged.
          The migration replaces the old unique constraint and status index under an
          exclusive table lock, then restores forced RLS before commit. A rollback to
          the old two-column identity is unsafe until an operator proves no duplicate
          `(endpoint_alias, remote_batch_id)` pair exists across tenant scopes.

          ## Verification

          Deterministic unit tests cover validation boundaries, SQL parameterization,
          compatibility, client dispatch, schema policy text, default-deny reads, and
          exact schema mirroring. A live PostgreSQL integration test creates a
          `NOSUPERUSER NOBYPASSRLS` role, persists the same provider ID for two tenants,
          and verifies tenant A cannot query tenant B.

          ## References

          Joint Task Force. (2020). *Security and privacy controls for information
          systems and organizations* (NIST Special Publication 800-53, Revision 5).
          National Institute of Standards and Technology.
          https://doi.org/10.6028/NIST.SP.800-53r5

          OWASP Foundation. (n.d.). *Multi-tenant security cheat sheet*. OWASP Cheat
          Sheet Series. Retrieved August 5, 2026, from
          https://cheatsheetseries.owasp.org/cheatsheets/Multi_Tenant_Security_Cheat_Sheet.html

          PostgreSQL Global Development Group. (2026). *Row security policies*. In
          *PostgreSQL 18 documentation*.
          https://www.postgresql.org/docs/18/ddl-rowsecurity.html

          PostgreSQL Global Development Group. (2026). *System administration
          functions*. In *PostgreSQL 18 documentation*.
          https://www.postgresql.org/docs/18/functions-admin.html
          '''.replace("\n          ", "\n").lstrip()
          Path("docs/doctoring/tenant-scoped-lifecycle.md").write_text(
              doctoring,
              encoding="utf-8",
          )
          PY

      - name: Verify GREEN quality and package gates
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m compileall -q pg_llm_batch
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-report=term-missing --cov-fail-under=100 \
            | tee /tmp/tenant-green.log
          uv lock --check
          uv build --no-sources

      - name: Remove one-shot workflow and record evidence
        shell: bash
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rm .github/workflows/tenant-lifecycle-one-shot.yml
          rm -rf .coverage .coverage.* htmlcov build dist
          cat > docs/superpowers/evidence/2026-08-05-tenant-scoped-lifecycle-red-green.md <<EOF
          # Tenant-Scoped Lifecycle RED/GREEN Evidence

          - Source head: \`$SOURCE_HEAD\`
          - RED: \`uv run pytest -q tests/test_tenant_scoped_lifecycle.py\`
            failed during collection because the tenant public APIs did not exist.
          - GREEN: compile, Ruff, 100% interrogate, the complete non-integration test
            suite with 100% production statement and branch coverage, lockfile
            freshness, and source/wheel build all succeeded in the credential-free
            verification phase.
          - The temporary one-shot workflow removed itself before the final commit.
          - Live PostgreSQL RLS verification remains available through
            \`tests/test_tenant_lifecycle_integration.py\` when
            \`PG_LLM_BATCH_TEST_DSN\` is provided.
          EOF
          test ! -e .github/workflows/tenant-lifecycle-one-shot.yml
          test -z "$(git ls-files --others --exclude-standard | grep -E '(^|/)(\.coverage|htmlcov|build|dist)(/|$)' || true)"

      - name: Commit only after exact-head stale check
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$HEAD_BRANCH:refs/remotes/origin/$HEAD_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$HEAD_BRANCH")" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/tenant-lifecycle-one-shot.yml$' || true)"
          git commit -m "feat(lifecycle): isolate durable state by tenant"
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
