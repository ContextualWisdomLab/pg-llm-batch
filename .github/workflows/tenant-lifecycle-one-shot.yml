          architecture = r'''# Architecture

          ## Deployment boundary

          `pg-llm-batch` remains independently deployable and embeddable. PostgreSQL
          owns token counting, JSONL payloads, configuration, encrypted secrets, and
          durable remote batch lifecycle state. HTTP provider behavior is isolated
          behind `BatchAPIClient`; host services can inject credential and persistence
          seams without changing provider semantics.

          ## Durable lifecycle tenancy

          `DurableBatchAPIClient` is the backward-compatible standalone facade and
          stores rows under `standalone`. `TenantDurableBatchAPIClient` requires a
          trusted host-selected `tenant_scope`. The database identity is:

          `(tenant_scope, endpoint_alias, remote_batch_id)`

          Row-level security compares each row with the transaction-local
          `pg_llm_batch.tenant_scope` setting. The policy is default-deny when context
          is missing, and `FORCE ROW LEVEL SECURITY` covers ordinary table-owner
          access. PostgreSQL superusers and `BYPASSRLS` roles are administrative
          escape hatches and must not be used by application services.

          ## Migration and rollback

          Legacy rows are backfilled to `standalone` without deletion or identity
          merging. The old unique constraint and status index are replaced by
          tenant-qualified objects. Schema application takes an exclusive migration
          lock and restores forced RLS before commit. Rollback requires first proving
          that no two tenant scopes share the same endpoint/provider identifier pair;
          otherwise a two-column key cannot be restored safely.

          ## Interoperability

          CWL hosts, including `contextual-orchestrator` and `naruon`, supply tenant
          context only after their own authentication and authorization boundary.
          Tenant scope is local control-plane identity, not provider-returned data.
          No UI, model call, or psychometric computation is introduced by this layer.
          '''.replace("\n          ", "\n").lstrip()
