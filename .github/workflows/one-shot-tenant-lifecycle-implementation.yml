class TenantDurableBatchAPIClient(DurableBatchAPIClient):
    """Durable Batch API client with a required trusted local tenant scope.

    The embedding host must select ``tenant_scope`` only after caller
    authentication and authorization. Provider metadata is never used as an
    authorization source. The exact scope is propagated to a tenant-aware
    lifecycle recorder while inherited provider behavior remains unchanged.
    """

    def __init__(
        self,
        postgres_dsn: str,
        credentials: CredentialsProvider,
        *,
        tenant_scope: str,
        tenant_lifecycle_recorder: TenantLifecycleRecorder = (
            persist_tenant_remote_batch_state
        ),
        observation_reserver: ObservationReserver = (
            reserve_remote_batch_observation_order
        ),
        **client_options: Any,
    ) -> None:
        """Validate tenant identity before initializing any external-effect seams."""
        normalized_tenant_scope = validate_tenant_scope(tenant_scope)
        super().__init__(
            postgres_dsn,
            credentials,
            lifecycle_recorder=persist_remote_batch_state,
            observation_reserver=observation_reserver,
            **client_options,
        )
        self._tenant_scope = normalized_tenant_scope
        self._tenant_lifecycle_recorder = tenant_lifecycle_recorder

    @property
    def tenant_scope(self) -> str:
        """Return the exact trusted tenant scope bound to this client instance."""
        return self._tenant_scope

    def _lifecycle_recovery_context(self) -> Dict[str, Any]:
        """Attach only the trusted tenant scope to bounded recovery evidence."""
        return {"tenant_scope": self._tenant_scope}

    async def _record_lifecycle_snapshot(
        self,
        endpoint_alias: str,
        provider_batch: Mapping[str, Any],
        observation_order: int,
    ) -> None:
        """Dispatch one normalized snapshot through the tenant recorder seam."""
