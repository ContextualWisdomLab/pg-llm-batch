name: One-shot execute bounded control JSON deterministically

on:
  push:
    branches: [agent/bounded-control-plane-json]
    paths:
      - .github/workflows/one-shot-bounded-control-json-execute-v5.yml

permissions:
  contents: write

concurrency:
  group: one-shot-bounded-control-json-execute-v5
  cancel-in-progress: true

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/bounded-control-plane-json
          fetch-depth: 0

      - name: Synchronize current main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Apply production changes and deterministic test routing
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path(
              ".github/workflows/one-shot-bounded-control-json-execute-v3.yml"
          ).read_text(encoding="utf-8")
          marker = (
              "      - name: Extract and execute the corrected implementation script\n"
              "        run: |\n"
          )
          start = source.index(marker) + len(marker)
          end = source.index("\n      - name: Install exact locked dependencies", start)
          lines = []
          for line in source[start:end].splitlines():
              if line.startswith("          "):
                  lines.append(line[10:])
              elif not line:
                  lines.append("")
              else:
                  raise SystemExit(f"unexpected implementation indentation: {line!r}")
          Path("/tmp/apply-final-bounded-control-json.sh").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          bash /tmp/apply-final-bounded-control-json.sh
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_bounded_control_plane_json.py")
          text = path.read_text(encoding="utf-8")
          start_marker = (
              "        for (route_method, fragment), response in self.routes.items():\n"
          )
          start = text.index(start_marker)
          end = text.index("\n\n    def get(", start)
          replacement = (
              "        matches = [\n"
              "            (fragment, response)\n"
              "            for (route_method, fragment), response in self.routes.items()\n"
              "            if method == route_method and fragment in url\n"
              "        ]\n"
              "        if not matches:\n"
              "            raise AssertionError(f\"no response route for {method} {url}\")\n"
              "        return max(matches, key=lambda match: len(match[0]))[1]"
          )
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

      - name: Install exact locked dependencies
        run: uv sync --locked

      - name: Verify focused and complete quality contracts
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/test_bounded_control_plane_json.py \
            tests/test_batch_api_client.py \
            tests/test_error_file_retrieval.py \
            tests/test_idempotent_get_retries.py \
            tests/test_http_transport.py \
            tests/test_resource_id_validation.py \
            tests/test_bounded_result_downloads.py
          uv run pytest -q -m "not integration"
          uv run python -m compileall -q pg_llm_batch tests
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-report=term-missing --cov-fail-under=100
          uv lock --check
          rm -rf dist
          uv build --no-sources
          docker compose config >/dev/null
          docker build --tag pg-llm-batch:bounded-control-json .
          docker build --tag pg-llm-batch-postgres:bounded-control-json docker/postgres

      - name: Record green evidence
        run: |
          cat > docs/superpowers/evidence/2026-08-05-bounded-control-plane-json-green.md <<'EOF'
          # Bounded control-plane JSON green evidence

          The implementation workflow passed the focused response-boundary suite,
          complete non-integration tests, Python compilation, Ruff, 100% production
          docstrings, 100% production statement and branch coverage, lockfile
          freshness, wheel/source builds, Compose validation, and component and
          PostgreSQL container builds.

          Files and Batches metadata now passes through an independent one-MiB
          decoded-byte stream boundary before strict UTF-8 and JSON object parsing.
          Provider output and error files retain their separate download budget.
          EOF

      - name: Publish verified implementation
        env:
          BRANCH_NAME: agent/bounded-control-plane-json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pg_llm_batch/batch_api_client.py \
            tests/test_bounded_control_plane_json.py \
            tests/test_batch_api_client.py \
            tests/test_error_file_retrieval.py \
            tests/test_idempotent_get_retries.py \
            tests/test_http_transport.py \
            tests/test_resource_id_validation.py \
            README.md \
            CHANGELOG.md \
            docs/superpowers/plans/2026-08-05-bounded-control-plane-json.md \
            docs/superpowers/evidence/2026-08-05-bounded-control-plane-json-green.md
          git diff --cached --quiet && { echo "No bounded control JSON implementation generated" >&2; exit 1; }
          git commit -m "feat(gateway): bound control-plane JSON responses"
          git push origin "HEAD:${BRANCH_NAME}"
