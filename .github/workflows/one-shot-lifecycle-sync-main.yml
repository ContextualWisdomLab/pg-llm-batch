name: One-shot lifecycle main synchronization

on:
  push:
    branches: [agent/persist-remote-batch-lifecycle]
    paths:
      - .github/workflows/one-shot-lifecycle-sync-main.yml

permissions:
  contents: write

concurrency:
  group: one-shot-lifecycle-sync-main
  cancel-in-progress: true

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout lifecycle branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/persist-remote-batch-lifecycle
          fetch-depth: 0
      - name: Merge current main and retain reconciled changelog
        env:
          BRANCH_NAME: agent/persist-remote-batch-lifecycle
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-edit origin/main
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "CHANGELOG.md"
            git checkout --ours CHANGELOG.md
            git add CHANGELOG.md
            git commit --no-edit
          fi
          rm .github/workflows/one-shot-lifecycle-sync-main.yml
          git add .github/workflows/one-shot-lifecycle-sync-main.yml
          git commit -m "ci: remove lifecycle synchronization workflow"
          git push origin "HEAD:${BRANCH_NAME}"
