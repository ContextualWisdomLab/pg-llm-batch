name: Finalize OpenTelemetry Lock Evidence

on:
  push:
    branches:
      - feat/opentelemetry-observability-extra-current-main
    paths:
      - .github/workflows/materialize-opentelemetry-lock.yml

permissions:
  contents: read

concurrency:
  group: finalize-opentelemetry-lock
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up repository-pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          prune-cache: true

      - name: Resolve and verify the exact lock graph
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          uv lock --check
          uv sync --locked --extra observability
          uv run pytest -q \
            tests/test_opentelemetry_optional_dependency.py \
            tests/test_opentelemetry_operations.py
          uv build --no-sources

      - name: Verify clean base and observability installations
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"

          python -m venv /tmp/pg-llm-batch-base
          uv pip install --python /tmp/pg-llm-batch-base/bin/python "$wheel"
          /tmp/pg-llm-batch-base/bin/python - <<'PY'
          import importlib.util
          import pg_llm_batch

          assert pg_llm_batch is not None
          assert importlib.util.find_spec("opentelemetry") is None
          PY

          python -m venv /tmp/pg-llm-batch-observability
          uv pip install \
            --python /tmp/pg-llm-batch-observability/bin/python \
            "${wheel}[observability]"
          /tmp/pg-llm-batch-observability/bin/python - <<'PY'
          import importlib.util

          from pg_llm_batch.observability import OpenTelemetryBatchAPIClient

          assert importlib.util.find_spec("opentelemetry") is not None
          assert OpenTelemetryBatchAPIClient.from_global_provider is not None
          PY

      - name: Commit the verified lock and remove the temporary workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: feat/opentelemetry-observability-extra-current-main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          authenticated_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote_head="$(git ls-remote "$authenticated_remote" "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"

          rm -- .github/workflows/materialize-opentelemetry-lock.yml
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock .github/workflows/materialize-opentelemetry-lock.yml

          actual_paths="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' \
            .github/workflows/materialize-opentelemetry-lock.yml \
            uv.lock | LC_ALL=C sort)"
          test "$actual_paths" = "$expected_paths"

          git commit -m "build: lock OpenTelemetry observability extra"
          git remote set-url origin "$authenticated_remote"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"
