name: One-shot tenant lifecycle GREEN

on:
  push:
    branches: [agent/tenant-scoped-lifecycle]
    paths:
      - .github/workflows/one-shot-tenant-lifecycle-green.yml

concurrency:
  group: one-shot-tenant-lifecycle-green
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-and-publish:
    if: >-
      github.repository == 'ContextualWisdomLab/pg-llm-batch' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/agent/tenant-scoped-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Refuse stale or competing writers
        shell: bash
        env:
          EXPECTED_PARENT_SHA: 7bcf3dc8c82613a1c785a761f39af1ae879aa600
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          mapfile -t writers < <(find .github/workflows -maxdepth 1 -type f \
            \( -name '*one-shot*.yml' -o -name '*repair*.yml' \) -print | sort)
          test "${#writers[@]}" -eq 1
          test "${writers[0]}" = ".github/workflows/one-shot-tenant-lifecycle-green.yml"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Install exact locked dependencies
        run: uv sync --locked

      - name: Reconcile permanent tests and authoritative contracts
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -I - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              """Replace one exact source fragment or stop without partial intent."""
              content = path.read_text(encoding="utf-8")
              if content.count(old) != 1:
                  raise SystemExit(
                      f"{path}: expected one anchor, found {content.count(old)}"
                  )
              path.write_text(content.replace(old, new, 1), encoding="utf-8")

          lifecycle_test = Path("tests/test_remote_batch_lifecycle.py")
          lifecycle = lifecycle_test.read_text(encoding="utf-8")
          replacements = {
              '    assert "CONSTRAINT uq_llm_remote_batch_jobs_endpoint_id" in schema\n'
              '    assert "UNIQUE (endpoint_alias, remote_batch_id)" in schema\n':
              '    assert "CONSTRAINT uq_llm_remote_batch_jobs_tenant_endpoint_id" in schema\n'
              '    assert "UNIQUE (tenant_scope, endpoint_alias, remote_batch_id)" in schema\n',
              '    assert "idx_llm_remote_batch_jobs_status_observed" in schema\n':
              '    assert "idx_llm_remote_batch_jobs_tenant_status_observed" in schema\n',
              '    assert snapshot == {\n        "endpoint_alias": "primary",\n':
              '    assert snapshot == {\n        "tenant_scope": "standalone",\n'
              '        "endpoint_alias": "primary",\n',
              '    sql, params = driver.executions[0]\n'
              '    assert "ON CONFLICT (endpoint_alias, remote_batch_id) DO UPDATE" in sql\n':
              '    assert driver.executions[0] == (\n'
              '        "SELECT set_config(\'pg_llm_batch.tenant_scope\', %s, true)",\n'
              '        ("standalone",),\n'
              '    )\n'
              '    sql, params = driver.executions[1]\n'
              '    assert (\n'
              '        "ON CONFLICT (tenant_scope, endpoint_alias, remote_batch_id) DO UPDATE"\n'
              '        in sql\n'
              '    )\n',
          }
          for old, new in replacements.items():
              if lifecycle.count(old) != 1:
                  raise SystemExit(f"lifecycle test anchor mismatch: {old!r}")
              lifecycle = lifecycle.replace(old, new, 1)
          lifecycle = lifecycle.replace("params[11]", "params[12]")
          lifecycle = lifecycle.replace(
              "driver.executions[-1][1][11]",
              "driver.executions[-1][1][12]",
          )
          lifecycle_test.write_text(lifecycle, encoding="utf-8")

          schema_integrity = Path("tests/test_schema_integrity.py")
          schema_integrity.write_text(
              '''# SPDX-License-Identifier: Apache-2.0
          """Regression tests for packaged PostgreSQL schema integrity."""

          from pathlib import Path

          from pg_llm_batch import db


          def test_postgres_init_schema_exactly_mirrors_packaged_schema() -> None:
              """The deployable image schema cannot drift from the package source."""
              repository_root = Path(__file__).resolve().parents[1]
              packaged_schema = Path(db.SCHEMA_PATH).read_text(encoding="utf-8")
              image_schema = (
                  repository_root / "docker/postgres/init/02_schema.sql"
              ).read_text(encoding="utf-8")
              assert image_schema == packaged_schema
          '''.replace("\n          ", "\n").lstrip(),
              encoding="utf-8",
          )

          tenant_client_test = Path("tests/test_tenant_durable_client.py")
          tenant_client = tenant_client_test.read_text(encoding="utf-8").replace(
              "pytest.MonPatch", "pytest.MonkeyPatch"
          )
          recorder_rejection = '''

          def test_tenant_client_rejects_the_unscoped_recorder_keyword() -> None:
              """Tenant clients cannot silently route through the legacy recorder seam."""
              with pytest.raises(ValidationError) as exc_info:
                  TenantDurableBatchAPIClient(
                      "postgresql://tenant-test",
                      _credentials,
                      tenant_scope="tenant-a",
                      lifecycle_recorder=lambda *_args: None,
                  )

              assert exc_info.value.details == {
                  "field": "lifecycle_recorder",
                  "value": "<provided>",
                  "reason": "tenant clients require tenant_lifecycle_recorder",
              }
          '''.replace("\n          ", "\n")
          if "test_tenant_client_rejects_the_unscoped_recorder_keyword" not in tenant_client:
              tenant_client = tenant_client.rstrip() + recorder_rejection + "\n"
          tenant_client_test.write_text(tenant_client, encoding="utf-8")

          persistence_test = Path("tests/test_tenant_lifecycle_persistence.py")
          persistence = persistence_test.read_text(encoding="utf-8")
          malformed_row = '''

          def test_tenant_scoped_read_rejects_malformed_database_rows(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              """A partial row cannot become an ambiguous lifecycle projection."""
              driver = _Psycopg(fetchone_rows=[("tenant-a", "primary")])
              monkeypatch.setattr(db, "psycopg", driver)

              with pytest.raises(RuntimeError, match="invalid row"):
                  db.get_tenant_remote_batch_state(
                      "postgresql://tenant-test",
                      "tenant-a",
                      "primary",
                      "batch-shared",
                  )
          '''.replace("\n          ", "\n")
          if "test_tenant_scoped_read_rejects_malformed_database_rows" not in persistence:
              persistence = persistence.rstrip() + malformed_row + "\n"
          persistence_test.write_text(persistence, encoding="utf-8")

          integration_test = Path("tests/test_integration_pg.py")
          integration = integration_test.read_text(encoding="utf-8")
          tenant_integration = r'''

          @skip_no_db
          def test_live_rls_separates_identical_provider_ids_by_tenant() -> None:
              """A non-bypass role cannot observe another tenant's lifecycle row."""
              import uuid

              import psycopg
              from psycopg import sql
              from psycopg.conninfo import make_conninfo

              db.apply_schema(DSN)
              suffix = uuid.uuid4().hex[:12]
              role_name = f"tenant_scope_test_{suffix}"
              password = uuid.uuid4().hex
              batch_id = f"batch-{suffix}"
              role_dsn = make_conninfo(
                  DSN,
                  user=role_name,
                  password=password,
              )

              with psycopg.connect(DSN) as admin:
                  with admin.cursor() as cursor:
                      cursor.execute(
                          sql.SQL(
                              "CREATE ROLE {} LOGIN PASSWORD %s "
                              "NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT "
                              "NOREPLICATION NOBYPASSRLS"
                          ).format(sql.Identifier(role_name)),
                          (password,),
                      )
                      cursor.execute(
                          sql.SQL(
                              "GRANT SELECT, INSERT, UPDATE ON "
                              "llm_remote_batch_jobs TO {}"
                          ).format(sql.Identifier(role_name))
                      )
                  admin.commit()

              try:
                  db.persist_tenant_remote_batch_state(
                      role_dsn,
                      "tenant-a",
                      "primary",
                      {"id": batch_id, "status": "in_progress"},
                      1,
                  )
                  db.persist_tenant_remote_batch_state(
                      role_dsn,
                      "tenant-b",
                      "primary",
                      {"id": batch_id, "status": "completed"},
                      2,
                  )
                  tenant_a = db.get_tenant_remote_batch_state(
                      role_dsn,
                      "tenant-a",
                      "primary",
                      batch_id,
                  )
                  tenant_b = db.get_tenant_remote_batch_state(
                      role_dsn,
                      "tenant-b",
                      "primary",
                      batch_id,
                  )
                  assert tenant_a is not None
                  assert tenant_b is not None
                  assert tenant_a["tenant_scope"] == "tenant-a"
                  assert tenant_b["tenant_scope"] == "tenant-b"
                  assert tenant_a["batch_status"] == "in_progress"
                  assert tenant_b["batch_status"] == "completed"

                  with psycopg.connect(role_dsn) as tenant_connection:
                      with tenant_connection.cursor() as cursor:
                          cursor.execute(
                              "SELECT set_config(" 
                              "'pg_llm_batch.tenant_scope', %s, true)",
                              ("tenant-a",),
                          )
                          cursor.execute(
                              "SELECT COUNT(*) FROM llm_remote_batch_jobs "
                              "WHERE tenant_scope = %s AND remote_batch_id = %s",
                              ("tenant-b", batch_id),
                          )
                          assert cursor.fetchone()[0] == 0
              finally:
                  with psycopg.connect(DSN) as admin:
                      with admin.cursor() as cursor:
                          cursor.execute(
                              "DELETE FROM llm_remote_batch_jobs "
                              "WHERE remote_batch_id = %s",
                              (batch_id,),
                          )
                          cursor.execute(
                              sql.SQL("DROP OWNED BY {}").format(
                                  sql.Identifier(role_name)
                              )
                          )
                          cursor.execute(
                              sql.SQL("DROP ROLE {}").format(
                                  sql.Identifier(role_name)
                              )
                          )
                      admin.commit()
          '''.replace("\n          ", "\n")
          if "test_live_rls_separates_identical_provider_ids_by_tenant" not in integration:
              integration_test.write_text(
                  integration.rstrip() + tenant_integration + "\n",
                  encoding="utf-8",
              )

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          tenant_readme = r'''
          ### Tenant-scoped durable lifecycle state

          Shared-table MSA deployments should pass tenant context only after the
          host has authenticated and authorized the caller:

          ```python
          from pg_llm_batch import TenantDurableBatchAPIClient

          client = TenantDurableBatchAPIClient(
              dsn,
              credentials,
              tenant_scope=authenticated_tenant_scope,
          )
          ```

          The durable identity is `(tenant_scope, endpoint_alias,
          remote_batch_id)`. Package reads and writes bind the validated scope with
          transaction-local `set_config`, while enabled and forced PostgreSQL RLS
          denies access when context is missing. Application roles must be
          `NOSUPERUSER NOBYPASSRLS`; administrative bypass roles are outside the
          package isolation guarantee. Existing `DurableBatchAPIClient` consumers
          continue through the original four-argument recorder seam under the
          explicit `standalone` scope.

          '''.replace("\n          ", "\n")
          readme_anchor = "\n---\n\n## Tests\n"
          if "### Tenant-scoped durable lifecycle state" not in readme:
              if readme.count(readme_anchor) != 1:
                  raise SystemExit("README tests anchor mismatch")
              readme = readme.replace(
                  readme_anchor,
                  "\n" + tenant_readme + readme_anchor,
                  1,
              )
          readme_path.write_text(readme, encoding="utf-8")

          lifecycle_doc = Path("docs/remote-batch-lifecycle.md")
          lifecycle_docs = lifecycle_doc.read_text(encoding="utf-8")
          tenant_docs = r'''

          ## Tenant isolation

          `DurableBatchAPIClient` stores lifecycle state under the explicit
          `standalone` scope. Shared-table hosts use
          `TenantDurableBatchAPIClient` and supply an authorization identity from
          their trusted authenticated boundary. Provider metadata, remote IDs,
          request payloads, and transport headers never choose tenant scope.

          Every lifecycle statement binds the validated scope with transaction-local
          `set_config('pg_llm_batch.tenant_scope', ..., true)`. The table has enabled
          and forced default-deny RLS and a tenant-qualified conflict key. Production
          roles must be `NOSUPERUSER NOBYPASSRLS`. Legacy rows migrate to
          `standalone` without deletion. Rollback to the old two-column key is unsafe
          until operators prove no endpoint/provider identifier pair is shared across
          tenant scopes.
          '''.replace("\n          ", "\n")
          if "## Tenant isolation" not in lifecycle_docs:
              lifecycle_doc.write_text(
                  lifecycle_docs.rstrip() + tenant_docs + "\n",
                  encoding="utf-8",
              )

          architecture = r'''# Architecture

          ## Deployment boundary

          `pg-llm-batch` remains independently deployable and embeddable. PostgreSQL
          owns token counting, JSONL payloads, configuration, encrypted secrets, and
          durable remote batch lifecycle state. Provider HTTP behavior remains behind
          `BatchAPIClient`; host services can inject credentials and persistence seams.

          ## Durable lifecycle tenancy

          `DurableBatchAPIClient` is the backward-compatible standalone facade.
          `TenantDurableBatchAPIClient` requires a trusted host-selected scope. The
          durable business identity is:

          `(tenant_scope, endpoint_alias, remote_batch_id)`

          The database policy compares each row with the transaction-local
          `pg_llm_batch.tenant_scope` setting. Missing context is default-deny, and
          `FORCE ROW LEVEL SECURITY` covers ordinary table-owner access. PostgreSQL
          superusers and `BYPASSRLS` roles remain administrative escape hatches and
          must not be application identities.

          ## Migration and rollback

          Legacy rows are backfilled to `standalone` without deletion or merging.
          The old unique constraint and status index are replaced transactionally.
          Schema reapplication temporarily suspends owner enforcement inside the DDL
          transaction and restores forced RLS before commit. Rollback requires proving
          that no tenant scopes share an endpoint/provider identifier pair.

          ## Interoperability

          CWL hosts such as `contextual-orchestrator` and `naruon` supply tenant
          context only after their own authentication and authorization boundary.
          Tenant scope is local control-plane identity, never provider-returned data.
          '''.replace("\n          ", "\n").lstrip()
          Path("ARCHITECTURE.md").write_text(architecture, encoding="utf-8")

          claude = r'''# CLAUDE.md

          ## Tenant lifecycle invariants

          - Preserve standalone operation under the exact `standalone` scope.
          - Never derive tenant scope from provider metadata, transport, or remote IDs.
          - Validate scope before reservation, credentials, provider I/O, or DB I/O.
          - Bind scope as a parameter with transaction-local `set_config`.
          - Keep RLS enabled and forced; app roles are `NOSUPERUSER NOBYPASSRLS`.
          - Include tenant scope in every lifecycle lookup and conflict identity.
          - Keep packaged and Docker initialization schemas byte-for-byte identical.
          - Preserve 100% production statement, branch, and public-docstring coverage.
          '''.replace("\n          ", "\n").lstrip()
          Path("CLAUDE.md").write_text(claude, encoding="utf-8")

          agents_path = Path("AGENTS.md")
          agents = agents_path.read_text(encoding="utf-8")
          tenant_agents = r'''

          ## Tenant lifecycle security contract

          Lifecycle changes must preserve trusted `tenant_scope`, the tenant-qualified
          compound key, transaction-local `set_config`, enabled and forced RLS, and
          the explicit superuser/`BYPASSRLS` limitation. Provider data never supplies
          authorization context. Preserve standalone recorder compatibility, migration
          idempotency, exact deployable schema mirroring, and 100% coverage.
          '''.replace("\n          ", "\n")
          if "## Tenant lifecycle security contract" not in agents:
              agents_path.write_text(
                  agents.rstrip() + tenant_agents + "\n",
                  encoding="utf-8",
              )

          doctoring = r'''# Tenant-Scoped Durable Lifecycle Isolation

          ## Decision

          Shared-table deployments use a trusted local `tenant_scope` as part of the
          lifecycle identity and enforce it with PostgreSQL row-level security.
          `TenantDurableBatchAPIClient` requires the scope at construction. Existing
          `DurableBatchAPIClient` consumers retain the four-argument recorder seam in
          the explicit `standalone` scope.

          ## Security contract

          - Scope syntax is `[A-Za-z0-9][A-Za-z0-9._:-]{0,127}` without trimming.
          - The host derives scope after authentication and authorization; provider
            metadata and transport values are not tenant authorities.
          - Reads and writes bind transaction-local tenant context before table access.
          - Matching `USING` and `WITH CHECK` clauses are enabled and forced.
          - Missing context is default-deny. Superusers and `BYPASSRLS` roles bypass
            PostgreSQL RLS and therefore cannot be application identities.
          - The unique identity and operational status index begin with tenant scope.

          ## Verification

          Deterministic tests cover validation, SQL parameters, compatibility, client
          dispatch, recovery privacy, migration, policy text, and exact schema mirroring.
          The live PostgreSQL test creates a `NOSUPERUSER NOBYPASSRLS` role, stores the
          same provider ID for two tenants, and verifies cross-tenant reads return zero.

          ## References

          Joint Task Force. (2020). *Security and privacy controls for information
          systems and organizations* (NIST Special Publication 800-53, Revision 5).
          National Institute of Standards and Technology.
          https://doi.org/10.6028/NIST.SP.800-53r5

          OWASP Foundation. (n.d.). *Multi-tenant security cheat sheet*. OWASP Cheat
          Sheet Series. Retrieved August 5, 2026, from
          https://cheatsheetseries.owasp.org/cheatsheets/Multi_Tenant_Security_Cheat_Sheet.html

          PostgreSQL Global Development Group. (2026a). *Row security policies*. In
          *PostgreSQL 18 documentation*.
          https://www.postgresql.org/docs/18/ddl-rowsecurity.html

          PostgreSQL Global Development Group. (2026b). *System administration
          functions*. In *PostgreSQL 18 documentation*.
          https://www.postgresql.org/docs/18/functions-admin.html
          '''.replace("\n          ", "\n").lstrip()
          doctoring_path = Path("docs/doctoring/tenant-scoped-lifecycle.md")
          doctoring_path.parent.mkdir(parents=True, exist_ok=True)
          doctoring_path.write_text(doctoring, encoding="utf-8")

          adr = r'''# ADR 0002: Tenant-Scoped Durable Lifecycle State

          - Status: Accepted
          - Date: 2026-08-05

          ## Context

          Provider batch identifiers are not globally unique across customer tenants.
          A two-column endpoint/provider key therefore cannot provide a defensible
          shared-table authorization boundary.

          ## Decision

          Require a trusted local tenant identity for shared deployments, qualify the
          lifecycle key by tenant, bind scope transaction-locally, and enforce enabled
          and forced PostgreSQL RLS. Preserve the standalone recorder seam under the
          explicit `standalone` identity.

          ## Consequences

          Hosts must derive scope after authentication, use non-bypass application
          roles, and preserve transaction boundaries. Legacy rows migrate without
          deletion. Rollback requires first eliminating cross-tenant duplicate provider
          identifiers. The package remains usable without a host MSA.
          '''.replace("\n          ", "\n").lstrip()
          adr_path = Path("docs/adr/0002-tenant-scoped-lifecycle.md")
          adr_path.parent.mkdir(parents=True, exist_ok=True)
          adr_path.write_text(adr, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          changelog_entry = (
              "- Trusted tenant-scoped durable lifecycle identities, explicit "
              "standalone compatibility, tenant-aware client/read/write helpers, "
              "transaction-local PostgreSQL context, idempotent legacy backfill, "
              "and forced default-deny row-level security for shared-table MSA "
              "deployments.\n"
          )
          if changelog_entry not in changelog:
              if changelog.count("### Added\n\n") != 1:
                  raise SystemExit("CHANGELOG Added anchor mismatch")
              changelog = changelog.replace(
                  "### Added\n\n",
                  "### Added\n\n" + changelog_entry,
                  1,
              )
          changelog_path.write_text(changelog, encoding="utf-8")

          plan_path = Path(
              "docs/superpowers/plans/2026-08-05-tenant-scoped-lifecycle.md"
          )
          plan = plan_path.read_text(encoding="utf-8")
          completion = r'''

          ## Completion evidence

          The RED contracts were committed before production interfaces existed.
          GREEN verification covers Python 3.14 focused and complete tests, 100%
          production statement and branch coverage, 100% public docstrings, Ruff,
          lockfile freshness, package builds, container builds, schema reapplication,
          and live non-bypass PostgreSQL tenant isolation.
          '''.replace("\n          ", "\n")
          if "## Completion evidence" not in plan:
              plan_path.write_text(plan.rstrip() + completion + "\n", encoding="utf-8")
          PY
          git diff --check

      - name: Verify focused tenant contracts
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/test_tenant_scope_validation.py \
            tests/test_tenant_lifecycle_schema.py \
            tests/test_tenant_lifecycle_persistence.py \
            tests/test_tenant_durable_client.py \
            tests/test_remote_batch_lifecycle.py \
            tests/test_schema_integrity.py

      - name: Verify complete deterministic quality gates
        run: |
          set -euo pipefail
          uv run python -m compileall -q pg_llm_batch tests
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-branch --cov-report=term-missing \
            --cov-fail-under=100
          uv lock --check
          rm -rf dist build
          uv build --no-sources
          docker compose config >/dev/null
          docker build --tag pg-llm-batch:tenant-scope .
          docker build --tag pg-llm-batch-postgres:tenant-scope docker/postgres

      - name: Verify live PostgreSQL migration and RLS
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker compose down --volumes --remove-orphans || true
          }
          trap cleanup EXIT
          docker compose up --detach --build postgres
          for attempt in $(seq 1 60); do
            if docker compose exec -T postgres \
              pg_isready -U pgllm -d pgllm >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose logs postgres
              exit 1
            fi
            sleep 5
          done
          PG_LLM_BATCH_TEST_DSN='postgresql://pgllm:pgllm@127.0.0.1:5432/pgllm' \
            uv run pytest -q -m integration tests/test_integration_pg.py
          PG_LLM_BATCH_TEST_DSN='postgresql://pgllm:pgllm@127.0.0.1:5432/pgllm' \
            uv run pytest -q -m integration tests/test_integration_pg.py

      - name: Record exact verification and remove temporary writer
        shell: bash
        env:
          SOURCE_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-tenant-lifecycle-green.yml
          rm -rf .coverage .coverage.* htmlcov build dist
          mkdir -p docs/superpowers/evidence
          cat > docs/superpowers/evidence/2026-08-05-tenant-scoped-lifecycle-green.md <<EOF
          # Tenant-Scoped Lifecycle GREEN Evidence

          - Source head: \`$SOURCE_HEAD\`
          - Permanent tenant validation, schema, persistence, and client tests were
            committed RED before the implementation interfaces existed.
          - Focused and complete deterministic tests passed.
          - Production statement and branch coverage: 100%.
          - Public production docstrings: 100%.
          - Ruff, compile, lockfile, source/wheel, Compose, and both container builds passed.
          - Live PostgreSQL migration and non-bypass RLS isolation passed twice,
            demonstrating schema reapplication safety and repeatable tenant separation.
          - The bounded write-capable workflow removed itself from the final diff.
          EOF
          test ! -e .github/workflows/one-shot-tenant-lifecycle-green.yml
          test -z "$(git ls-files --others --exclude-standard | grep -E '(^|/)(\.coverage|htmlcov|build|dist)(/|$)' || true)"
          git diff --check

      - name: Commit verified implementation after stale-head refusal
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
          BRANCH_NAME: agent/tenant-scoped-lifecycle
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/one-shot-tenant-lifecycle-green.yml$' || true)"
          git commit -m "feat(tenant): complete lifecycle isolation"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:${BRANCH_NAME}"
