name: One-shot atomic tenant RLS enablement

on:
  push:
    branches: [agent/tenant-scoped-lifecycle]
    paths:
      - .github/workflows/one-shot-enable-tenant-rls-atomically.yml

concurrency:
  group: one-shot-enable-tenant-rls-atomically
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair-verify-publish:
    if: >-
      github.repository == 'ContextualWisdomLab/pg-llm-batch' &&
      github.ref == 'refs/heads/agent/tenant-scoped-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Refuse stale state or competing branch writers
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_PARENT: 764600f0a58bdf59fb4614b6fffeaa41e23eb01b
          EXPECTED_BASE: f0c5f79c5327a090014dd5558750110fce9fd2ac
          BRANCH_NAME: agent/tenant-scoped-lifecycle
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/$BRANCH_NAME | cut -f1)" = "$GITHUB_SHA"
          mapfile -t writers < <(find .github/workflows -maxdepth 1 -type f \
            \( -name '*one-shot*.yml' -o -name '*repair*.yml' \) -print | sort)
          test "${#writers[@]}" -eq 1
          test "${writers[0]}" = ".github/workflows/one-shot-enable-tenant-rls-atomically.yml"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          prune-cache: true

      - name: Install exact locked dependencies
        run: uv sync --locked

      - name: Confirm permanent regression is RED
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set +e
          output="$(uv run pytest -q tests/test_tenant_lifecycle_schema.py::test_rls_owner_transition_is_atomic_for_psql_reapplication 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F 'ENABLE ROW LEVEL SECURITY'

      - name: Apply bounded atomic-RLS repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -I - <<'PY'
          from pathlib import Path

          schema_paths = (
              Path("pg_llm_batch/schema.sql"),
              Path("docker/postgres/init/02_schema.sql"),
          )
          original = schema_paths[0].read_text(encoding="utf-8")
          if schema_paths[1].read_text(encoding="utf-8") != original:
              raise SystemExit("schema mirrors differ before repair")

          replacements = (
              (
                  """-- backfill, and constraint migration execute inside one anonymous block. If any
-- operation fails, PostgreSQL rolls the entire statement back and FORCE RLS is
-- never left disabled between committed statements.
""",
                  """-- backfill, constraint migration, and RLS enable/force transition execute
-- inside one anonymous block. If any operation fails, PostgreSQL rolls the
-- statement back so no disabled, unforced, or partially migrated state commits.
""",
              ),
              (
                  """    ALTER TABLE llm_remote_batch_jobs FORCE ROW LEVEL SECURITY;
END $$;
""",
                  """    ALTER TABLE llm_remote_batch_jobs ENABLE ROW LEVEL SECURITY;
    ALTER TABLE llm_remote_batch_jobs FORCE ROW LEVEL SECURITY;
END $$;
""",
              ),
              (
                  """ALTER TABLE llm_remote_batch_jobs ENABLE ROW LEVEL SECURITY;
ALTER TABLE llm_remote_batch_jobs FORCE ROW LEVEL SECURITY;

""",
                  "",
              ),
          )
          repaired = original
          for old, new in replacements:
              if repaired.count(old) != 1:
                  raise SystemExit("schema replacement drifted")
              repaired = repaired.replace(old, new, 1)
          for path in schema_paths:
              path.write_text(repaired, encoding="utf-8")

          documentation = {
              Path("docs/doctoring/tenant-scoped-lifecycle.md"): (
                  """The temporary owner-enforcement transition,
legacy-row backfill, constraint migration, and `FORCE ROW LEVEL SECURITY`
restoration execute inside one anonymous PostgreSQL block. This prevents psql
autocommit from committing an intermediate owner-bypass state.
""",
                  """The temporary owner-enforcement transition,
legacy-row backfill, constraint migration, `ENABLE ROW LEVEL SECURITY`, and
`FORCE ROW LEVEL SECURITY` restoration execute inside one anonymous PostgreSQL
block. A legacy installation therefore cannot commit a migrated table while RLS
is still disabled; policy recreation afterward remains default-deny until the
new policy exists.
""",
              ),
              Path("docs/adr/0002-tenant-scoped-lifecycle.md"): (
                  """Legacy rows are backfilled to `standalone`. Owner enforcement may be relaxed
only inside the same atomic SQL statement that performs the backfill and restores
`FORCE ROW LEVEL SECURITY`.
""",
                  """Legacy rows are backfilled to `standalone`. Owner enforcement may be relaxed
only inside the same atomic SQL statement that performs the backfill, enables
row-level security for legacy tables, and restores `FORCE ROW LEVEL SECURITY`.
Policy recreation follows under enabled and forced default-deny behavior.
""",
              ),
          }
          for path, (old, new) in documentation.items():
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"documentation replacement drifted: {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          cmp -s pg_llm_batch/schema.sql docker/postgres/init/02_schema.sql
          git diff --check

      - name: Verify focused and complete deterministic gates
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          uv run pytest -q tests/test_tenant_lifecycle_schema.py tests/test_schema_integrity.py tests/test_tenant_operator_documentation.py
          uv run python -m compileall -q pg_llm_batch tests
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-branch --cov-report=term-missing --cov-fail-under=100
          uv lock --check
          rm -rf .coverage .coverage.* htmlcov build dist
          uv build --no-sources
          docker compose config >/dev/null

      - name: Remove temporary automation and publish exact result
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          BRANCH_NAME: agent/tenant-scoped-lifecycle
          EXPECTED_HEAD: ${{ github.sha }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/one-shot-enable-tenant-rls-atomically.yml
          rm -rf .coverage .coverage.* htmlcov build dist
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/$BRANCH_NAME | cut -f1)" = "$EXPECTED_HEAD"
          cmp -s pg_llm_batch/schema.sql docker/postgres/init/02_schema.sql
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(schema): enable tenant RLS atomically"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" push origin "HEAD:${BRANCH_NAME}"
