name: One-shot bounded result downloads

on:
  push:
    branches: [agent/bounded-result-downloads]

permissions:
  contents: write

concurrency:
  group: one-shot-bounded-result-downloads
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/bounded-result-downloads
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Apply bounded download implementation and documentation
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          client_path = Path("pg_llm_batch/batch_api_client.py")
          client = client_path.read_text(encoding="utf-8")
          client = replace_once(
              client,
              '''DEFAULT_USER_AGENT = "pg-llm-batch"
          DEFAULT_REQUEST_TIMEOUT_SECONDS = 30.0
          TERMINAL_BATCH_STATUSES = frozenset({"completed", "failed", "expired", "cancelled"})''',
              '''DEFAULT_USER_AGENT = "pg-llm-batch"
          DEFAULT_REQUEST_TIMEOUT_SECONDS = 30.0
          DEFAULT_MAX_DOWNLOAD_BYTES = 128 * 1024 * 1024
          DOWNLOAD_CHUNK_BYTES = 64 * 1024
          TERMINAL_BATCH_STATUSES = frozenset({"completed", "failed", "expired", "cancelled"})''',
              "download constants",
          )
          client = replace_once(
              client,
              '''        request_timeout_seconds: float = DEFAULT_REQUEST_TIMEOUT_SECONDS,
              ) -> None:
                  """Initialize the client with a payload store and bounded HTTP timeout."""''',
              '''        request_timeout_seconds: float = DEFAULT_REQUEST_TIMEOUT_SECONDS,
                  max_download_bytes: int = DEFAULT_MAX_DOWNLOAD_BYTES,
              ) -> None:
                  """Initialize the client with bounded HTTP time and download resources."""''',
              "constructor signature",
          )
          client = replace_once(
              client,
              '''        self.postgres_dsn = postgres_dsn
                  self._credentials = credentials
                  self.request_timeout_seconds = normalized_timeout
                  self._request_timeout = aiohttp.ClientTimeout(total=normalized_timeout)''',
              '''        if (
                      isinstance(max_download_bytes, bool)
                      or not isinstance(max_download_bytes, int)
                      or max_download_bytes <= 0
                  ):
                      raise ValidationError(
                          field="max_download_bytes",
                          value=max_download_bytes,
                          reason="must be a positive integer number of bytes",
                      )
                  self.postgres_dsn = postgres_dsn
                  self._credentials = credentials
                  self.request_timeout_seconds = normalized_timeout
                  self.max_download_bytes = max_download_bytes
                  self._request_timeout = aiohttp.ClientTimeout(total=normalized_timeout)''',
              "constructor validation",
          )
          helper = '''    def _download_limit_error(
                  self,
                  response: Any,
                  operation: str,
                  *,
                  declared_bytes: Optional[int],
                  bytes_read: int,
              ) -> GatewayError:
                  """Build a body-free error describing one provider download limit breach."""
                  return GatewayError(
                      f"{operation} exceeded download limit",
                      status_code=getattr(response, "status", None),
                      response_data={
                          "limit_bytes": self.max_download_bytes,
                          "declared_bytes": declared_bytes,
                          "bytes_read": bytes_read,
                      },
                  )

              async def _read_bounded_utf8(self, response: Any, operation: str) -> str:
                  """Read one response body within the configured decoded-byte limit."""
                  declared_value = getattr(response, "content_length", None)
                  declared_bytes = (
                      declared_value
                      if isinstance(declared_value, int)
                      and not isinstance(declared_value, bool)
                      and declared_value >= 0
                      else None
                  )
                  if (
                      declared_bytes is not None
                      and declared_bytes > self.max_download_bytes
                  ):
                      raise self._download_limit_error(
                          response,
                          operation,
                          declared_bytes=declared_bytes,
                          bytes_read=0,
                      )

                  stream = getattr(response, "content", None)
                  if stream is None:
                      text = await response.text()
                      try:
                          encoded_size = len(text.encode("utf-8"))
                      except UnicodeEncodeError as exc:
                          raise GatewayError(
                              f"{operation} returned invalid UTF-8",
                              status_code=getattr(response, "status", None),
                              response_data={
                                  "error_type": type(exc).__name__,
                                  "byte_offset": exc.start,
                              },
                          ) from exc
                      if encoded_size > self.max_download_bytes:
                          raise self._download_limit_error(
                              response,
                              operation,
                              declared_bytes=declared_bytes,
                              bytes_read=0,
                          )
                      return text

                  payload = bytearray()
                  async for chunk in stream.iter_chunked(DOWNLOAD_CHUNK_BYTES):
                      if len(payload) + len(chunk) > self.max_download_bytes:
                          raise self._download_limit_error(
                              response,
                              operation,
                              declared_bytes=declared_bytes,
                              bytes_read=len(payload),
                          )
                      payload.extend(chunk)

                  try:
                      return payload.decode("utf-8")
                  except UnicodeDecodeError as exc:
                      raise GatewayError(
                          f"{operation} returned invalid UTF-8",
                          status_code=getattr(response, "status", None),
                          response_data={
                              "error_type": type(exc).__name__,
                              "byte_offset": exc.start,
                          },
                      ) from exc

          '''
          client = replace_once(
              client,
              '    def _headers(self, api_key: str, *, json_body: bool = False) -> Dict[str, str]:\n',
              helper + '    def _headers(self, api_key: str, *, json_body: bool = False) -> Dict[str, str]:\n',
              "bounded reader insertion",
          )
          client = replace_once(
              client,
              '''        ) as response:
                      if response.status != 200:
                          error_text = await response.text()
                          raise GatewayError(
                              f"{operation} failed: {response.status}",
                              status_code=response.status,
                              response_data={"body": error_text},
                          )
                      content = await response.text()''',
              '''        ) as response:
                      content = await self._read_bounded_utf8(response, operation)
                      if response.status != 200:
                          raise GatewayError(
                              f"{operation} failed: {response.status}",
                              status_code=response.status,
                              response_data={"body": content},
                          )''',
              "download body",
          )
          client = replace_once(
              client,
              '        """Download output and provider error files into memory."""',
              '        """Download output and provider error files into bounded memory."""',
              "download_results docstring",
          )
          client_path.write_text(client, encoding="utf-8")

          tests_path = Path("tests/test_bounded_result_downloads.py")
          tests = tests_path.read_text(encoding="utf-8")
          appendix = r'''

          def test_client_uses_documented_default_download_limit() -> None:
              """The public default remains the documented 128 MiB safety boundary."""
              client = BatchAPIClient("postgresql://x", credentials)
              assert client.max_download_bytes == 128 * 1024 * 1024


          @pytest.mark.parametrize("declared_length", [True, -1, "9"])
          async def test_invalid_declared_lengths_do_not_override_actual_bytes(
              declared_length: Any,
          ) -> None:
              """Malformed length metadata is ignored while actual streamed bytes stay bounded."""
              response = StreamResponse([b'{"ok":1}\n'], content_length=None)
              response.content_length = declared_length
              client = BatchAPIClient(
                  "postgresql://x",
                  credentials,
                  max_download_bytes=9,
              )
              client._session = Session(response)

              result = await client._download_jsonl_file(
                  "output-1",
                  "default",
                  batch_id="batch-1",
                  file_kind="result",
              )

              assert result == [{"ok": 1}]


          async def test_text_compatibility_path_accepts_a_bounded_body() -> None:
              """A small response adapter body remains compatible with the bounded reader."""
              client = BatchAPIClient(
                  "postgresql://x",
                  credentials,
                  max_download_bytes=9,
              )
              client._session = Session(TextResponse('{"ok":1}\n'))

              result = await client._download_jsonl_file(
                  "output-1",
                  "default",
                  batch_id="batch-1",
                  file_kind="result",
              )

              assert result == [{"ok": 1}]


          async def test_text_compatibility_path_rejects_unencodable_surrogates() -> None:
              """Lone surrogates cannot escape the strict UTF-8 provider boundary."""
              client = BatchAPIClient(
                  "postgresql://x",
                  credentials,
                  max_download_bytes=32,
              )
              client._session = Session(TextResponse('bad\ud800'))

              with pytest.raises(GatewayError, match="invalid UTF-8") as exc_info:
                  await client._download_jsonl_file(
                      "output-1",
                      "default",
                      batch_id="batch-1",
                      file_kind="result",
                  )

              assert exc_info.value.response_data == {
                  "error_type": "UnicodeEncodeError",
                  "byte_offset": 3,
              }
          '''
          if "test_client_uses_documented_default_download_limit" not in tests:
              tests_path.write_text(tests + appendix, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = replace_once(
              readme,
              'client = BatchAPIClient(dsn, config_credentials_provider(config, secrets))',
              '''client = BatchAPIClient(
                  dsn,
                  config_credentials_provider(config, secrets),
                  max_download_bytes=256 * 1024 * 1024,
              )''',
              "README client example",
          )
          readme = replace_once(
              readme,
              '''`Callable[[str], GatewayCredentials]` to source credentials from your host app.
          ''',
              '''`Callable[[str], GatewayCredentials]` to source credentials from your host app.

          Provider result and error files are streamed in 64 KiB chunks and limited to
          128 MiB of decoded UTF-8 data by default. The limit is enforced after aiohttp
          decompression and before JSONL parsing. Set `max_download_bytes` explicitly when
          a reviewed deployment requires a larger bounded payload; oversized or invalid
          UTF-8 responses fail with structured errors that do not echo provider content.
          ''',
              "README download policy",
          )
          readme_path.write_text(readme, encoding="utf-8")

          Path("CHANGELOG.md").write_text(
              '''# Changelog

          All notable changes to this project are documented in this file.

          The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
          and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

          ## [Unreleased]

          ### Added

          - Bounded, streamed provider result and error downloads with a 128 MiB
            decoded-byte default, strict UTF-8 validation, and body-free oversize errors.

          ## [0.1.0] - 2026-07-12

          ### Added

          - Initial standalone and embeddable PostgreSQL LLM batch engine extraction.
          ''',
              encoding="utf-8",
          )
          PY

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run focused bounded download tests
        run: uv run pytest -q tests/test_bounded_result_downloads.py

      - name: Run non-integration suite
        run: uv run pytest -q -m 'not integration'

      - name: Compile and lint
        run: |
          uv run python -m compileall -q pg_llm_batch
          uv run ruff check pg_llm_batch tests

      - name: Enforce docstring and coverage gates
        run: |
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m 'not integration' \
            --cov=pg_llm_batch --cov-report=term-missing --cov-fail-under=100

      - name: Build distributions
        run: uv build --no-sources

      - name: Commit verified implementation and remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/one-shot-bounded-result-downloads.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pg_llm_batch/batch_api_client.py tests/test_bounded_result_downloads.py README.md CHANGELOG.md .github/workflows/one-shot-bounded-result-downloads.yml
          git commit -m 'feat(gateway): bound streamed result downloads'
          git push origin HEAD:agent/bounded-result-downloads
