name: One-shot non-byte control chunk GREEN

on:
  push:
    branches:
      - agent/bounded-control-plane-json
    paths:
      - .github/workflows/one-shot-non-byte-control-chunk-green.yml

concurrency:
  group: one-shot-non-byte-control-chunk-green
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  implement-verify-publish:
    if: >-
      github.repository == 'ContextualWisdomLab/pg-llm-batch' &&
      github.ref == 'refs/heads/agent/bounded-control-plane-json'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Apply bounded adapter-chunk validation
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_PARENT_SHA: 9e8b581b7b36dbf4c21567cc9684277cfd93cc49
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          python3 -I - <<'PY'
          from pathlib import Path

          source = Path("pg_llm_batch/batch_api_client.py")
          content = source.read_text(encoding="utf-8")
          old = '''        payload = bytearray()
          async for chunk in iterator(DOWNLOAD_CHUNK_BYTES):
              if len(payload) + len(chunk) > max_bytes:
          '''
          new = '''        payload = bytearray()
          async for chunk in iterator(DOWNLOAD_CHUNK_BYTES):
              if not isinstance(chunk, (bytes, bytearray)):
                  raise GatewayError(
                      f"{operation} returned a non-byte stream chunk",
                      status_code=getattr(response, "status", None),
                      response_data={"error_type": "InvalidByteChunk"},
                  )
              if len(payload) + len(chunk) > max_bytes:
          '''
          if content.count(old) != 1:
              raise SystemExit("bounded stream insertion anchor missing or duplicated")
          source.write_text(content.replace(old, new), encoding="utf-8")
          PY
          git diff --check

      - name: Install exact locked dependencies
        run: uv sync --locked

      - name: Verify GREEN behavior and repository gates
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          uv run pytest -q tests/test_bounded_control_plane_json.py::test_non_byte_stream_chunk_fails_closed_without_content_leakage
          uv run pytest -q -m "not integration"
          uv run python -m compileall -q pg_llm_batch tests
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-report=term-missing --cov-fail-under=100
          uv lock --check
          rm -rf dist
          uv build --no-sources
          git diff --check

      - name: Publish verified implementation and remove workflow
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          PUSH_TOKEN: ${{ github.token }}
          BRANCH_NAME: agent/bounded-control-plane-json
        run: |
          rm .github/workflows/one-shot-non-byte-control-chunk-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix(gateway): reject non-byte response chunks"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:${BRANCH_NAME}"
