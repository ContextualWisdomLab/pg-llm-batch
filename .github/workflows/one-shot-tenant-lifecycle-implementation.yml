name: One-shot tenant lifecycle implementation

on:
  push:
    branches: [agent/tenant-scoped-lifecycle]
    paths:
      - .github/workflows/one-shot-tenant-lifecycle-implementation.yml

concurrency:
  group: one-shot-tenant-lifecycle-implementation
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  implement-test-publish:
    if: >-
      github.repository == 'ContextualWisdomLab/pg-llm-batch' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/agent/tenant-scoped-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Install exact locked dependencies
        run: uv sync --locked

      - name: Bind exact RED predecessor
        env:
          EXPECTED_PARENT_SHA: add09524c67637223abd82404d60b00dc5bb6777
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"

      - name: Implement tenant-scoped lifecycle isolation
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -I - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              """Replace one exact source fragment or fail without partial edits."""
              content = path.read_text(encoding="utf-8")
              if content.count(old) != 1:
                  raise SystemExit(
                      f"{path}: expected one replacement anchor, found {content.count(old)}"
                  )
              path.write_text(content.replace(old, new, 1), encoding="utf-8")

          db_path = Path("pg_llm_batch/db.py")
          db_source = db_path.read_text(encoding="utf-8")
          constants_anchor = (
              "MAX_PROVIDER_METADATA_BYTES = 64 * 1024\n"
              "MAX_ENDPOINT_ALIAS_CHARACTERS = 128\n"
              "MAX_REMOTE_RESOURCE_ID_CHARACTERS = 256\n"
          )
          constants_replacement = (
              "MAX_PROVIDER_METADATA_BYTES = 64 * 1024\n"
              "MAX_ENDPOINT_ALIAS_CHARACTERS = 128\n"
              "MAX_REMOTE_RESOURCE_ID_CHARACTERS = 256\n"
              "MAX_TENANT_SCOPE_CHARACTERS = 128\n"
              "DEFAULT_TENANT_SCOPE = \"standalone\"\n"
          )
          if "MAX_TENANT_SCOPE_CHARACTERS" not in db_source:
              if db_source.count(constants_anchor) != 1:
                  raise SystemExit("db.py: tenant constant anchor mismatch")
              db_source = db_source.replace(
                  constants_anchor,
                  constants_replacement,
                  1,
              )
              remote_pattern_end = (
                  "REMOTE_RESOURCE_ID_PATTERN = re.compile(\n"
                  "    rf\"[A-Za-z0-9][A-Za-z0-9._:-]{{0,{MAX_REMOTE_RESOURCE_ID_CHARACTERS - 1}}}\\Z\"\n"
                  ")\n"
              )
              tenant_pattern = (
                  remote_pattern_end
                  + "TENANT_SCOPE_PATTERN = re.compile(\n"
                  + "    rf\"[A-Za-z0-9][A-Za-z0-9._:-]{{0,{MAX_TENANT_SCOPE_CHARACTERS - 1}}}\\Z\"\n"
                  + ")\n"
              )
              if db_source.count(remote_pattern_end) != 1:
                  raise SystemExit("db.py: tenant regex anchor mismatch")
              db_source = db_source.replace(remote_pattern_end, tenant_pattern, 1)

          alias_function_end = "    return normalized\n\n\ndef validate_remote_resource_id("
