name: Release Acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/release-acceptance.yml
      - pg_llm_batch/**
      - tests/**
      - docs/**
      - docker/**
      - AGENTS.md
      - ARCHITECTURE.md
      - CHANGELOG.md
      - CLAUDE.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - README.md
      - SECURITY.md
      - pyproject.toml
      - uv.lock
      - LICENSE
      - NOTICE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-source:
    name: Resolve exact acceptance source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_commit: ${{ steps.resolve.outputs.source_commit }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Resolve exact source commit
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              source_commit="$PR_HEAD"
              ;;
            workflow_dispatch)
              if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
                echo "manual release acceptance requires refs/heads/main" >&2
                exit 1
              fi
              live_ref_json="$(mktemp "${RUNNER_TEMP}/pg-llm-batch-live-main.XXXXXX.json")"
              trap 'rm -f "$live_ref_json"' EXIT
              curl --fail --silent --show-error \
                --connect-timeout 10 \
                --max-time 30 \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --output "$live_ref_json" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main"
              live_main="$(
                python -c 'import json, sys; print(json.load(sys.stdin).get("object", {}).get("sha", ""))' \
                  < "$live_ref_json"
              )"
              rm -f "$live_ref_json"
              trap - EXIT
              if [[ "$live_main" != "$GITHUB_SHA" ]]; then
                echo "protected main moved before release acceptance" >&2
                exit 1
              fi
              source_commit="$GITHUB_SHA"
              ;;
            *)
              echo "invalid release-acceptance source commit" >&2
              exit 1
              ;;
          esac
          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid release-acceptance source commit" >&2
            exit 1
          fi
          printf 'source_commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"

  reproducible-distributions:
    name: Reproducible wheel and sdist
    needs: resolve-source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout exact pull request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout exact protected-main source
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-source.outputs.source_commit }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          prune-cache: true

      - name: Install locked verification dependencies
        run: uv sync --locked

      - name: Derive exact-source reproducibility environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.resolve-source.outputs.source_commit }}"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          case "$source_date_epoch" in
            ''|*[!0-9]*) echo "invalid exact-head commit timestamp" >&2; exit 1 ;;
          esac
          {
            echo "SOURCE_DATE_EPOCH=$source_date_epoch"
            echo "PYTHONHASHSEED=0"
            echo "TZ=UTC"
            echo "LC_ALL=C.UTF-8"
          } >> "$GITHUB_ENV"

      - name: Materialize two clean exact-head source trees
        shell: bash
        run: |
          set -euo pipefail
          mkdir source-first source-second
          git archive --format=tar HEAD | tar -xf - -C source-first
          git archive --format=tar HEAD | tar -xf - -C source-second

      - name: Build first distribution set
        shell: bash
        run: |
          set -euo pipefail
          uv build --no-sources --out-dir dist-first --no-create-gitignore source-first

      - name: Build second distribution set
        shell: bash
        run: |
          set -euo pipefail
          uv build --no-sources --out-dir dist-second --no-create-gitignore source-second

      - name: Verify artifact identity and write bounded evidence
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.resolve-source.outputs.source_commit }}
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          from pg_llm_batch.release_evidence import (
              verify_reproducible_release,
              write_release_manifest,
          )

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          manifest = verify_reproducible_release(
              "dist-first",
              "dist-second",
              distribution_name=project["name"],
              version=project["version"],
              source_commit=os.environ["SOURCE_COMMIT"],
              source_date_epoch=int(os.environ["SOURCE_DATE_EPOCH"]),
          )
          write_release_manifest(manifest, "release-evidence/release-manifest.json")
          PY

      - name: Reconfirm protected main remained exact
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.resolve-source.outputs.source_commit }}
        run: |
          set -euo pipefail
          live_ref_json="$(mktemp "${RUNNER_TEMP}/pg-llm-batch-live-main.XXXXXX.json")"
          trap 'rm -f "$live_ref_json"' EXIT
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$live_ref_json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main"
          live_main="$(
            python -c 'import json, sys; print(json.load(sys.stdin).get("object", {}).get("sha", ""))' \
              < "$live_ref_json"
          )"
          rm -f "$live_ref_json"
          trap - EXIT
          if [[ "$live_main" != "$SOURCE_COMMIT" ]]; then
            echo "protected main moved during release acceptance" >&2
            exit 1
          fi

      - name: Preserve bounded release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ needs.resolve-source.outputs.source_commit }}
          path: release-evidence/release-manifest.json
          if-no-files-found: error
          retention-days: 14
