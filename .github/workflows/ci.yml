name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          prune-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run unit tests
        run: uv run pytest -q -m "not integration"

  quality-gates:
    name: Coverage, docstrings, lint, and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          prune-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Compile source
        run: uv run python -m compileall -q pg_llm_batch
      - name: Lint
        run: uv run ruff check pg_llm_batch tests
      - name: Enforce docstring coverage
        run: uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
      - name: Enforce line coverage
        run: >-
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration"
          --cov=pg_llm_batch --cov-report=term-missing --cov-fail-under=100
      - name: Verify lockfile freshness
        run: uv lock --check
      - name: Build distribution artifacts without workspace sources
        run: uv build --no-sources

  container-builds:
    name: Container builds and PostgreSQL runtime smokes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Validate Compose configuration
        run: docker compose config >/dev/null
      - name: Build component image
        run: docker build --tag pg-llm-batch:ci .
      - name: Build PostgreSQL image
        run: docker build --tag pg-llm-batch-postgres:ci docker/postgres
      - name: Verify PostgreSQL container log routing
        run: bash tests/smoke_postgres_container_logging.sh
      - name: Run legacy SQL cleanup integration smoke
        run: bash tests/smoke_legacy_sql_cleanup.sh
      - name: Set up Python 3.10 for candidate parity
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Create Python 3.10 candidate environment
        run: python -m venv /tmp/pg8000-candidate-py310
      - name: Set up Python 3.12 for candidate parity
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Create Python 3.12 candidate environment
        run: python -m venv /tmp/pg8000-candidate-py312
      - name: Set up Python 3.14 for candidate parity
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Create Python 3.14 candidate environment
        run: python -m venv /tmp/pg8000-candidate-py314
      - name: Set up uv for candidate parity
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          prune-cache: true
      - name: Install locked project dependencies
        shell: bash
        run: |
          uv sync --locked
          for environment in \
            /tmp/pg8000-candidate-py310 \
            /tmp/pg8000-candidate-py312 \
            /tmp/pg8000-candidate-py314; do
            UV_PROJECT_ENVIRONMENT="$environment" \
              uv sync --locked --no-dev --no-install-project \
              --python "$environment/bin/python"
          done
      - name: Build exact pg-llm-batch wheel for candidate parity
        shell: bash
        run: |
          mkdir -p /tmp/pg-llm-batch-candidate-wheel
          uv build --wheel --no-sources --out-dir /tmp/pg-llm-batch-candidate-wheel
          mapfile -t product_wheels < <(
            find /tmp/pg-llm-batch-candidate-wheel -maxdepth 1 -type f \
              -name 'pg_llm_batch-*.whl' -print
          )
          test "${#product_wheels[@]}" -eq 1
          echo "PG_LLM_BATCH_CANDIDATE_WHEEL=${product_wheels[0]}" >> "$GITHUB_ENV"
      - name: Download exact pg8000 candidate dependency closure
        run: >-
          python -m pip download --no-deps --only-binary=:all:
          --dest /tmp/pg8000-candidate
          pg8000==1.31.5
          python-dateutil==2.9.0.post0
          scramp==1.4.17
          asn1crypto==1.5.1
          six==1.17.0
      - name: Verify pg8000 candidate dependency digests
        shell: bash
        run: |
          cat <<'EOF' | sha256sum --check --strict
          0af2c1926b153307639868d2ee5cef6cd3a7d07448e12736989b10e1d491e201  /tmp/pg8000-candidate/pg8000-1.31.5-py3-none-any.whl
          a8b2bc7bffae282281c8140a97d3aa9c14da0b136dfe83f850eea9a5f7470427  /tmp/pg8000-candidate/python_dateutil-2.9.0.post0-py2.py3-none-any.whl
          a4e3fd2e8169461a28a13777a166d3da94274454f0714a7d3023fee124474ac8  /tmp/pg8000-candidate/scramp-1.4.17-py3-none-any.whl
          db4e40728b728508912cbb3d44f19ce188f218e9eba635821bb4b68564f8fd67  /tmp/pg8000-candidate/asn1crypto-1.5.1-py2.py3-none-any.whl
          4721f391ed90541fddacab5acf947aa0d3dc7d27b2e1e8eda2be8970586c3274  /tmp/pg8000-candidate/six-1.17.0-py2.py3-none-any.whl
          EOF
      - name: Download exact pg8000 candidate source distribution
        shell: bash
        run: |
          mkdir -p /tmp/pg8000-candidate-source
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output /tmp/pg8000-candidate-source/pg8000-1.31.5.tar.gz \
            https://files.pythonhosted.org/packages/c8/9a/077ab21e700051e03d8c5232b6bcb9a1a4d4b6242c9a0226df2cfa306414/pg8000-1.31.5.tar.gz
      - name: Verify pg8000 candidate source digest
        run: >-
          echo "46ebb03be52b7a77c03c725c79da2ca281d6e8f59577ca66b17c9009618cae78  /tmp/pg8000-candidate-source/pg8000-1.31.5.tar.gz"
          | sha256sum --check --strict
      - name: Verify pg8000 candidate source-wheel parity
        run: >-
          python tools/verify_candidate_source_wheel_parity.py
          /tmp/pg8000-candidate-source/pg8000-1.31.5.tar.gz
          /tmp/pg8000-candidate/pg8000-1.31.5-py3-none-any.whl
      - name: Verify pg8000 candidate dependency licenses
        run: python tools/verify_candidate_wheel_licenses.py /tmp/pg8000-candidate
      - name: Install exact candidate closure into release Python environments
        shell: bash
        run: |
          for interpreter in \
            /tmp/pg8000-candidate-py310/bin/python \
            /tmp/pg8000-candidate-py312/bin/python \
            /tmp/pg8000-candidate-py314/bin/python; do
            uv pip install --python "$interpreter" --no-deps \
              /tmp/pg8000-candidate/pg8000-1.31.5-py3-none-any.whl \
              /tmp/pg8000-candidate/python_dateutil-2.9.0.post0-py2.py3-none-any.whl \
              /tmp/pg8000-candidate/scramp-1.4.17-py3-none-any.whl \
              /tmp/pg8000-candidate/asn1crypto-1.5.1-py2.py3-none-any.whl \
              /tmp/pg8000-candidate/six-1.17.0-py2.py3-none-any.whl
          done
      - name: Install exact pg-llm-batch wheel into candidate environments
        shell: bash
        run: |
          test -f "$PG_LLM_BATCH_CANDIDATE_WHEEL"
          uv pip install --python "/tmp/pg8000-candidate-py310/bin/python" --no-deps \
            "$PG_LLM_BATCH_CANDIDATE_WHEEL"
          uv pip install --python "/tmp/pg8000-candidate-py312/bin/python" --no-deps \
            "$PG_LLM_BATCH_CANDIDATE_WHEEL"
          uv pip install --python "/tmp/pg8000-candidate-py314/bin/python" --no-deps \
            "$PG_LLM_BATCH_CANDIDATE_WHEEL"
      - name: Verify pg8000 candidate Python 3.10 environment
        run: uv pip check --python /tmp/pg8000-candidate-py310/bin/python
      - name: Verify pg8000 candidate Python 3.12 environment
        run: uv pip check --python /tmp/pg8000-candidate-py312/bin/python
      - name: Verify pg8000 candidate Python 3.14 environment
        run: uv pip check --python /tmp/pg8000-candidate-py314/bin/python
      - name: Start candidate PostgreSQL runtime
        shell: bash
        run: |
          candidate_password="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$candidate_password"
          host_password_file="$(mktemp "${RUNNER_TEMP:?}/pg8000-host-password.XXXXXX")"
          container_password_file="$(mktemp "${RUNNER_TEMP:?}/pg8000-container-password.XXXXXX")"
          printf '%s' "$candidate_password" > "$host_password_file"
          printf '%s' "$candidate_password" > "$container_password_file"
          chmod 600 "$host_password_file" "$container_password_file"
          runner_uid="$(id -u)"
          postgres_runtime_uid="$(docker run --rm --entrypoint id pg-llm-batch-postgres:ci -u)"
          test -n "$postgres_runtime_uid"
          sudo chown "$postgres_runtime_uid" "$container_password_file"
          test "$(stat -c '%a' "$host_password_file")" = "600"
          test "$(stat -c '%a' "$container_password_file")" = "600"
          test "$(stat -c '%u' "$host_password_file")" = "$runner_uid"
          test "$(stat -c '%u' "$container_password_file")" = "$postgres_runtime_uid"
          container="pg-llm-batch-pg8000-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "PG8000_CANDIDATE_PASSWORD_FILE=$host_password_file" >> "$GITHUB_ENV"
          echo "PG8000_CANDIDATE_CONTAINER_PASSWORD_FILE=$container_password_file" >> "$GITHUB_ENV"
          echo "PG8000_CANDIDATE_CONTAINER=$container" >> "$GITHUB_ENV"
          docker run --detach --name "$container" \
            --publish 127.0.0.1:5432:5432 \
            --mount "type=bind,source=$container_password_file,target=/run/secrets/postgres_password,readonly" \
            --env POSTGRES_USER=pgllm \
            --env POSTGRES_DB=pgllm \
            --env POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password \
            pg-llm-batch-postgres:ci
      - name: Wait for candidate PostgreSQL health contract
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            if docker exec "$PG8000_CANDIDATE_CONTAINER" \
              pg_isready -U pgllm -d pgllm >/dev/null 2>&1; then
              ready="$(docker exec "$PG8000_CANDIDATE_CONTAINER" \
                psql -U pgllm -d pgllm -tAc \
                "SELECT bool_and(is_ready) FROM pg_llm_batch_health_check() WHERE component IN ('database','com_config')" \
                2>/dev/null || true)"
              if [ "$ready" = "t" ]; then
                exit 0
              fi
            fi
            sleep 2
          done
          docker logs "$PG8000_CANDIDATE_CONTAINER"
          exit 1
      - name: Run real pg8000 candidate PostgreSQL smoke on Python 3.10
        run: cd "$RUNNER_TEMP" && /tmp/pg8000-candidate-py310/bin/python "$GITHUB_WORKSPACE/tests/smoke_pg8000_candidate_postgres.py"
      - name: Run real pg8000 candidate PostgreSQL smoke on Python 3.12
        run: cd "$RUNNER_TEMP" && /tmp/pg8000-candidate-py312/bin/python "$GITHUB_WORKSPACE/tests/smoke_pg8000_candidate_postgres.py"
      - name: Run real pg8000 candidate PostgreSQL smoke on Python 3.14
        run: cd "$RUNNER_TEMP" && /tmp/pg8000-candidate-py314/bin/python "$GITHUB_WORKSPACE/tests/smoke_pg8000_candidate_postgres.py"
      - name: Tear down candidate PostgreSQL runtime
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${PG8000_CANDIDATE_CONTAINER:-}" ]; then
            docker rm --force "$PG8000_CANDIDATE_CONTAINER" >/dev/null 2>&1 || true
          fi
          if [ -n "${PG8000_CANDIDATE_PASSWORD_FILE:-}" ]; then
            rm -f "$PG8000_CANDIDATE_PASSWORD_FILE"
          fi
          if [ -n "${PG8000_CANDIDATE_CONTAINER_PASSWORD_FILE:-}" ]; then
            sudo rm -f "$PG8000_CANDIDATE_CONTAINER_PASSWORD_FILE"
          fi
