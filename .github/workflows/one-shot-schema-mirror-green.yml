name: One-shot schema mirror green verification

on:
  push:
    branches: [agent/persist-remote-batch-lifecycle]
    paths:
      - .github/workflows/one-shot-schema-mirror-green.yml

permissions:
  contents: write

concurrency:
  group: one-shot-schema-mirror-green
  cancel-in-progress: true

jobs:
  verify-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout lifecycle branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/persist-remote-batch-lifecycle
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true
      - name: Generate exact build-context schema mirror
        run: |
          set -euo pipefail
          {
            cat <<'HEADER'
          -- SPDX-License-Identifier: Apache-2.0
          -- Build-context mirror of pg_llm_batch/schema.sql (canonical source read by
          -- pg_llm_batch/db.py). Kept here so docker/postgres/Dockerfile builds with its
          -- own directory as the build context (the central coverage-evidence job builds
          -- each changed Dockerfile with context = its own directory). Keep in sync with
          -- pg_llm_batch/schema.sql.
          HEADER
            cat pg_llm_batch/schema.sql
          } > docker/postgres/init/02_schema.sql
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify mirror and complete quality gates
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/test_schema_integrity.py::test_postgres_image_schema_is_an_exact_canonical_mirror
          uv run pytest -q -m "not integration"
          uv run python -m compileall -q pg_llm_batch
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-report=term-missing --cov-fail-under=100
          uv lock --check
          uv build --no-sources
          git diff --check
      - name: Verify container definitions
        run: |
          set -euo pipefail
          docker compose config >/dev/null
          docker build --tag pg-llm-batch:schema-mirror .
          docker build --tag pg-llm-batch-postgres:schema-mirror docker/postgres
      - name: Record mirror evidence and remove one-shot workflow
        env:
          BRANCH_NAME: agent/persist-remote-batch-lifecycle
          VERIFIED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat > docs/superpowers/evidence/2026-08-04-postgres-schema-mirror-green.md <<EOF
          # PostgreSQL Image Schema Mirror Green Evidence

          Verified pre-evidence head: \`${VERIFIED_HEAD}\`.

          The Docker PostgreSQL initialization schema was regenerated as the fixed build-context header followed by the complete packaged canonical schema. The permanent exact-mirror test, full non-integration suite, 100% production statement/branch/docstring gates, package build, Compose validation, and both container builds passed before this evidence was published.
          EOF
          rm .github/workflows/one-shot-schema-mirror-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docker/postgres/init/02_schema.sql \
            docs/superpowers/evidence/2026-08-04-postgres-schema-mirror-green.md \
            .github/workflows/one-shot-schema-mirror-green.yml
          git commit -m "fix(schema): synchronize PostgreSQL image initialization"
          git push origin "HEAD:${BRANCH_NAME}"
