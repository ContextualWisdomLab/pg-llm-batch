name: One-shot atomic tenant RLS migration

on:
  push:
    branches:
      - agent/tenant-scoped-lifecycle
    paths:
      - .github/workflows/one-shot-atomic-tenant-rls-migration.yml

permissions:
  contents: read

concurrency:
  group: one-shot-atomic-tenant-rls-migration
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/pg-llm-batch'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Refuse stale or competing state
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_PARENT: fe7fcb09d1a42fd2ef54f8824d135905f53c9900
          EXPECTED_BASE: f0c5f79c5327a090014dd5558750110fce9fd2ac
          BRANCH_NAME: agent/tenant-scoped-lifecycle
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/$BRANCH_NAME | cut -f1)" = "$GITHUB_SHA"
          mapfile -t writers < <(find .github/workflows -maxdepth 1 -type f \
            \( -name '*one-shot*.yml' -o -name '*repair*.yml' \) -print | sort)
          test "${#writers[@]}" -eq 1
          test "${writers[0]}" = ".github/workflows/one-shot-atomic-tenant-rls-migration.yml"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Apply atomic migration
        run: python scripts/ci/apply_atomic_tenant_rls_migration.py

      - name: Verify focused schema contracts
        run: |
          uv run pytest -q \
            tests/test_tenant_lifecycle_schema.py \
            tests/test_schema_integrity.py \
            tests/test_tenant_lifecycle_persistence.py

      - name: Verify complete quality contract
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          uv run python -m compileall -q pg_llm_batch tests
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-branch --cov-report=term-missing \
            --cov-fail-under=100
          uv lock --check
          rm -rf build dist
          uv build --no-sources
          docker compose config >/dev/null
          docker build --tag pg-llm-batch:tenant-rls-verify .
          docker build --tag pg-llm-batch-postgres:tenant-rls-verify docker/postgres

      - name: Remove temporary automation and record evidence
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          rm .github/workflows/one-shot-atomic-tenant-rls-migration.yml
          rm scripts/ci/apply_atomic_tenant_rls_migration.py
          rm -rf .coverage .coverage.* htmlcov build dist
          mkdir -p docs/superpowers/evidence
          printf '%s\n' \
            '# Atomic Tenant RLS Migration Evidence' \
            '' \
            '- RED head: `e4d44690cba4659f8e7af8b1eaebde4eba4e56eb`.' \
            '- The RED run failed only the owner-transition regression.' \
            '- One PostgreSQL anonymous block now restores FORCE RLS atomically.' \
            '- Focused and complete quality, package, Compose, and image gates passed.' \
            '- Temporary write-capable automation removed itself.' \
            > docs/superpowers/evidence/2026-08-05-atomic-tenant-rls-migration.md
          test ! -e .github/workflows/one-shot-atomic-tenant-rls-migration.yml
          test ! -e scripts/ci/apply_atomic_tenant_rls_migration.py
          cmp -s pg_llm_batch/schema.sql docker/postgres/init/02_schema.sql
          git diff --check

      - name: Publish verified repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          BRANCH_NAME: agent/tenant-scoped-lifecycle
          EXPECTED_HEAD: ${{ github.sha }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/$BRANCH_NAME | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix(schema): make tenant RLS migration atomic"
          git push --force-with-lease="refs/heads/${BRANCH_NAME}:${EXPECTED_HEAD}" \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${BRANCH_NAME}"
