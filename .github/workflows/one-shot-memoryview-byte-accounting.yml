name: One-shot memoryview byte accounting

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/one-shot-memoryview-byte-accounting.yml
      - pg_llm_batch/batch_api_client.py
      - tests/test_bounded_memoryview_contract.py

concurrency:
  group: one-shot-memoryview-byte-accounting-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  red-green-verify-publish:
    if: >-
      github.repository == 'ContextualWisdomLab/pg-llm-batch' &&
      github.actor == 'seonghobae' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/bounded-control-plane-json'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Install exact locked dependencies
        run: uv sync --locked

      - name: Verify exact RED contract
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PARENT_SHA: d7f39ca83aa82483d9b052bf34fe671e8be2d77d
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          set +e
          red_output="$(
            uv run pytest -q \
              tests/test_bounded_memoryview_contract.py::test_memoryview_limit_uses_nbytes_not_element_count \
              2>&1
          )"
          red_status=$?
          set -e
          printf '%s\n' "$red_output"
          test "$red_status" -ne 0
          printf '%s\n' "$red_output" | grep -F "DID NOT RAISE"

      - name: Implement byte-accurate memoryview accounting
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -I - <<'PY'
          from pathlib import Path

          path = Path("pg_llm_batch/batch_api_client.py")
          source = path.read_text(encoding="utf-8")
          old = "\n".join(
              [
                  "        async for chunk in iterator(DOWNLOAD_CHUNK_BYTES):",
                  "            if not isinstance(chunk, (bytes, bytearray, memoryview)):",
                  "                raise GatewayError(",
                  '                    f"{operation} response yielded a non-byte stream chunk",',
                  '                    status_code=getattr(response, "status", None),',
                  '                    response_data={"error_type": "InvalidByteChunk"},',
                  "                )",
                  "            if len(payload) + len(chunk) > max_bytes:",
                  "                raise self._download_limit_error(",
                  "                    response,",
                  "                    operation,",
                  "                    max_bytes=max_bytes,",
                  "                    declared_bytes=declared_bytes,",
                  "                    bytes_read=len(payload),",
                  "                )",
                  "            payload.extend(chunk)",
              ]
          ) + "\n"
          new = "\n".join(
              [
                  "        async for chunk in iterator(DOWNLOAD_CHUNK_BYTES):",
                  "            if isinstance(chunk, memoryview):",
                  "                chunk_bytes = chunk.nbytes",
                  "            elif isinstance(chunk, (bytes, bytearray)):",
                  "                chunk_bytes = len(chunk)",
                  "            else:",
                  "                raise GatewayError(",
                  '                    f"{operation} response yielded a non-byte stream chunk",',
                  '                    status_code=getattr(response, "status", None),',
                  '                    response_data={"error_type": "InvalidByteChunk"},',
                  "                )",
                  "            if len(payload) + chunk_bytes > max_bytes:",
                  "                raise self._download_limit_error(",
                  "                    response,",
                  "                    operation,",
                  "                    max_bytes=max_bytes,",
                  "                    declared_bytes=declared_bytes,",
                  "                    bytes_read=len(payload),",
                  "                )",
                  "            if isinstance(chunk, memoryview):",
                  "                payload.extend(chunk.tobytes())",
                  "            else:",
                  "                payload.extend(chunk)",
              ]
          ) + "\n"
          if source.count(old) != 1:
              raise SystemExit("expected one uncorrected bounded stream loop")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          git diff --check

      - name: Verify GREEN and release gates
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          uv run pytest -q tests/test_bounded_memoryview_contract.py
          uv run pytest -q -m "not integration"
          uv run python -m compileall -q pg_llm_batch tests
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-report=term-missing --cov-fail-under=100
          uv lock --check
          rm -rf dist
          uv build --no-sources
          docker compose config >/dev/null
          docker build --tag pg-llm-batch:memoryview-accounting .
          docker build --tag pg-llm-batch-postgres:memoryview-accounting docker/postgres
          git diff --check

      - name: Publish verified implementation and remove one-shot workflow
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          PUSH_TOKEN: ${{ github.token }}
          BRANCH_NAME: agent/bounded-control-plane-json
        run: |
          rm .github/workflows/one-shot-memoryview-byte-accounting.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix(gateway): account memoryview bytes exactly"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:${BRANCH_NAME}"
