name: One-shot schema mirror red verification

on:
  push:
    branches: [agent/persist-remote-batch-lifecycle]
    paths:
      - .github/workflows/one-shot-schema-mirror-red.yml

permissions:
  contents: write

concurrency:
  group: one-shot-schema-mirror-red
  cancel-in-progress: true

jobs:
  verify-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout lifecycle branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/persist-remote-batch-lifecycle
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true
      - name: Add canonical schema mirror contract
        run: |
          cat >> tests/test_schema_integrity.py <<'PY'


          def test_postgres_image_schema_is_an_exact_canonical_mirror():
              """The deployable PostgreSQL image initializes the packaged canonical schema."""
              root = Path(__file__).resolve().parents[1]
              canonical = (root / "pg_llm_batch" / "schema.sql").read_text(
                  encoding="utf-8"
              )
              mirror = (
                  root / "docker" / "postgres" / "init" / "02_schema.sql"
              ).read_text(encoding="utf-8")
              mirror_header = (
                  "-- SPDX-License-Identifier: Apache-2.0\n"
                  "-- Build-context mirror of pg_llm_batch/schema.sql (canonical source read by\n"
                  "-- pg_llm_batch/db.py). Kept here so docker/postgres/Dockerfile builds with its\n"
                  "-- own directory as the build context (the central coverage-evidence job builds\n"
                  "-- each changed Dockerfile with context = its own directory). Keep in sync with\n"
                  "-- pg_llm_batch/schema.sql.\n"
              )
              assert mirror == mirror_header + canonical
          PY
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Prove schema mirror contract is red
        run: |
          set -euo pipefail
          set +e
          uv run pytest -q \
            tests/test_schema_integrity.py::test_postgres_image_schema_is_an_exact_canonical_mirror \
            2>&1 | tee /tmp/schema-mirror-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected stale PostgreSQL image schema mirror to fail" >&2
            exit 1
          fi
          grep -q "AssertionError" /tmp/schema-mirror-red.log
      - name: Record drift evidence and remove one-shot workflow
        env:
          BRANCH_NAME: agent/persist-remote-batch-lifecycle
          RED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat > docs/superpowers/evidence/2026-08-04-postgres-schema-mirror-red.md <<EOF
          # PostgreSQL Image Schema Mirror Red Evidence

          Pre-fix head: \`${RED_HEAD}\`.

          A permanent test compared the Docker PostgreSQL initialization schema with the packaged canonical schema and failed before the mirror was changed. The stale image schema omitted the durable lifecycle table and observation sequence as well as earlier canonical integrity migrations. A container could therefore build successfully while initializing a materially different database contract.
          EOF
          rm .github/workflows/one-shot-schema-mirror-red.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_schema_integrity.py \
            docs/superpowers/evidence/2026-08-04-postgres-schema-mirror-red.md \
            .github/workflows/one-shot-schema-mirror-red.yml
          git commit -m "test(schema): require exact PostgreSQL image mirror"
          git push origin "HEAD:${BRANCH_NAME}"
