name: One-shot remote identifier limits green verification

on:
  push:
    branches: [agent/persist-remote-batch-lifecycle]
    paths:
      - .github/workflows/one-shot-remote-identifier-limits-green.yml

permissions:
  contents: write

concurrency:
  group: one-shot-remote-identifier-limits-green
  cancel-in-progress: true

jobs:
  verify-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout lifecycle branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/persist-remote-batch-lifecycle
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true
      - name: Implement schema-aligned identifier validation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path


          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one replacement in {path}, found {count}"
                  )
              target.write_text(content.replace(old, new), encoding="utf-8")


          replace_once(
              "pg_llm_batch/db.py",
              "MAX_PROVIDER_METADATA_BYTES = 64 * 1024\n"
              "REMOTE_TERMINAL_STATUSES = frozenset({\"completed\", \"failed\", \"expired\", \"cancelled\"})\n",
              "MAX_PROVIDER_METADATA_BYTES = 64 * 1024\n"
              "REMOTE_ENDPOINT_ALIAS_MAX_CHARACTERS = 128\n"
              "REMOTE_BATCH_ID_MAX_CHARACTERS = 256\n"
              "REMOTE_TERMINAL_STATUSES = frozenset({\"completed\", \"failed\", \"expired\", \"cancelled\"})\n",
          )
          replace_once(
              "pg_llm_batch/db.py",
              '''def _provider_count(value: Any) -> int:
              """Return a non-negative integer provider count or the safe default zero."""
              return value if type(value) is int and value >= 0 else 0


          def _provider_metadata(value: Any) -> tuple[Dict[str, Any], str]:
          ''',
              '''def _provider_count(value: Any) -> int:
              """Return a non-negative integer provider count or the safe default zero."""
              return value if type(value) is int and value >= 0 else 0


          def validate_remote_endpoint_alias(value: Any) -> str:
              """Normalize one endpoint alias within the persisted schema contract."""
              if not isinstance(value, str):
                  raise ValueError(
                      "endpoint_alias must be a non-empty string of at most "
                      f"{REMOTE_ENDPOINT_ALIAS_MAX_CHARACTERS} characters"
                  )
              normalized = value.strip()
              if (
                  not normalized
                  or len(normalized) > REMOTE_ENDPOINT_ALIAS_MAX_CHARACTERS
              ):
                  raise ValueError(
                      "endpoint_alias must be a non-empty string of at most "
                      f"{REMOTE_ENDPOINT_ALIAS_MAX_CHARACTERS} characters"
                  )
              return normalized


          def validate_remote_batch_id(value: Any) -> str:
              """Return one provider batch identifier within the schema length limit."""
              if (
                  not isinstance(value, str)
                  or not value.strip()
                  or len(value) > REMOTE_BATCH_ID_MAX_CHARACTERS
              ):
                  raise ValueError(
                      "provider batch id must be a non-empty string of at most "
                      f"{REMOTE_BATCH_ID_MAX_CHARACTERS} characters"
                  )
              return value


          def _provider_metadata(value: Any) -> tuple[Dict[str, Any], str]:
          ''',
          )
          replace_once(
              "pg_llm_batch/db.py",
              '''    if not isinstance(endpoint_alias, str) or not endpoint_alias.strip():
                  raise ValueError("endpoint_alias must be a non-empty string")
              normalized_alias = endpoint_alias.strip()
          ''',
              '''    normalized_alias = validate_remote_endpoint_alias(endpoint_alias)
          ''',
          )
          replace_once(
              "pg_llm_batch/db.py",
              '''    remote_batch_id = provider_batch.get("id")
              if not isinstance(remote_batch_id, str) or not remote_batch_id:
                  raise ValueError("provider batch id must be a non-empty string")
          ''',
              '''    remote_batch_id = validate_remote_batch_id(provider_batch.get("id"))
          ''',
          )

          replace_once(
              "pg_llm_batch/durable_client.py",
              '''from .db import (
              persist_remote_batch_state,
              reserve_remote_batch_observation_order,
          )
          ''',
              '''from .db import (
              persist_remote_batch_state,
              reserve_remote_batch_observation_order,
              validate_remote_batch_id,
              validate_remote_endpoint_alias,
          )
          ''',
          )
          replace_once(
              "pg_llm_batch/durable_client.py",
              '''    async def _persist_snapshot(
              self,
              endpoint_alias: str,
              provider_batch: Mapping[str, Any],
              observation_order: int,
              *,
              operation: str,
          ) -> None:
              """Persist one ordered observation or raise recovery-oriented evidence."""
              try:
                  await asyncio.to_thread(
                      self._lifecycle_recorder,
                      self.postgres_dsn,
                      endpoint_alias,
                      provider_batch,
                      observation_order,
                  )
              except Exception as exc:
                  batch_id = provider_batch.get("id")
                  raise GatewayError(
                      f"{operation} succeeded but lifecycle persistence failed",
                      response_data={
                          "operation": operation,
                          "phase": "persistence",
                          "endpoint_alias": endpoint_alias,
                          "batch_id": batch_id,
                          "observation_order": observation_order,
                          "error_type": type(exc).__name__,
                      },
                  ) from exc
          ''',
              '''    async def _persist_snapshot(
              self,
              endpoint_alias: str,
              provider_batch: Mapping[str, Any],
              observation_order: int,
              *,
              operation: str,
          ) -> None:
              """Persist one ordered observation or raise recovery-oriented evidence."""
              batch_id: Any = None
              try:
                  batch_id = provider_batch.get("id")
                  validated_batch_id = validate_remote_batch_id(batch_id)
                  normalized_snapshot = dict(provider_batch)
                  normalized_snapshot["id"] = validated_batch_id
                  await asyncio.to_thread(
                      self._lifecycle_recorder,
                      self.postgres_dsn,
                      endpoint_alias,
                      normalized_snapshot,
                      observation_order,
                  )
              except Exception as exc:
                  raise GatewayError(
                      f"{operation} succeeded but lifecycle persistence failed",
                      response_data={
                          "operation": operation,
                          "phase": "persistence",
                          "endpoint_alias": endpoint_alias,
                          "batch_id": batch_id,
                          "observation_order": observation_order,
                          "error_type": type(exc).__name__,
                      },
                  ) from exc
          ''',
          )
          replace_once(
              "pg_llm_batch/durable_client.py",
              '''    async def create_batch_job(
              self,
              input_file_id: str,
              endpoint_alias: str,
              endpoint: str = "/v1/chat/completions",
              metadata: Optional[Dict[str, Any]] = None,
          ) -> Dict[str, Any]:
              """Reserve order, create a remote job, and persist its initial state."""
              observation_order = await self._reserve_observation_order(
                  endpoint_alias,
                  operation="Batch creation",
                  batch_id=None,
              )
              result = await super().create_batch_job(
                  input_file_id,
                  endpoint_alias,
                  endpoint=endpoint,
                  metadata=metadata,
              )
              snapshot = dict(result)
              snapshot.setdefault("input_file_id", input_file_id)
              snapshot.setdefault("endpoint", endpoint)
              if metadata is not None:
                  snapshot.setdefault("metadata", metadata)
              await self._persist_snapshot(
                  endpoint_alias,
                  snapshot,
                  observation_order,
                  operation="Batch creation",
              )
              return result
          ''',
              '''    async def create_batch_job(
              self,
              input_file_id: str,
              endpoint_alias: str,
              endpoint: str = "/v1/chat/completions",
              metadata: Optional[Dict[str, Any]] = None,
          ) -> Dict[str, Any]:
              """Reserve order, create a remote job, and persist its initial state."""
              normalized_alias = validate_remote_endpoint_alias(endpoint_alias)
              observation_order = await self._reserve_observation_order(
                  normalized_alias,
                  operation="Batch creation",
                  batch_id=None,
              )
              result = await super().create_batch_job(
                  input_file_id,
                  normalized_alias,
                  endpoint=endpoint,
                  metadata=metadata,
              )
              snapshot = dict(result)
              snapshot.setdefault("input_file_id", input_file_id)
              snapshot.setdefault("endpoint", endpoint)
              if metadata is not None:
                  snapshot.setdefault("metadata", metadata)
              await self._persist_snapshot(
                  normalized_alias,
                  snapshot,
                  observation_order,
                  operation="Batch creation",
              )
              return result
          ''',
          )
          replace_once(
              "pg_llm_batch/durable_client.py",
              '''    async def get_batch_status(
              self, batch_id: str, endpoint_alias: str
          ) -> Dict[str, Any]:
              """Reserve order, poll a remote job, and persist the observation."""
              observation_order = await self._reserve_observation_order(
                  endpoint_alias,
                  operation="Batch status",
                  batch_id=batch_id,
              )
              result = await super().get_batch_status(batch_id, endpoint_alias)
              snapshot = dict(result)
              snapshot.setdefault("id", batch_id)
              await self._persist_snapshot(
                  endpoint_alias,
                  snapshot,
                  observation_order,
                  operation="Batch status",
              )
              return result
          ''',
              '''    async def get_batch_status(
              self, batch_id: str, endpoint_alias: str
          ) -> Dict[str, Any]:
              """Reserve order, poll a remote job, and persist the observation."""
              normalized_alias = validate_remote_endpoint_alias(endpoint_alias)
              observation_order = await self._reserve_observation_order(
                  normalized_alias,
                  operation="Batch status",
                  batch_id=batch_id,
              )
              result = await super().get_batch_status(batch_id, normalized_alias)
              snapshot = dict(result)
              snapshot.setdefault("id", batch_id)
              await self._persist_snapshot(
                  normalized_alias,
                  snapshot,
                  observation_order,
                  operation="Batch status",
              )
              return result
          ''',
          )
          replace_once(
              "pg_llm_batch/durable_client.py",
              '''    async def cancel_batch(
              self, batch_id: str, endpoint_alias: str
          ) -> Dict[str, Any]:
              """Reserve order, cancel remotely, and persist accepted cancellation."""
              observation_order = await self._reserve_observation_order(
                  endpoint_alias,
                  operation="Batch cancellation",
                  batch_id=batch_id,
              )
              result = await super().cancel_batch(batch_id, endpoint_alias)
              if result.get("success"):
                  snapshot = {
                      "id": batch_id,
                      "status": result.get("status", "cancelling"),
                  }
                  await self._persist_snapshot(
                      endpoint_alias,
                      snapshot,
                      observation_order,
                      operation="Batch cancellation",
                  )
              return result
          ''',
              '''    async def cancel_batch(
              self, batch_id: str, endpoint_alias: str
          ) -> Dict[str, Any]:
              """Reserve order, cancel remotely, and persist accepted cancellation."""
              normalized_alias = validate_remote_endpoint_alias(endpoint_alias)
              observation_order = await self._reserve_observation_order(
                  normalized_alias,
                  operation="Batch cancellation",
                  batch_id=batch_id,
              )
              result = await super().cancel_batch(batch_id, normalized_alias)
              if result.get("success"):
                  snapshot = {
                      "id": batch_id,
                      "status": result.get("status", "cancelling"),
                  }
                  await self._persist_snapshot(
                      normalized_alias,
                      snapshot,
                      observation_order,
                      operation="Batch cancellation",
                  )
              return result
          ''',
          )

          replace_once(
              "docs/remote-batch-lifecycle.md",
              '''The table is a mutable current-state projection, not append-only audit history.
          ''',
              '''Endpoint aliases are trimmed and limited to 128 characters before order
          reservation, credential resolution, or provider I/O. Provider batch identifiers
          are limited to 256 characters before any lifecycle recorder receives them. These
          application checks mirror the PostgreSQL `CHECK` constraints so avoidable schema
          failures do not occur after a remote side effect.

          The table is a mutable current-state projection, not append-only audit history.
          ''',
          )
          replace_once(
              "CHANGELOG.md",
              '''### Fixed

          - Prevented sparse newer remote lifecycle observations from reducing previously
          ''',
              '''### Fixed

          - Enforced the PostgreSQL lifecycle schema's 128-character endpoint-alias and
            256-character remote-batch identifier limits in application code, including
            pre-reservation alias validation and validation before custom recorders run.
          - Prevented sparse newer remote lifecycle observations from reducing previously
          ''',
          )

          Path("tests/test_remote_identifier_limits.py").write_text(
              '''# SPDX-License-Identifier: Apache-2.0
          """Boundary tests for durable remote lifecycle identifiers."""

          from __future__ import annotations

          from typing import Any

          import pytest

          from pg_llm_batch import db
          from pg_llm_batch.batch_api_client import GatewayCredentials
          from pg_llm_batch.durable_client import DurableBatchAPIClient
          from pg_llm_batch.exceptions import GatewayError


          class _Cursor:
              """Capture SQL executions for identifier-boundary tests."""

              def __init__(self, driver: "_Psycopg") -> None:
                  self.driver = driver

              def __enter__(self) -> "_Cursor":
                  return self

              def __exit__(self, *_exc: Any) -> None:
                  return None

              def execute(self, sql: str, params: Any = None) -> None:
                  """Record one SQL statement and its bound parameters."""
                  self.driver.executions.append((sql, params))


          class _Connection:
              """Expose the connection surface required by the persistence helper."""

              def __init__(self, driver: "_Psycopg") -> None:
                  self.driver = driver

              def __enter__(self) -> "_Connection":
                  return self

              def __exit__(self, *_exc: Any) -> None:
                  return None

              def cursor(self) -> _Cursor:
                  """Return the recording cursor."""
                  return _Cursor(self.driver)

              def commit(self) -> None:
                  """Record a successful explicit commit."""
                  self.driver.commits += 1


          class _Psycopg:
              """Minimal psycopg replacement for boundary validation tests."""

              def __init__(self) -> None:
                  self.executions: list[tuple[str, Any]] = []
                  self.connections: list[str] = []
                  self.commits = 0

              def connect(self, dsn: str) -> _Connection:
                  """Return a fake connection and retain the supplied DSN."""
                  self.connections.append(dsn)
                  return _Connection(self)


          class _Response:
              """Async create response carrying a configurable provider batch id."""

              def __init__(self, batch_id: str) -> None:
                  self.status = 201
                  self.headers: dict[str, str] = {}
                  self.batch_id = batch_id

              async def json(self) -> dict[str, str]:
                  """Return the configured successful provider response."""
                  return {"id": self.batch_id, "status": "validating"}

              async def __aenter__(self) -> "_Response":
                  return self

              async def __aexit__(self, *_exc: Any) -> None:
                  return None


          class _Session:
              """Record provider POSTs and return one configured response."""

              def __init__(self, calls: list[str], batch_id: str = "batch-1") -> None:
                  self.calls = calls
                  self.batch_id = batch_id

              def post(self, _url: str, **_kwargs: Any) -> _Response:
                  """Record provider I/O and return the canned create response."""
                  self.calls.append("provider")
                  return _Response(self.batch_id)


          def _credentials(_alias: str) -> GatewayCredentials:
              """Return deterministic HTTPS gateway credentials."""
              return GatewayCredentials(
                  url="https://gateway.example/v1",
                  api_key="secret",
              )


          def test_persistence_accepts_identifier_length_boundaries(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              """Values at both schema maxima remain valid and persistable."""
              driver = _Psycopg()
              monkeypatch.setattr(db, "psycopg", driver)

              snapshot = db.persist_remote_batch_state(
                  "postgresql://x",
                  "a" * 128,
                  {"id": "b" * 256},
                  observation_order=1,
              )

              assert snapshot["endpoint_alias"] == "a" * 128
              assert snapshot["remote_batch_id"] == "b" * 256
              assert driver.connections == ["postgresql://x"]
              assert driver.commits == 1


          @pytest.mark.parametrize(
              ("endpoint_alias", "remote_batch_id", "message"),
              [
                  ("a" * 129, "batch-1", "endpoint_alias"),
                  ("primary", "b" * 257, "provider batch id"),
              ],
          )
          def test_persistence_rejects_overlong_schema_identifiers_before_connect(
              monkeypatch: pytest.MonkeyPatch,
              endpoint_alias: str,
              remote_batch_id: str,
              message: str,
          ) -> None:
              """Over-limit identities fail before opening a database connection."""
              driver = _Psycopg()
              monkeypatch.setattr(db, "psycopg", driver)

              with pytest.raises(ValueError, match=message):
                  db.persist_remote_batch_state(
                      "postgresql://x",
                      endpoint_alias,
                      {"id": remote_batch_id},
                      observation_order=1,
                  )

              assert driver.connections == []
              assert driver.executions == []


          async def test_durable_client_rejects_overlong_alias_before_side_effects() -> None:
              """An invalid alias reaches neither reservation nor provider I/O."""
              calls: list[str] = []

              def reserve(_dsn: str) -> int:
                  calls.append("reserve")
                  return 1

              client = DurableBatchAPIClient(
                  "postgresql://x",
                  _credentials,
                  observation_reserver=reserve,
                  lifecycle_recorder=lambda *_args: None,
              )
              client._session = _Session(calls)

              with pytest.raises(ValueError, match="endpoint_alias"):
                  await client.create_batch_job("file-1", "a" * 129)

              assert calls == []


          async def test_durable_client_normalizes_alias_for_provider_and_recorder() -> None:
              """One normalized alias crosses credential and persistence boundaries."""
              provider_aliases: list[str] = []
              recorded_aliases: list[str] = []
              calls: list[str] = []

              def credentials(alias: str) -> GatewayCredentials:
                  provider_aliases.append(alias)
                  return _credentials(alias)

              def recorder(
                  _dsn: str,
                  alias: str,
                  _payload: Any,
                  _order: int,
              ) -> None:
                  recorded_aliases.append(alias)

              client = DurableBatchAPIClient(
                  "postgresql://x",
                  credentials,
                  observation_reserver=lambda _dsn: 2,
                  lifecycle_recorder=recorder,
              )
              client._session = _Session(calls)

              await client.create_batch_job("file-1", "  primary  ")

              assert provider_aliases == ["primary"]
              assert recorded_aliases == ["primary"]
              assert calls == ["provider"]


          async def test_overlong_provider_id_is_rejected_before_custom_recorder() -> None:
              """A gateway cannot bypass the schema limit through an injected recorder."""
              recorder_calls: list[Any] = []
              provider_calls: list[str] = []
              overlong_id = "b" * 257
              client = DurableBatchAPIClient(
                  "postgresql://x",
                  _credentials,
                  observation_reserver=lambda _dsn: 3,
                  lifecycle_recorder=lambda *_args: recorder_calls.append(_args),
              )
              client._session = _Session(provider_calls, batch_id=overlong_id)

              with pytest.raises(GatewayError) as exc_info:
                  await client.create_batch_job("file-1", "primary")

              assert provider_calls == ["provider"]
              assert recorder_calls == []
              assert exc_info.value.response_data == {
                  "operation": "Batch creation",
                  "phase": "persistence",
                  "endpoint_alias": "primary",
                  "batch_id": overlong_id,
                  "observation_order": 3,
                  "error_type": "ValueError",
              }
          ''',
              encoding="utf-8",
          )
          PY
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify focused and complete quality gates
        run: |
          set -euo pipefail
          uv run pytest -q tests/test_remote_identifier_limits.py
          uv run pytest -q -m "not integration"
          uv run python -m compileall -q pg_llm_batch
          uv run ruff check pg_llm_batch tests
          uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration" \
            --cov=pg_llm_batch --cov-report=term-missing --cov-fail-under=100
          uv lock --check
          uv build --no-sources
          git diff --check
      - name: Verify container definitions
        run: |
          set -euo pipefail
          docker compose config >/dev/null
          docker build --tag pg-llm-batch:identifier-limits .
          docker build --tag pg-llm-batch-postgres:identifier-limits docker/postgres
      - name: Record green evidence and remove one-shot workflow
        env:
          BRANCH_NAME: agent/persist-remote-batch-lifecycle
          VERIFIED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat > docs/superpowers/evidence/2026-08-04-remote-identifier-limits-green.md <<EOF
          # Remote Identifier Length Green Evidence

          Verified pre-evidence head: \`${VERIFIED_HEAD}\`.

          The schema-aligned identifier implementation passed focused boundary tests, the complete non-integration suite, Python compilation, Ruff, 100% production docstring/statement/branch coverage, lockfile verification, wheel/source-distribution construction, Docker Compose validation, and both runtime image builds. Endpoint aliases now fail before reservation or provider I/O, and provider batch IDs are validated before custom lifecycle recorders run.
          EOF
          rm .github/workflows/one-shot-remote-identifier-limits-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pg_llm_batch/db.py \
            pg_llm_batch/durable_client.py \
            tests/test_remote_identifier_limits.py \
            docs/remote-batch-lifecycle.md \
            CHANGELOG.md \
            docs/superpowers/evidence/2026-08-04-remote-identifier-limits-green.md \
            .github/workflows/one-shot-remote-identifier-limits-green.yml
          git commit -m "fix(lifecycle): enforce remote identifier limits"
          git push origin "HEAD:${BRANCH_NAME}"
