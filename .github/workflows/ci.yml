name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          prune-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run unit tests
        run: uv run pytest -q -m "not integration"

  quality-gates:
    name: Coverage, docstrings, lint, and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          prune-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Compile source
        run: uv run python -m compileall -q pg_llm_batch
      - name: Lint
        run: uv run ruff check pg_llm_batch tests
      - name: Enforce docstring coverage
        run: uvx --from 'interrogate==1.7.0' interrogate --fail-under 100 pg_llm_batch
      - name: Enforce line coverage
        run: >-
          uv run --with pytest-cov==7.1.0 pytest -q -m "not integration"
          --cov=pg_llm_batch --cov-report=term-missing --cov-fail-under=100
      - name: Verify lockfile freshness
        run: uv lock --check
      - name: Build distribution artifacts without workspace sources
        run: uv build --no-sources

  container-builds:
    name: Container builds and PostgreSQL runtime smokes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Python for live PostgreSQL integration
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv for live PostgreSQL integration
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          prune-cache: true
      - name: Install locked dependencies for live PostgreSQL integration
        run: uv sync --locked
      - name: Validate Compose configuration
        run: docker compose config >/dev/null
      - name: Build component image
        run: docker build --tag pg-llm-batch:ci .
      - name: Build PostgreSQL image
        run: docker build --tag pg-llm-batch-postgres:ci docker/postgres
      - name: Build pg_tiktoken PostgreSQL integration image
        run: >-
          docker build --target with-tiktoken
          --tag pg-llm-batch-postgres-integration:ci docker/postgres
      - name: Verify PostgreSQL container log routing
        run: bash tests/smoke_postgres_container_logging.sh
      - name: Run legacy SQL cleanup integration smoke
        run: bash tests/smoke_legacy_sql_cleanup.sh
      - name: Prepare ephemeral PostgreSQL integration credential
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          credential_file="$RUNNER_TEMP/pg-llm-batch-postgres-integration.env"
          umask 077
          printf 'POSTGRES_USER=pgllm\nPOSTGRES_PASSWORD=%s\nPOSTGRES_DB=pgllm\n' \
            "$password" > "$credential_file"
          printf 'PG_LLM_BATCH_TEST_DSN=postgresql://pgllm:%s@127.0.0.1:5432/pgllm\n' \
            "$password" >> "$GITHUB_ENV"
      - name: Start live PostgreSQL integration fixture
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name pg-llm-batch-postgres-integration \
            --env-file "$RUNNER_TEMP/pg-llm-batch-postgres-integration.env" \
            --publish 127.0.0.1:5432:5432 \
            pg-llm-batch-postgres-integration:ci
      - name: Wait for live PostgreSQL integration fixture
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            status="$(docker inspect --format='{{json .State.Health.Status}}' \
              pg-llm-batch-postgres-integration)"
            if [ "$status" = '"healthy"' ]; then
              exit 0
            fi
            if [ "$status" = '"unhealthy"' ]; then
              docker logs pg-llm-batch-postgres-integration
              exit 1
            fi
            sleep 2
          done
          docker logs pg-llm-batch-postgres-integration
          exit 1
      - name: Verify pg_tiktoken integration readiness
        shell: bash
        run: |
          set -euo pipefail
          docker exec pg-llm-batch-postgres-integration \
            psql -U pgllm -d pgllm -v ON_ERROR_STOP=1 -tAc \
            "SELECT bool_and(is_ready) FROM pg_llm_batch_health_check() WHERE component IN ('database','pg_tiktoken','com_config')" \
            | grep -q t
      - name: Run live PostgreSQL integration suite
        run: uv run pytest -q -m integration
      - name: Tear down live PostgreSQL integration fixture
        if: always()
        shell: bash
        run: |
          docker rm --force pg-llm-batch-postgres-integration >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/pg-llm-batch-postgres-integration.env"
